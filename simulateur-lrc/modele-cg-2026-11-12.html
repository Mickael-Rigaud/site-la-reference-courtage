/* 07/10/2026 — CE QUE VOIENT LE COURTIER ET CHARLOTTE. Les primes sont
   SAISIES à l'année et CALCULÉES au mois. Charlotte recopie ces lignes dans la
   fiche Zou, dont le champ attend un montant mensuel : on écrit donc les deux
   chiffres côte à côte, chacun avec son unité en toutes lettres. Plus aucune
   confusion possible à la saisie, dans un sens comme dans l'autre. */
function primesTxt(i){
  const an=(data.primes&&data.primes[i])||0;
  if(!(an>0)) return 'aucune';
  return `${fmtEUR(an)} /an (soit ${fmtEUR(Math.round(primesMois(data,i)))} /mois)`;
}
function recap(){
  /* 07/10/2026 : sur un rachat, cinq questions d'achat ne sont PAS posées —
     leurs écrans sortent du parcours. Mais une réponse donnée AVANT de changer
     d'avis reste dans « data » : sans ce garde-fou — celui que taux_actuel avait
     déjà — la fiche que Charlotte recopie dans Zou annonçait « compromis
     signé » et « primo-accédant : Oui » sur une simple renégociation. */
  const RACHAT=data.projet==='renego';
  /* 27/10/2026 : 'CDD' et 'Intérim' remplacent l’unique 'CDD/Intérim'. Ces
     libellés-là ne sont pas cosmétiques : ils partent dans emprunteur_1 /
     emprunteur_2, et le remplissage de Zou les retrouve des mois plus tard pour
     en déduire le type de contrat. Son ancienne clé 'CDD/Intérim' doit y
     RESTER — les leads déjà capturés la portent pour toujours — et les deux
     nouvelles s’y AJOUTER. Une clé absente ne se plaint pas : la fiche affiche
     « — » et le courtier croit que le prospect n’a pas répondu. */
  const st=v=>({cdi:'CDI',essai:'CDI période essai',fonct:'Fonctionnaire',cdd:'CDD',interim:'Intérim',liberal:'Libéral',tns:'TNS/gérant',auto:'Auto-entrepreneur',retraite:'Retraité',autre:'Sans emploi/autre'}[v]||v||'');
  /* Libellés lisibles : le back-office affiche ces valeurs telles quelles au courtier. */
  const PR={principale:'Résidence principale',secondaire:'Résidence secondaire',locatif:'Investissement locatif',renego:'Renégociation / rachat'};
  const NB={ancien:'Logement ancien',neuf:'Appartement neuf',terrain:'Terrain + construction',autre:'Autre'};
  const AV={reflexion:'Se renseigne',recherche:'Recherche active',offre:'Offre faite',acceptee:'Offre acceptée',compromis:'Compromis signé'};
  const RG={idf:'Île-de-France',ara:'Auvergne-Rhône-Alpes',sud:'PACA / Sud',ouest:'Ouest',na:'Nouvelle-Aquitaine',occ:'Occitanie',ne:'Grand Est / Hauts-de-France',autre:'Autre / DOM-TOM'};
  const LG={locataire:'Locataire',proprio:'Propriétaire',gratuit:'Hébergé à titre gratuit',fonction:'Logé par l’employeur'};
  const CT={conso:'Crédit conso',auto:'Crédit auto',loa:'LOA / Leasing',immo:'Prêt immobilier',plusieurs:'Plusieurs types'};
  const autres=(data.autresType&&data.autresType!=='aucun')?`${data.autresType} ${lab('autresMontant')}`:'aucun';
  const emp=i=>`${data.age[i]||'?'} ans, ${st(data.statut[i])}, ${lab('salaire'+i)||'—'}`+(data.primes[i]?` + primes ${primesTxt(i)}`:'');

  const R={
    projet:PR[data.projet]||data.projet||'—',
    type_de_bien:RACHAT?'—':(NB[data.natureBien]||'—'),
    avancement:RACHAT?'—':(AV[data.avancement]||data.avancement||'—'),
    primo_accedant:RACHAT?'—':(data.primo?(estPrimo(data)?'Oui':'Non'):'—'),   // au sens PTZ : Oui = primo-accédant
    region:RACHAT?'—':(RG[data.region]||data.region||'—'),
    /* 27/10/2026 — LE GARDE-FOU QUI MANQUAIT, ET C'EST LE MÊME QUE CELUI DE
       taux_actuel ET DU RACHAT JUSTE AU-DESSUS. L'écran du prix n'est PAS posé
       sur un terrain + construction (`when:d=>d.natureBien!=='terrain'`), et
       prixTotal() ignore `prix` dans ce cas. Mais `budget` partait sans garde :
       un prospect qui répond « Logement ancien » puis « 300 000 € », revient sur
       l'écran du type de bien (bouton retour, ou un clic sur « Projet » dans le
       fil — go() et renderChoice() ne purgent AUCUNE réponse) et choisit
       « Terrain + construction », envoyait au courtier un lead portant TROIS
       prix : budget 300 000 €, terrain 90 000 €, construction 185 000 €. La
       fiche Zou recevait les trois, et le remplissage annonçait un prix de bien
       qui ne correspondait à rien. Ici on ne garde que la réponse qui a encore
       un sens ; le remplissage, lui, a sa propre garde pour les leads DÉJÀ
       capturés (extension/content/zou-prefill.js, construire()). */
    budget:data.natureBien==='terrain'?'—':(lab('prix')||'—'),
    /* 07/10/2026 : le capital réellement emprunté — celui que le prospect lit
       désormais sous « Emprunt estimé ». La colonne « capacité » de la fiche
       garde son sens : elle n'est pas réaffectée, sinon tous les leads déjà
       en base changeraient de signification après coup. */
    emprunt_estime:(data.resultat&&data.resultat.montantAFinancer>0)?fmtEUR(data.resultat.montantAFinancer):'—',
    /* Rachat : le taux en cours, OU le fait que le client l'ignore. Le courtier
       doit savoir lequel des deux : dans le second cas il pose la question. */
    taux_actuel:data.projet!=='renego' ? '—'
      : (data.tauxActuel>0 ? fmtTaux(data.tauxActuel)
        : (lab('tauxActuel') ? 'Taux actuel inconnu du client — à demander à l’appel' : '—')),
    travaux:RACHAT?'—':(lab('travaux')||'Pas de travaux'),
    duree_souhaitee:data.duree?data.duree+' ans':'—',
    logement_actuel:LG[data.logement]||data.logement||'—',
    loyer_ou_mensualite:lab('loyer')||'—',
    logement_actuel_devenir:data.rpActuelle?({vendre:'Vente prévue',louer:'Mise en location prévue',garder:'Conservé sans location'}[data.rpActuelle]):'—',
    logement_actuel_valeur:data.rpActuelle==='vendre'?(lab('rpValeurVente')||'—'):'—',
    logement_actuel_loyer_espere:data.rpActuelle==='louer'?(lab('rpLoyerLocation')||'—'):'—',
    /* Libellés repris tels quels dans « Avancement de la vente » côté fiche. */
    vente_avancement:data.venteAvancement?({pas_en_vente:'Pas en vente',demarches:'Démarches débutées',
      mandat:'Sous mandat de vente exclusif',offre_acceptee:'Offre acceptée',compromis:'Compromis signé'}[data.venteAvancement]):'—',
    vente_capital_restant_du:data.rpActuelle==='vendre'?(lab('rpCRD')||'—'):'—',
    pret_relais:data.pretRelais?({oui:'Oui',non:'Non',nsp:'Ne sait pas encore'}[data.pretRelais]):'—',
    apport_degage_par_la_vente:apportVente(data)>0
      ? fmtEUR(apportVente(data))+' (70 % de la valeur estimée − capital restant dû)'
      : (data.rpActuelle==='vendre' ? 'aucun — le capital restant dû dépasse 70 % de la valeur' : '—'),
    enfants_a_charge:data.enfants||'—',
    nombre_emprunteurs:data.structure==='deux'?'Deux':'Un seul',
    emprunteur_1:emp(0),
    emprunteur_2:data.structure==='deux'?emp(1):'—',
    revenus_locatifs:locCumul(data,'Loyer')>0?fmtEUR(locCumul(data,'Loyer'))+' /mois':'—',
    autres_revenus:autres,
    credits_en_cours:totalCredits(data)>0?fmtEUR(totalCredits(data))+' /mois':'Aucun',
    type_de_credit:detailCredits(data),
    nombre_de_credits:String(Array.from({length:CREDITS_MAX},(_,k)=>k+1).filter(i=>(data['credit'+i+'Montant']||0)>0).length),
    regroupement_credits:data.regroupement?(data.regroupement==='oui'?'OUI — intéressé par une étude':'Non'):'—',
    pension_versee:lab('pensionv')||'—',
    apport:lab('apport')||'—',
    apport_attendu: apportInsuffisant(data) ? fmtEUR(apportAttendu(data)) : '—',
    apport_potentiel: (data.apportComplement==='oui' && complementApport(data)>0)
      ? fmtEUR(complementApport(data)) : '—',
    apport_complement_possible: data.apportComplement
      ? (data.apportComplement==='oui' ? 'Oui' : 'Non') : '—',
    apport_confirme_superieur:data.apportIncoherent==='confirme'?'Oui — le client confirme un apport supérieur au prix du bien':'—',
    epargne_restante:lab('epargne')||'—',
    /* PTZ + assurance (décision 10, 07/09/2026) : « — » quand non applicable. */
    ...recapPtz()
  };
  /* Terrain + construction : les deux montants séparés (l'apport attendu se
     calcule sur le seul terrain). */
  if(data.natureBien==='terrain'){
    R.prix_terrain=lab('prixTerrain')||'—';
    R.prix_construction=lab('prixConstruction')||'—';
  }
  /* Apport : ce qui est attendu, et ce que le client dit pouvoir réunir. */
  if(apportAttendu(data)>0){
    R.apport_attendu=fmtEUR(apportAttendu(data));
    if(data.apportComplement) R.apport_complement_possible=data.apportComplement==='oui'?'Oui':'Non';
    if(data.apportComplement==='oui') R.apport_potentiel=fmtEUR(apportAttendu(data))+' (pas encore constitué)';
    if(data.ouvertNeuf) R.ouvert_au_neuf=data.ouvertNeuf==='oui'?'Oui':'Non';
  }
  /* Patrimoine locatif : uniquement s'il existe, pour ne pas polluer la fiche. */
  if(data.aDejaLocatif==='oui'){
    R.patrimoine_nb_biens=data.nbBiensLoc||'—';
    R.patrimoine_detail=locDetail(data).join(' | ')||'—';
    R.patrimoine_valeur=fmtEUR(locCumul(data,'Valeur'));
    R.patrimoine_capital_restant_du=fmtEUR(locCumul(data,'CRD'));
    R.patrimoine_mensualite=fmtEUR(locCumul(data,'Mensualite'))+' /mois';
  }
  /* 03/11/2026 : LE CODE PROMO PART AVEC LA FICHE. Sans cette ligne, le bandeau
     promettrait au prospect une remise dont le courtier n'aurait aucune trace —
     il la découvrirait au téléphone, de la bouche du client. */
  if(CODE_PROMO) R['Code promo'] = CODE_PROMO+' — −10 % sur les honoraires de courtage';
  return R;
}
/* Résumé lisible, transmis au worker avec la fiche (champ "message") */
function summary(){
  /* Même garde-fou que dans recap() : pas de réponse d'achat sur un rachat. */
  const RACHAT=data.projet==='renego';
  const res=data.resultat, eur=n=>Number(n).toLocaleString('fr-FR')+' €';
  const feu={vert:'🟢 PROJET FAISABLE',orange:'🟠 PROJET À OPTIMISER',rouge:'🔴 PROJET À ÉTUDIER'}[res.feu];
  const P={principale:'Résidence principale',secondaire:'Résidence secondaire',locatif:'Investissement locatif',neuf:'Achat neuf / VEFA',renego:'Renégociation / rachat'}[data.projet]||data.projet||'';
  /* Sur un rachat la question n'est pas posée : un tiret vaut mieux qu'un blanc,
     qui se lirait comme une réponse manquante. */
  const A=RACHAT?'—':({reflexion:'se renseigne',recherche:'recherche active',offre:'offre faite',acceptee:'offre acceptée',compromis:'compromis signé'}[data.avancement]||data.avancement||'—');
  const L={locataire:'locataire',proprio:'propriétaire',gratuit:'hébergé à titre gratuit',fonction:'logé par l\'employeur'}[data.logement]||data.logement||'';
  const RG=RACHAT?'—':({idf:'Île-de-France',ara:'Auvergne-Rhône-Alpes',sud:'PACA / Sud',ouest:'Ouest',na:'Nouvelle-Aquitaine',occ:'Occitanie',ne:'Grand Est / HdF',autre:'Autre / DOM-TOM'}[data.region]||data.region||'—');
  const st=v=>({cdi:'CDI',essai:'CDI période essai',fonct:'Fonctionnaire',cdd:'CDD',interim:'Intérim',liberal:'Libéral',tns:'TNS/gérant',auto:'Auto-entrepreneur',retraite:'Retraité',autre:'Sans emploi/autre'}[v]||v||'?');
  const nom=[lead.prenom,lead.nom].filter(Boolean).join(' ')||'Lead simulateur';
  const emp1=`Emprunteur 1 : ${data.age[0]||'?'} ans, ${st(data.statut[0])}, ${lab('salaire0')}`+(data.primes[0]?` (+ primes ${primesTxt(0)})`:'');
  const emp2=data.structure==='deux'?`\n  • Emprunteur 2 : ${data.age[1]||'?'} ans, ${st(data.statut[1])}, ${lab('salaire1')}`+(data.primes[1]?` (+ primes ${primesTxt(1)})`:''):'';
  const autres=(data.autresType&&data.autresType!=='aucun')?`${data.autresType} ${lab('autresMontant')}`:'aucun';
  const CT={conso:'conso',auto:'auto',loa:'LOA / Leasing',immo:'prêt immo',plusieurs:'plusieurs types'}[data.creditType]||'';
  const patrimoine = data.aDejaLocatif==='oui' ? [
   ``,
   `🏘️ PATRIMOINE LOCATIF EXISTANT`,
   `  • ${data.nbBiensLoc||'?'} bien(s)    •    Loyers perçus : ${locCumul(data,'Loyer')>0?fmtEUR(locCumul(data,'Loyer')):'—'}`,
   `  • Valeur : ${fmtEUR(locCumul(data,'Valeur'))}    •    CRD : ${fmtEUR(locCumul(data,'CRD'))}    •    Mensualité crédit : ${fmtEUR(locCumul(data,'Mensualite'))}`
  ] : [];
  return [
   `${feu}  —  endettement ${res.tauxEndettement} %`,
   `━━━━━━━━━━━━━━━━━━━━━━`,
   `👤 CLIENT : ${nom}`,
   `📧 ${lead.email||'—'}    📞 ${lead.tel||'—'}`,
   ``,
   /* 07/10/2026 : le montant EMPRUNTÉ en tête, c'est celui qui est affiché au
      client ; la capacité théorique reste à côté, pour le courtier. */
   `💶 Emprunt estimé : ${eur(res.montantAFinancer)}    •    Capacité d'emprunt estimée : ${eur(res.capaciteEmprunt)}`,
   `📊 Endettement : ${res.tauxEndettement} %    •    Mensualité estimée : ${eur(res.mensualiteEstimee)}`,
   `💰 Revenus pondérés : ${eur(res.revenusPonderes)}/mois`,
   `🛡️ Assurance estimée : ${eur(res.assurance||0)}/mois (${res.assuranceDansTaux?"incluse dans l'endettement":"NON comptée dans le taux ci-dessus"})`,
   ...(res.ptzTexte?[`🏦 PTZ : ${res.ptzTexte}    •    Mensualité sans PTZ : ${eur(res.mensualiteSansPtz)}`]:[]),
   /* Feu orange « par prudence » (décision 7) : rien à retravailler, un point à
      confirmer — ni « BLOCAGES », ni relance à trois mois. */
   ...(res.prudencePtz
        ? [``,`✅ Dossier vert sans PTZ — feu orange par prudence : ${res.prudenceMotif}. À confirmer, pas à relancer.`]
        : (res.feu!=='vert'?[``,`⚠️ BLOCAGES : ${res.blocages}`,`🔁 Relance conseillée dans ${res.relanceMois} mois`]:[])),
   ``,
   `🏡 PROJET`,
   `  • ${P}${(!RACHAT&&estPrimo(data))?' (primo-accédant)':''} — ${RG}`,
   `  • Budget : ${lab('prix')}    •    Travaux : ${RACHAT?'—':(lab('travaux')||'—')}`,
   ...(data.projet==='renego'?[`  • Taux actuel : ${data.tauxActuel>0?fmtTaux(data.tauxActuel):'NON CONNU du client — à demander à l’appel'}`]:[]),
   `  • Avancement : ${A}    •    Enfants à charge : ${data.enfants}`,
   ``,
   `👥 EMPRUNTEURS`,
   `  • ${emp1}${emp2}`,
   ``,
   `💼 FINANCES`,
   `  • Apport : ${lab('apport')}    •    Épargne restante : ${lab('epargne')||'—'}`,
   `  • Crédits en cours : ${detailCredits(data)}    •    Pension versée : ${lab('pensionv')||'—'}`,
   `  • Autres revenus : ${autres}    •    Logement actuel : ${L}${data.loyer?` (${lab('loyer')})`:''}`,
   `  • Durée souhaitée : ${data.duree} ans`,
   ...patrimoine,
   ``,
   `— Lead Meta : ${lead.leadId||'—'}    •    Courtier : ${lead.courtierNom||lead.courtier||'—'}`
  ].join('\n');
}
/* Mail HTML soigné (relayé tel quel par le canal courtier : Gmail body = {{html}}) */
function resultHtml(){
  /* Même garde-fou que dans recap() : pas de réponse d'achat sur un rachat. */
  const RACHAT=data.projet==='renego';
  const res=data.resultat, eur=n=>Number(n).toLocaleString('fr-FR')+' €';
  const c={vert:['#0C806E','#e6f1ee','🟢 Projet faisable'],orange:['#e0902f','#fdf1e3','🟠 Projet à optimiser'],rouge:['#d0543f','#fcebe9','🔴 Projet à étudier']}[res.feu];
  const P={principale:'Résidence principale',secondaire:'Résidence secondaire',locatif:'Investissement locatif',neuf:'Achat neuf / VEFA',renego:'Renégociation / rachat'}[data.projet]||data.projet||'';
  const st=v=>({cdi:'CDI',essai:'CDI période essai',fonct:'Fonctionnaire',cdd:'CDD',interim:'Intérim',liberal:'Libéral',tns:'TNS/gérant',auto:'Auto-entrepreneur',retraite:'Retraité',autre:'Sans emploi/autre'}[v]||v||'?');
  const LG={locataire:'locataire',proprio:'propriétaire',gratuit:'hébergé gratuit',fonction:'logé employeur'}[data.logement]||data.logement||'—';
  const nom=[lead.prenom,lead.nom].filter(Boolean).join(' ')||'Lead simulateur';
  const row=(k,v)=>`<tr><td style="padding:4px 12px 4px 0;color:#6b7772;white-space:nowrap;vertical-align:top">${k}</td><td style="padding:4px 0;font-weight:600">${v}</td></tr>`;
  /* 07/10/2026 : les primes figurent désormais dans le mail, à l'année ET au
     mois. C'est ce mail que Charlotte a sous les yeux pour remplir Zou — elle
     ne doit pas avoir à diviser de tête. */
  const empP=i=>(data.primes&&data.primes[i]>0)?` + primes ${primesTxt(i)}`:'';
  const emp=`${data.age[0]||'?'} ans, ${st(data.statut[0])}, ${lab('salaire0')}${empP(0)}`+(data.structure==='deux'?`  |  ${data.age[1]||'?'} ans, ${st(data.statut[1])}, ${lab('salaire1')}${empP(1)}`:'');
  const patr=data.aDejaLocatif==='oui'?row('🏘️ Patrimoine locatif',`${data.nbBiensLoc||'?'} bien(s) · loyers ${locCumul(data,'Loyer')>0?fmtEUR(locCumul(data,'Loyer')):'—'} · valeur ${fmtEUR(locCumul(data,'Valeur'))} · CRD ${fmtEUR(locCumul(data,'CRD'))} · mensualité ${fmtEUR(locCumul(data,'Mensualite'))}`):'';
  return `<div style="font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:600px;margin:auto;color:#1a2b28">`+
   `<div style="background:${c[1]};border-left:5px solid ${c[0]};border-radius:10px;padding:16px 18px;margin-bottom:14px">`+
     `<div style="font-size:20px;font-weight:800;color:${c[0]}">${c[2]}</div>`+
     `<div style="font-size:14px;color:#6b7772;margin-top:3px">Taux d'endettement estimé : <b style="color:#1a2b28">${res.tauxEndettement} %</b></div>`+
     (res.prudencePtz?`<div style="font-size:13px;color:#1a2b28;margin-top:7px;font-weight:600">✅ Dossier vert sans PTZ — feu orange par prudence : ${esc(res.prudenceMotif)}. À confirmer, pas à relancer.</div>`:'')+
     `</div>`+
   `<table role="presentation" style="width:100%;border-collapse:collapse;margin-bottom:14px"><tr>`+
     /* 07/10/2026 : « Emprunt estimé » comme sur la page, la capacité en
        dessous en petit — le courtier a besoin des deux. */
     `<td style="width:49%;background:#fff;border:1px solid #e3ddd4;border-radius:10px;padding:13px;text-align:center"><div style="font-size:19px;font-weight:800;color:${c[0]}">${eur(res.montantAFinancer)}</div><div style="font-size:12px;color:#6b7772">Emprunt estimé<br><span style="font-size:11px">capacité estimée : ${eur(res.capaciteEmprunt)}</span></div></td>`+
     `<td style="width:2%"></td>`+
     `<td style="width:49%;background:#fff;border:1px solid #e3ddd4;border-radius:10px;padding:13px;text-align:center"><div style="font-size:19px;font-weight:800;color:${c[0]}">${eur(res.mensualiteEstimee)}</div><div style="font-size:12px;color:#6b7772">Mensualité estimée</div></td>`+
   `</tr></table>`+
   `<table role="presentation" style="width:100%;border-collapse:collapse;font-size:14px;line-height:1.45">`+
     row('👤 Client',nom)+
     row('📧 Contact',`${esc(lead.email||'—')} &nbsp; 📞 ${esc(lead.tel||'—')}`)+
     row('🏡 Projet',`${P}${(!RACHAT&&estPrimo(data))?' (primo)':''} — budget ${lab('prix')}${(!RACHAT&&lab('travaux'))?` + travaux ${lab('travaux')}`:''}`)+
     (data.projet==='renego'?row('📉 Taux actuel',data.tauxActuel>0?fmtTaux(data.tauxActuel):'<b style="color:#d0543f">non connu du client — à demander à l’appel</b>'):'')+
     row('👥 Emprunteur(s)',emp)+
     row('💰 Revenus',`${eur(res.revenusPonderes)}/mois pondérés`)+
     row('💼 Apport / épargne',`${lab('apport')} · épargne ${lab('epargne')||'—'}`)+
     row('📉 Charges',`crédits ${detailCredits(data)} · pension ${lab('pensionv')||'—'}`)+
     patr+
     row('🏠 Logement actuel',`${LG}${data.loyer?` (${lab('loyer')})`:''}`)+
     row('⏱️ Durée',`${data.duree} ans`)+
     row('🛡️ Assurance',`${eur(res.assurance||0)}/mois estimés, ${res.assuranceDansTaux?"inclus dans l'endettement":"non comptés dans le taux ci-dessus"}`)+
     (res.ptzTexte?row('🏦 PTZ',`${res.ptzTexte} · mensualité sans PTZ ${eur(res.mensualiteSansPtz)}`):'')+
   `</table>`+
   `<p style="font-size:12px;color:#9aa39f;margin-top:16px">Simulateur Pretto Galaxie · Lead Meta ${lead.leadId||'—'} · Courtier ${lead.courtierNom||lead.courtier||'—'} · Estimation indicative non contractuelle.</p></div>`;
}
/* Identifiant de la fiche creee par le worker. Tant qu'il est nul, chaque
   passage sur l'ecran de resultat cree un lead ; des qu'il est connu, on met a
   jour CELUI-LA. C'est ce qui evite qu'un prospect qui corrige un chiffre
   apparaisse trois fois dans le back-office de son courtier. */
let LEAD_ID = null;
/* Jeton remis par le worker avec l'identifiant. Il prouve que la mise a jour
   porte bien sur NOTRE fiche : les id sont sequentiels, sans lui un curieux
   ecraserait la simulation du voisin en changeant un chiffre. */
let MAJ_TOKEN = '';
/* Passe a vrai des que le verdict est parti. Il sert a distinguer la PREMIERE
   transmission d'une vraie correction : si une fiche de contact existe deja,
   la route appelee est /maj, mais pour le prospect c'est bien son premier
   envoi — lui annoncer une « mise a jour » n'aurait aucun sens. */
let resultatDejaEnvoye = false;
/* Repli : une seule tentative. Voir le commentaire dans sendToCourtier(). */
let repliCreation = false;
/* Un seul nouvel essai de /maj quand le refus ne prouve PAS la disparition de
   la fiche (jeton perime, plafond par IP, panne). Voir sendToCourtier(). */
let majReessai = false;
/* Fiche de contact abandonnee par un repli en creation : son identifiant part
   avec la nouvelle fiche (remplace_id) pour que le serveur la marque et que le
   back-office ne compte pas deux prospects pour une seule personne. */
let ORPHELINE = null;

/* ==================== CAPTURE DU CONTACT A LA SAISIE ====================
   Demande de Christophe : le contact part chez le courtier DES que le visiteur
   valide ses coordonnees, puis la MEME fiche se complete au verdict — jamais
   deux fiches pour une personne.

   POURQUOI C'EST A L'ARRET AUJOURD'HUI (CAPTURE_PRECOCE = false). La route
   /simulateur du serveur exige un feu, et quoi qu'on lui envoie elle execute
   inconditionnellement trois choses : le mail de verdict AU PROSPECT, deux
   evenements a l'API Conversions de Meta, et l'ouverture d'un dossier Apollo
   en vert/orange. Capturer par cette route voudrait donc dire annoncer par
   mail un « feu rouge » a quelqu'un qui n'a pas encore repondu a une seule
   question, et doubler la mesure publicitaire. Mieux vaut un contact capture
   proprement qu'un mail parti pour rien : en attendant, la mesure d'abandon
   existante (signalerEtape('coordonnees')) continue de dire combien de
   visiteurs atteignent cet ecran.
   07/10/2026, MEME JOUR — C'EST FAIT, LA CAPTURE EST ALLUMÉE. Le serveur
   (galaxie-leads) accepte désormais partiel:1 sur /simulateur : il insère la
   fiche SANS feu, sans aucun mail, sans Meta et sans Apollo, et dédoublonne
   lui-même sur l'adresse mail. /simulateur/maj traite une fiche sans feu comme
   un PREMIER verdict (mail au prospect, mail au courtier, mail à Christophe).
   ⚠ LES DEUX DOIVENT PARTIR DANS LE MÊME ENVOI : si cette page est mise en
   ligne avant le serveur, la capture reçoit une erreur, LEAD_ID reste nul et
   le verdict repart en création normale — rien n'est perdu, mais rien n'est
   capturé non plus. */
const CAPTURE_PRECOCE = true;
let capturePromesse = null;
/* Délai de garde de la capture. Une requête PENDUE — le serveur accepte la
   connexion et ne répond jamais, cas très ordinaire en 4G ou en tunnel — n'est
   pas une erreur : elle ne se résout JAMAIS. Sans ce délai, sendToCourtier()
   l'attendait indéfiniment : la simulation était calculée, le feu affiché, et
   le lead n'arrivait nulle part — alors que sans capture il serait arrivé. */
const CAPTURE_DELAI_MS = 4000;

/* L'identifiant de la fiche ne vit qu'en memoire de page : un rechargement, un
   second onglet ou un retour en arriere en creeraient une deuxieme. On le
   retient donc CHEZ LE VISITEUR, attache a l'adresse mail qu'il a saisie et
   pour 24 h seulement — une autre personne sur le meme telephone ne tombera
   jamais sur la fiche de la precedente. */
const CLE_FICHE = 'galaxie_fiche';
/* 07/10/2026 : on retient aussi LE COURTIER et L'ORIGINE. Le domaine est
   mutualisé (un seul localStorage pour tous les ?c=<slug>) : reprendre la fiche
   ouverte chez un autre courtier la faisait réécrire avec le projet simulé
   ici, sans jamais la rattacher au bon courtier — Christophe ne voyait pas le
   lead, et l'autre courtier lisait des chiffres qui n'étaient pas les siens. */
function memoFiche(){
  if(!CAPTURE_PRECOCE || LEAD_ID===null || !lead.email) return;
  memo(CLE_FICHE, JSON.stringify({id:LEAD_ID, t:MAJ_TOKEN, e:lead.email.trim().toLowerCase(),
    c:SLUG, o:ORIGINE||'', d:Date.now()}));
}
function relireFiche(){
  if(!CAPTURE_PRECOCE || LEAD_ID!==null || !lead.email) return;
  try{
    const f=JSON.parse(memo(CLE_FICHE)||'null');
    if(f && f.id && f.e===lead.email.trim().toLowerCase()
       && f.c===SLUG && (f.o||'')===(ORIGINE||'')
       && (Date.now()-f.d)<864e5){ LEAD_ID=f.id; MAJ_TOKEN=f.t||''; }
  }catch(e){}
}
function capturerContact(){
  if(!CAPTURE_PRECOCE || capturePromesse || MODE_TEST || !CONFIG.ENRICH_ENDPOINT) return;
  if(LEAD_ID!==null || !lead.email) return;
  const nom=[lead.prenom,lead.nom].filter(Boolean).join(' ')||'Lead simulateur';
  /* Charge utile volontairement courte : AUCUN chiffre de simulation, rien qui
     n'ait ete saisi par le visiteur. En revanche les colonnes que /maj ne
     reecrit jamais (origine, apporteur, utm, source_url) doivent partir DES
     ICI, sinon elles resteront vides pour toujours. */
  /* 07/10/2026 — AUCUN FEU n'est envoyé ici. La fiche n'a pas de verdict : lui
     en poser un par défaut (« rouge ») faisait croire au serveur, au moment du
     vrai verdict, que rien n'avait changé. Le prospect ne recevait alors jamais
     son récapitulatif, le courtier n'était pas prévenu, Christophe non plus —
     et la page lui annonçait pourtant un mail qui ne partait pas. */
  const appel = fetch(CONFIG.ENRICH_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({partiel:1,
      prenom:lead.prenom, nom_famille:lead.nom, client:nom, email:lead.email, telephone:lead.tel,
      ...envoiCourtier(), leadId:lead.leadId||'',
      origine:ORIGINE||undefined, apporteur_ref:APPORTEUR_REF||undefined, apporteur_nom:APPORTEUR_NOM||undefined,
      utm:Object.fromEntries([...P].filter(([k])=>/^utm_|^fbclid$/.test(k))),
      source_url:location.href, ts:new Date().toISOString()})})
    .then(r=>r.json().catch(()=>({})))
    .then(j=>{ if(j&&j.id){ LEAD_ID=j.id; MAJ_TOKEN=j.maj_token||''; memoFiche(); } })
    .catch(()=>{});
  /* Le verdict ne dépend JAMAIS de cet appel : passé le délai de garde on
     continue sans fiche, et la création normale reprend la main. Un doublon
     éventuel vaut mieux qu'un lead perdu. */
  capturePromesse = Promise.race([appel, new Promise(r=>setTimeout(()=>r(null), CAPTURE_DELAI_MS))]);
}

async function sendToCourtier(){
  const box=()=>document.getElementById('sending');
  /* Si une capture de contact est encore en vol, on l'attend. Sans cela un
     parcours tres rapide partirait en CREATION pendant que la capture en cree
     une autre : deux fiches pour une seule personne, exactement ce qu'il ne
     faut pas. Si la capture a echoue, LEAD_ID reste nul et on retombe sur la
     creation normale — repli correct. */
  if(capturePromesse) await Promise.allSettled([capturePromesse]);
  const R=recap(), res=data.resultat, nom=[lead.prenom,lead.nom].filter(Boolean).join(' ')||'Lead simulateur';
  const maj = LEAD_ID !== null;
  /* Premiere transmission du verdict sur une fiche qui n'existait qu'a l'etat
     de contact : on parle de transmission, pas de mise a jour. */
  const premier = maj && !resultatDejaEnvoye;
  let sent=false;
  /* Un seul canal de sortie : le worker. L'ancien envoi Web3Forms par clé
     (?w3f=<clé>) est supprimé depuis le 21/09/2026 — voir MODE_TEST. */
  if(CONFIG.ENRICH_ENDPOINT && !MODE_TEST){ sent=true;
    const feu={vert:'\u{1F7E2} FAISABLE',orange:'\u{1F7E0} \u00C0 OPTIMISER',rouge:'\u{1F534} \u00C0 \u00C9TUDIER'}[res.feu];
    if(box()) box().innerHTML = (maj && !premier)
      ? '<span class="dot"></span> Mise \u00e0 jour de votre demande\u2026'
      : '<span class="dot"></span> Transmission de votre projet \u00e0 votre courtier\u2026';
    fetch(CONFIG.ENRICH_ENDPOINT + (maj?'/maj':''),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:LEAD_ID, maj_token:MAJ_TOKEN, remplace_id:ORPHELINE||undefined,
        subject:`Simulateur ${feu} \u2014 ${nom} (${res.tauxEndettement}%)`, html:resultHtml(), message:summary(),
        prenom:lead.prenom, nom_famille:lead.nom, client:nom, email:lead.email, telephone:lead.tel,
        ...envoiCourtier(), leadId:lead.leadId||'',
        origine:ORIGINE||undefined, apporteur_ref:APPORTEUR_REF||undefined, apporteur_nom:APPORTEUR_NOM||undefined,
        /* 07/10/2026 : plus AUCUN champ de consentement n'est envoy\u00e9. La
           question n'est plus pos\u00e9e ; continuer \u00e0 envoyer un libell\u00e9 ferait
           enregistrer tous les visiteurs en \u00ab refuse \u00bb dans le registre des
           consentements, ce qui serait faux. */
        verdict:feu, feu:res.feu, capacite:res.capaciteEmprunt, emprunt:res.montantAFinancer, endettement:res.tauxEndettement, mensualite:res.mensualiteEstimee,
        blocages:res.blocages, leviers:res.leviers, relanceMois:res.relanceMois,
        utm:Object.fromEntries([...P].filter(([k])=>/^utm_|^fbclid$/.test(k))),
        source_url:location.href,   /* requis par l'API Conversions Meta pour l'attribution */
        reponses:R, ts:new Date().toISOString()})})
      /* Seul canal d'envoi : c'est lui qui confirme l'envoi \u00e0 l'\u00e9cran. */
      /* Le CODE de reponse compte autant que le corps : voir le repli ci-dessous. */
      .then(r=>r.json().catch(()=>null).then(j=>Object.assign({ok:r.ok}, (j&&typeof j==='object')?j:{}, {codeHttp:r.status})))
      .then(j=>{
        /* Mise a jour refusee. 07/10/2026 : on ne repart en CREATION que si la
           fiche a vraiment disparu. Un 401 (jeton perime — c'est le cas apres
           CHAQUE rotation de GALAXIE_AUTH_SECRET), un 429 (plafond par IP, donc
           tout un reseau d'entreprise) ou un 500 laissent la fiche en place :
           recreer donnerait DEUX fiches pour une personne, ce que Christophe a
           interdit. Dans ces cas-la on reessaie /maj une fois.
           Si la creation de repli reste necessaire, l'identifiant de la fiche
           abandonnee part avec (remplace_id) pour que le serveur la marque. */
        if(maj && !(j && (j.ok||j.id))){
          if([401,408,429,500,502,503,504].includes(j&&j.codeHttp) && !majReessai){
            majReessai = true; setTimeout(sendToCourtier, 1500); return;
          }
          if(!repliCreation){
            repliCreation = true; ORPHELINE = LEAD_ID;
            memo(CLE_FICHE,''); LEAD_ID = null; MAJ_TOKEN = '';
            sendToCourtier(); return;
          }
        }
        if(j && j.id) LEAD_ID = j.id;      // les corrections suivantes viseront cette fiche
        if(j && j.maj_token) MAJ_TOKEN = j.maj_token;
        if(j && (j.ok||j.id)){ resultatDejaEnvoye = true; memoFiche(); }
        if(!box()) return;
        /* 07/10/2026 : on n'annonce le mail que si le SERVEUR dit l'avoir
           envoyé. Il s'affichait dès que la réponse était « ok », sans regarder
           « envois » : on promettait à un particulier un récapitulatif qui ne
           partait pas. Mieux vaut ne rien dire que dire faux. */
        const mailParti = !!(j && j.envois && j.envois.prospect && !j.envois.prospect.ignore);
        box().innerHTML = (j && (j.ok||j.id))
          ? ((maj && !premier)
              ? '\u2705 Votre demande a \u00e9t\u00e9 mise \u00e0 jour aupr\u00e8s de votre courtier.'
              : '\u2705 Votre projet a bien \u00e9t\u00e9 transmis \u00e0 votre courtier.'+((ORIGINE && res.feu==='rouge') ? '<br>Votre conseiller vous rappelle tr\u00e8s vite.' : ((mailParti && lead.email)?`<br>Le r\u00e9capitulatif part par mail \u00e0 ${esc(lead.email)}.`:'')))
          : 'Votre courtier vous recontacte tr\u00e8s vite.';
      })
      .catch(()=>{ if(box()) box().innerHTML='Votre courtier vous recontacte tr\u00e8s vite.'; }); }
  if(!sent && box()) box().style.display='none';
}

/* Argumentaire du feu rouge : rattache a la fiche existante, jamais a un
   nouveau lead. Sans fiche (worker injoignable), on le dit plutot que de
   laisser croire que le message est parti. */
function envoyerArgumentaire(txt, go){
  const etat=document.getElementById('arguEtat'), msg=txt.value.trim();
  const dire=(t,ok)=>{ if(!etat) return; etat.style.display='block'; etat.style.color=ok?'var(--vert)':'#b0402c'; etat.innerHTML=t; };
  if(msg.length<10) return;
  /* Ouvert DANS le clic (page par courtier) : une fenêtre ouverte plus tard, après la
     réponse du serveur, est bloquée par le navigateur. */
  ouvrirWhatsApp(msg);
  go.disabled=true; go.textContent='Envoi\u2026';
  const fini=(t,ok)=>{ dire(t,ok); go.textContent=ok?'Message envoy\u00e9':'R\u00e9essayer'; go.disabled=ok; if(ok) txt.disabled=true; };
  if(MODE_TEST){ fini('Mode test : le message n\u2019a pas \u00e9t\u00e9 envoy\u00e9.', true); return; }
  if(LEAD_ID===null){ fini('Nous n\u2019avons pas pu joindre le serveur. Votre courtier a d\u00e9j\u00e0 vos coordonn\u00e9es \u2014 \u00e9crivez-lui directement.', false); return; }
  fetch(CONFIG.ENRICH_ENDPOINT+'/maj',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:LEAD_ID, maj_token:MAJ_TOKEN, argumentaire:msg,
      courtier:(PAGE_COURTIER ? slugEnvoi() : lead.courtier), canal:(PAGE_COURTIER ? 'courtier' : undefined)})})
    .then(r=>r.json().catch(()=>({ok:r.ok})))
    .then(j=>{ if(j&&j.ok) fini(`\u2705 Votre message est parti chez ${DEST().nom}. ${DEST().il==='elle'?'Elle':'Il'} le lira avec votre simulation.`, true);
               else fini('L\u2019envoi a \u00e9chou\u00e9. R\u00e9essayez dans un instant.', false); })
    .catch(()=>fini('L\u2019envoi a \u00e9chou\u00e9. R\u00e9essayez dans un instant.', false));
}

/* Mesure d'audience anonyme : signale qu'un écran a été atteint, sans aucune
   donnée personnelle ni identifiant. C'est ce qui permet de connaître le taux
   d'abandon sur l'écran des coordonnées. Une fois par visite. */
const etapesVues = new Set();
function signalerEtape(nom){
  if(MODE_TEST || ORIGINE || etapesVues.has(nom) || !CONFIG.ENRICH_ENDPOINT) return;   // mesure des publicités seulement
  etapesVues.add(nom);
  const base = CONFIG.ENRICH_ENDPOINT.replace(/\/simulateur$/, '');
  fetch(`${base}/etape?c=${encodeURIComponent(SLUG)}&e=${encodeURIComponent(nom)}`,
        {method:'POST', keepalive:true}).catch(()=>{});
}

/* ========== Mesure publicitaire Meta, soumise au consentement ==========
   Le pixel n'est chargé que si le visiteur l'accepte explicitement. Refuser
   ne casse rien : le lead part au courtier et s'enregistre en base dans tous
   les cas, seule la mesure publicitaire est perdue. */
/* ============ Adresse de fin de parcours (mesure publicitaire) ============
   Le simulateur est une page unique : l'écran de résultat ne provoque aucune
   navigation. On pose donc l'adresse à la main au moment du verdict — une par
   feu : « /vert », « /orange », « /rouge ».

   À quoi ça sert : Meta enregistre avec chaque événement l'adresse de la page
   (« event_source_url »). En la différenciant, on peut créer dans Events
   Manager deux conversions personnalisées sur une simple règle d'URL, sans
   retoucher le code à chaque fois qu'on change de campagne.

   Les paramètres de l'URL (courtier, rdv, entree…) sont conservés : ils
   pilotent l'affichage et ne doivent jamais sauter. Le chemin est calculé
   depuis le dossier courant, pour rester juste si le simulateur est un jour
   servi ailleurs qu'à la racine. */
/* Client d'apporteur : la base reste /apporteur, avec ou sans barre finale,
   pour que l'adresse du verdict (/apporteur/vert…) garde la marque. */
/* Page par courtier : le verdict s'écrit SOUS sa page (/gerard-alexandre/vert), sinon le
   prospect qui recharge ou partage l'adresse retombe sur le simulateur générique — et les
   images, la vidéo et les données PTZ, appelées en chemin relatif, cherchent à côté. */
const DOSSIER_BASE = ORIGINE ? location.pathname.replace(/^(\/apporteur)(\/.*)?$/i, '$1')
                   : PAGE_COURTIER ? '/' + SEG_COURTIER
                             : location.pathname.replace(/\/[^\/]*$/, '');
const PAGE_DEPART  = location.pathname;
const urlVerdict = feu => DOSSIER_BASE + '/' + (feu || 'rouge');

function poserUrlVerdict(feu){
  try{
    const cible = urlVerdict(feu);
    /* 07/10/2026 : replaceState et non pushState. Il n'existe aucun écouteur
       « popstate » dans la page : une entrée d'historique ajoutée ici rendait le
       bouton « Précédent » du navigateur inopérant à l'écran (l'adresse
       changeait, l'écran non), et le visiteur quittait le site en croyant la
       page cassée. Avec replaceState, « Précédent » sort du simulateur, ce qui
       est le comportement attendu. */
    if(location.pathname !== cible)
      history.replaceState({verdict:feu}, '', cible + location.search + location.hash);
  }catch(e){}
}
function retirerUrlVerdict(){
  try{
    if(['vert','orange','rouge'].some(f => location.pathname === urlVerdict(f)))
      history.replaceState({}, '', PAGE_DEPART + location.search + location.hash);
  }catch(e){}
}

let pixelPret = false;
function memo(k,v){ try{ return v===undefined ? localStorage.getItem(k) : localStorage.setItem(k,v); }catch(e){ return null; } }

function chargerPixel(){
  if(pixelPret || !PIXEL || MODE_TEST || ORIGINE) return;   // client d'apporteur : aucune publicité   // ?w3f=off : rien ne part, Meta compris
  pixelPret = true;
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init',PIXEL);
  fbq('track','PageView');
}

/* Trois signaux, du plus large au plus qualifié. Meta a besoin de volume pour
   sortir de l'apprentissage : n'envoyer un événement que sur le feu vert le
   privait de la quasi-totalité du tunnel, et la campagne « conversions » est
   restée à zéro résultat (constaté le 2026-08-21).
     • SimulationTerminee — tout parcours achevé, les trois verdicts.
     • SubmitApplication — idem. C'est l'événement standard que Meta nomme
       « Envoi de demande sur le site web », celui que la campagne sélectionne.
     • Lead — vert ET orange, les deux verdicts réellement transmis au courtier.
   La « value » hiérarchise les verdicts : elle permet de passer plus tard
   l'ensemble de pubs en optimisation sur la valeur de conversion, donc d'avoir
   le volume sans perdre la qualité. Le feu rouge compte ici comme signal
   publicitaire uniquement — il reste hors du circuit courtier. */
const VALEUR_FEU = { vert:3, orange:2, rouge:0.5 };

function pixelEvent(feu){
  if(!pixelPret || !window.fbq) return;
  const value = VALEUR_FEU[feu] || 0.5;
  const commun = { value, currency:'EUR', verdict:feu };
  /* eventID : c'est lui qui permet au pixel de reconnaître l'événement que le serveur
     envoie en parallèle par l'API Conversions, et de ne pas le compter deux fois. Le
     Worker construit le même identifiant (event_id + '-' + nom de l'événement).
     ⚠ Le dédoublonnage n'opère QUE si les deux côtés parlent au même pixel : c'est le
     cas sur une page courtier, pas encore sur la racine (décision de CG en attente). */
  fbq('trackCustom','SimulationTerminee', commun, {eventID: SID+'-SimulationTerminee'});
  fbq('track','SubmitApplication', commun, {eventID: SID+'-SubmitApplication'});
  if(feu==='vert' || feu==='orange')
    fbq('track','Lead',{ value, currency:'EUR',
      content_name: feu==='vert' ? 'Projet finançable' : 'Projet à optimiser' }, {eventID: SID+'-Lead'});
}

(function consentement(){
  const bandeau=document.getElementById('cnb'), choix=memo('galaxie_pub');
  /* Le bandeau est fixe en bas de l'ecran : on reserve sa hauteur sous le
     contenu (--cnb-h), sinon il recouvre le bas de la page sur telephone. */
  const majCnb=()=>{
    const h = getComputedStyle(bandeau).display==='none' ? 0 : Math.ceil(bandeau.getBoundingClientRect().height);
    document.documentElement.style.setProperty('--cnb-h', h+'px');
  };
  const fermer=rep=>{ memo('galaxie_pub',rep); bandeau.style.display='none'; majCnb(); };
  if(choix==='oui'){ chargerPixel(); return; }
  if(choix==='non' || !PIXEL || ORIGINE) return;   // pas de pixel, donc pas de bandeau
  bandeau.style.display='flex';
  majCnb(); addEventListener('resize', majCnb);
  document.getElementById('cnbOui').onclick=()=>{ fermer('oui'); chargerPixel(); };
  document.getElementById('cnbNon').onclick=()=>{ fermer('non'); };
})();

/* Point d'entree de test (console) : sert a rejouer un ecran de resultat
   sans cliquer les 20 ecrans — utilise pour produire les captures de recette. */
window.__sim={ data, compute, visible, SCREENS, CONFIG };

/* ============== WHATSAPP DU COURTIER (page par courtier, retour CG du 09/11) ==============
   Le numéro est celui de qui REÇOIT le lead (DEST()) : sur un rachat, c'est Christophe.
   Deux messages différents, et c'est voulu : le bouton de la carte annonce un prospect qui
   a tout rempli ; le message du feu rouge emporte ce que le prospect vient d'écrire. */
function messageWhatsApp(){
  const nom = [lead.prenom, lead.nom].filter(Boolean).join(' ');
  return `Bonjour${nom ? `, je suis ${nom}` : ''}. Je viens de déposer une demande et rempli toutes les informations, je suis disponible pour que vous m'appeliez.`;
}
function ouvrirWhatsApp(msg){
  const D = DEST();
  if (!PAGE_COURTIER || !D || !D.whatsapp) return;
  const nom = [lead.prenom, lead.nom].filter(Boolean).join(' ');
  const tel = String(lead.tel || '').trim();
  const t = `Bonjour, je suis ${nom || 'un prospect du simulateur'}${tel ? ` (mon numéro : ${tel})` : ''}. `
    + `Pourriez-vous étudier mon projet immobilier ? Voici quelques informations complémentaires : ${msg}`;
  try { window.open('https://wa.me/' + D.whatsapp + '?text=' + encodeURIComponent(t), '_blank', 'noopener'); } catch (e) {}
}
/* Feu rouge : cliquer sur WhatsApp transmet la fiche au courtier (mail + Apollo, côté
   serveur). Une seule fois, et jamais en mode test ni en aperçu. */
let waRougeEnvoye = false;
document.addEventListener('click', e => {
  const a = e.target && e.target.closest ? e.target.closest('a[data-wa]') : null;
  if (!a || MODE_TEST || waRougeEnvoye || !data.resultat || data.resultat.feu !== 'rouge' || LEAD_ID === null) return;
  waRougeEnvoye = true;
  fetch(CONFIG.ENRICH_ENDPOINT + '/maj', { method:'POST', headers:{'Content-Type':'application/json'}, keepalive:true,
    body: JSON.stringify({ id:LEAD_ID, maj_token:MAJ_TOKEN, whatsapp_rouge:1, canal:'courtier' }) }).catch(() => { waRougeEnvoye = false; });
});

render();

/* Les trois dossiers d'aperçu. Ils ne forcent PAS la couleur : ce sont de vraies
   situations, passées dans le vrai calcul. Si un jour le barème change au point
   qu'un cas bascule, le bandeau affichera le feu réellement obtenu — et ce sera
   une information utile, pas un bug à masquer. */
const APERCU_CAS = {
  vert:   { statut:'cdi', salaire:5000, primesAn:3000, apport:50000, epargne:15000 },
  orange: { statut:'cdi', salaire:2700, primesAn:0,    apport:25000, epargne:4000  },
  rouge:  { statut:'cdd', salaire:1900, primesAn:0,    apport:4000,  epargne:800   }
};
function lancerApercu(feu){
  const c = APERCU_CAS[feu]; if(!c) return;
  lead.prenom='Camille'; lead.nom='Durand';
  lead.email='apercu@exemple.invalid'; lead.tel='0600000000';
  Object.assign(data, { projet:'principale', natureBien:'ancien', avancement:'recherche',
    region:'idf', prix:250000, travaux:0, structure:'seul', logement:'locataire', loyer:0,
    enfants:'0', primo:'oui', duree:'25', autresType:'aucun', autresMontant:0, pensionv:0,
    aDesCredits:'non', aDejaLocatif:'non', rpActuelle:null, apportComplement:null,
    apportIncoherent:null });
  data.age=[35]; data.statut=[c.statut]; data.salaire=[c.salaire]; data.primes=[c.primesAn];
  data.apport=c.apport; data.epargne=c.epargne;
  data.prix_label='250 000 €'; data.travaux_label='Pas de travaux';
  data.apport_label=fmtEUR(c.apport); data.epargne_label=fmtEUR(c.epargne);
  data.salaire0_label=fmtEUR(c.salaire)+' /mois'; data.pensionv_label='Aucune';
  data.primes0_label=c.primesAn?fmtEUR(c.primesAn)+' /an':'Aucune';
  for(let i=1;i<=CREDITS_MAX;i++) data['credit'+i+'Montant']=0;
  curId='result'; render();
  barreApercu(feu);
}
/* Le bandeau : il dit ce qu'on regarde, permet de sauter d'un feu à l'autre, et
   offre la sortie. Il se repose après chaque rendu, car render() vide la scène. */
function barreApercu(demande){
  const obtenu = (data.resultat||{}).feu || demande;
  const base = location.pathname.replace(/\/(vert|orange|rouge)\/?$/,'/');
  const lien = f => `<a href="${esc(base)}?apercu=${f}" style="display:inline-block;padding:5px 12px;`+
    `border-radius:999px;text-decoration:none;font-weight:700;font-size:13px;`+
    (f===obtenu ? `background:#1a2b28;color:#fff` : `background:#fff;color:#1a2b28;border:1px solid #d9d2c7`)+
    `">${f==='vert'?'Feu vert':f==='orange'?'Feu orange':'Feu rouge'}</a>`;
  let b = document.getElementById('barreApercu');
  if(!b){ b=document.createElement('div'); b.id='barreApercu'; document.body.insertBefore(b, document.body.firstChild); }
  b.setAttribute('style','position:sticky;top:0;z-index:99;display:flex;gap:9px;align-items:center;'+
    'flex-wrap:wrap;padding:9px 14px;background:#fdf3d6;border-bottom:1px solid #e4d08a;'+
    "font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif");
  b.innerHTML = `<b style="font-size:13px;color:#7a5c00">APERÇU</b>`+
    `<span style="font-size:12.5px;color:#7a5c00">chiffres fictifs · aucun lead, aucun mail</span>`+
    `<span style="flex:1 1 auto"></span>`+
    ['vert','orange','rouge'].map(lien).join('')+
    `<a href="${esc(base)}" style="font-size:12.5px;color:#7a5c00;margin-left:6px">Quitter</a>`+
    (obtenu!==demande ? `<span style="flex-basis:100%;font-size:12.5px;color:#9a3412">`+
      `⚠ Ce dossier d'essai ne produit plus un feu ${esc(demande)} mais un feu ${esc(obtenu)} : `+
      `le barème a changé depuis que l'aperçu a été écrit.</span>` : '');
}
if(APERCU) lancerApercu(APERCU);
/* 07/10/2026 : un lead publicitaire arrive avec ses coordonnees DANS l'adresse
   (?prenom=&nom=&email=&tel=). Il ne voit donc jamais l'ecran des coordonnees,
   et la capture — accrochee a cet ecran — n'avait pas lieu : le trafic qui
   coute de l'argent, et qu'on veut rappeler le plus vite, ne partait toujours
   qu'au verdict. On capture donc aussi au demarrage. Le garde-fou
   capturePromesse empeche le double appel. */
if(hasIdentity){ relireFiche(); capturerContact(); }

/* ════════ SUIVI DE PARCOURS PAR LIEN (demande de CG, 11/11/2026) ════════
   Le simulateur d'origine ne mesurait RIEN par lien : il signalait seulement, par
   /etape, que l'écran des coordonnées avait été affiché — sans la moindre étiquette
   de provenance. Impossible de dire ce que rapportaient /tiktok, /pub-meta-christophe
   ou une campagne Meta avant qu'un lead n'aille au bout.
   Ce bloc envoie au serveur, à chaque écran atteint, l'identifiant de visite (SID),
   l'étape exacte et les `utm` de l'adresse. C'est la copie courtier d'Alexandre qui
   l'avait déjà (depuis le 09/11) ; ici c'est le MÊME format et la MÊME route, pour
   que les deux pages se lisent dans le même tableau.
   ⚠ Deux conséquences, voulues :
     · la page /liens.html peut compter les visites par lien ;
     · un parcours abandonné avec des coordonnées déclenche, côté serveur, le mail
       d'abandon vers contact@bypropulse.fr (rien ne part ni au prospect ni au
       courtier). C'est la récupération des abandons, appliquée au simulateur
       d'origine. Pour l'éteindre : remettre SUIVI_ACTIF à false, ici même.
   Aucune donnée n'est envoyée en mode test ni en aperçu (MODE_TEST). */
const SUIVI_ACTIF = true;
const SUIVI_URL = CONFIG.ENRICH_ENDPOINT.replace(/\/simulateur$/, '') + '/simulateur/parcours';
/* SID : défini tout en haut avec les pages par courtier (11/11/2026) — le pixel et les
   envois de lead s'en servent aussi, il ne pouvait plus naître ici. */
let suiviDerniereEtape = '', suiviDernierEnvoi = 0, suiviMinuteur = null;

function suiviTexte(v){ return String(v == null ? '' : v).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 200); }
function suiviChamp(id){ const e = document.getElementById(id); return e ? String(e.value || '').trim() : ''; }

function etatParcours(quitte){
  const V = visible(), s = curScreen() || {};
  const QS = V.filter(x => x.type !== 'result' && x.type !== 'identity');
  let reponses = {};
  try { reponses = recap(); } catch (e) { reponses = {}; }
  /* Sur l'écran des coordonnées, ce qui est DÉJÀ TAPÉ compte : c'est exactement là
     qu'on perd le plus de monde, et un prénom + un numéro suffisent à rappeler. */
  const ident = s.type === 'identity'
    ? { prenom: suiviChamp('idp') || lead.prenom, nom: suiviChamp('idn') || lead.nom,
        email: suiviChamp('ide') || lead.email, tel: suiviChamp('idt') || lead.tel }
    : { prenom: lead.prenom, nom: lead.nom, email: lead.email, tel: lead.tel };
  let question = '';
  try { question = suiviTexte(typeof s.q === 'function' ? s.q(data) : s.q); } catch (e) {}
  return Object.assign({
    sid: SID, page_courtier: SLUG, courtier: PAGE_COURTIER ? slugEnvoi() : SLUG,
    etape_id: s.id || '', etape: question, section: s.sec || '',
    rang: s.type === 'result' ? QS.length : (s.type === 'identity' ? 0 : QS.indexOf(s) + 1),
    total: QS.length,
    fini: s.type === 'result' ? 1 : 0, quitte: quitte ? 1 : 0,
    feu: (s.type === 'result' && data.resultat) ? data.resultat.feu : '',
    reponses,
    utm: Object.fromEntries([...P].filter(([k]) => /^utm_|^fbclid$/.test(k))),
    source_url: location.href
  }, ident);
}

function envoyerParcours(quitte, balise){
  if (!SUIVI_ACTIF || MODE_TEST || !CONFIG.ENRICH_ENDPOINT) return;
  let corps;
  try { corps = JSON.stringify(etatParcours(quitte)); } catch (e) { return; }
  suiviDernierEnvoi = Date.now();
  /* text/plain : requête « simple », sans pré-vérification CORS — c'est ce qui permet sendBeacon. */
  if (balise && navigator.sendBeacon) {
    try { if (navigator.sendBeacon(SUIVI_URL, new Blob([corps], { type: 'text/plain;charset=UTF-8' }))) return; } catch (e) {}
  }
  fetch(SUIVI_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: corps, keepalive: true }).catch(() => {});
}

/* Chaque changement d'écran. render() est une DÉCLARATION de fonction : la remplacer
   ici fait passer TOUS ses appels (avance, retour, fil des sections, « Modifier mes
   réponses ») par le suivi, sans toucher une seule ligne du moteur. */
const renderSansSuivi = render;
render = function(){
  renderSansSuivi();
  const s = curScreen() || {};
  if (s.id !== suiviDerniereEtape) { suiviDerniereEtape = s.id; envoyerParcours(false, false); }
};
/* Saisie des coordonnées : envoyée 1,5 s après la dernière frappe. */
document.addEventListener('input', e => {
  if (!e.target || !['idp', 'idn', 'ide', 'idt'].includes(e.target.id)) return;
  clearTimeout(suiviMinuteur);
  suiviMinuteur = setTimeout(() => envoyerParcours(false, false), 1500);
});
/* Activité sans changement d'écran (affiner un montant…) : au plus un signal par minute. */
['click', 'keydown', 'touchstart'].forEach(t => document.addEventListener(t, () => {
  if (Date.now() - suiviDernierEnvoi > 60000) envoyerParcours(false, false);
}, { passive: true }));
/* Départ : onglet caché (téléphone verrouillé, autre appli) ou page fermée. Retour : on le
   dit aussi, pour que le serveur n'annonce pas un abandon qui n'en est pas un. */
document.addEventListener('visibilitychange', () => envoyerParcours(document.visibilityState === 'hidden', document.visibilityState === 'hidden'));
addEventListener('pagehide', () => envoyerParcours(true, true));
/* Premier écran : le render() d'ouverture a déjà eu lieu quand ce bloc s'exécute. */
envoyerParcours(false, false);
</script>
