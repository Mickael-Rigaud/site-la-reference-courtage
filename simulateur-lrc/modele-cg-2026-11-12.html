<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérifiez la faisabilité de votre projet immobilier</title>
<style>
  :root{
    --vert:#0C806E; --olive:#98AF24; --creme:#FAF6F2; --encre:#1a2b28;
    --gris:#6b7772; --bord:#e3ddd4; --vert-clair:#e6f1ee; --ombre:0 4px 24px rgba(12,128,110,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--creme);color:var(--encre);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    /* --cnb-h : hauteur du bandeau de consentement, fixe en bas de l'ecran.
       Sans cette reserve il recouvrait le bas du contenu sur mobile. */
    padding-bottom:var(--cnb-h,0px)}
  header{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bord);background:#fff}
  header .marque{font-weight:800;font-size:18px;letter-spacing:-.3px}
  header .marque b{color:var(--vert)}
  header .courtier{margin-left:auto;font-size:12.5px;color:var(--gris);text-align:right;line-height:1.3;
    display:flex;align-items:center;gap:9px;justify-content:flex-end}
  header .courtier .tete{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;
    border:2px solid var(--vert-clair);order:2}
  header .courtier .qui{order:1}
  .progress{height:5px;background:var(--bord);overflow:hidden}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vert),var(--olive));transition:width .35s ease}

  .layout{flex:1;display:flex;gap:34px;width:100%;max-width:940px;margin:0 auto;padding:26px 20px 60px}
  /* Barre latérale des catégories (façon Pretto) */
  .rail{flex:0 0 200px}
  .rail ol{list-style:none;position:relative}
  .rail ol::before{content:'';position:absolute;left:5px;top:12px;bottom:12px;width:2px;background:var(--bord)}
  .rail .rs{position:relative;display:flex;align-items:center;gap:13px;padding:9px 0;color:var(--gris);font-size:14.5px;font-weight:600}
  .rail .rdot{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--bord);flex:0 0 auto;position:relative;z-index:1;transition:.2s}
  .rail .rs.done{color:var(--encre)} .rail .rs.done .rdot{background:var(--vert);border-color:var(--vert)}
  .rail .rs.cur{color:var(--vert);font-weight:800} .rail .rs.cur .rdot{background:var(--vert);border-color:var(--vert);box-shadow:0 0 0 4px var(--vert-clair)}
  /* 11/11/2026, demande de CG : « en mettant le nombre de réponses sur 2, ça
     permet de savoir où on en est ». Le compte vit sous le nom de la section. */
  .rail .rlbl small{display:block;font-size:11.5px;font-weight:600;color:var(--gris);margin-top:2px}
  .rail .rs.cur .rlbl small{color:var(--vert)}
  /* La carte qui ferme le fil : ce que le questionnaire rend. Elle reste
     affichée sur l'écran de résultat — « à la fin, rappeler l'avis ». */
  .rail .rfin{display:flex;flex-direction:column;align-items:flex-start;gap:9px;margin-top:15px;padding:13px 14px;
    background:#fff;border:1px solid var(--bord);border-radius:14px;box-shadow:var(--ombre);
    color:var(--encre);font-size:13.5px;font-weight:700;line-height:1.3}
  .rail .rfin.pret{border-color:var(--vert);background:var(--vert-clair);color:var(--vert)}
  .rail .rfin .rlbl small{margin-top:3px;font-size:11.5px}

  .main{flex:1;min-width:0;max-width:620px}
  .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
  .sec{font-size:12px;font-weight:700;color:var(--vert);text-transform:uppercase;letter-spacing:.06em}
  .step-count{font-size:12px;color:var(--gris)}
  .backlink{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--gris);font-size:14px;font-weight:600;cursor:pointer;padding:4px 0;margin-bottom:10px}
  .backlink:hover{color:var(--encre)}
  #stage{animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1.q{font-size:23px;line-height:1.25;font-weight:800;letter-spacing:-.4px;margin-bottom:6px}
  .who{font-size:13px;font-weight:700;color:var(--olive);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  .hint{font-size:14px;color:var(--gris);margin-bottom:20px}

  .options{display:flex;flex-direction:column;gap:11px}
  .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--bord);border-radius:14px;padding:15px 18px;font-size:16px;font-weight:600;color:var(--encre);cursor:pointer;transition:.15s;box-shadow:var(--ombre)}
  .opt:hover{border-color:var(--vert);transform:translateY(-1px)}
  .opt.sel{border-color:var(--vert);background:var(--vert-clair)}
  .opt .ic{font-size:22px;line-height:1;flex:0 0 auto}
  .opt small{display:block;font-weight:400;color:var(--gris);font-size:13px;margin-top:2px}

  .aff-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
  .aff-value{font-size:21px;font-weight:800;color:var(--vert);letter-spacing:-.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .aff-value.empty{font-size:14px;font-weight:600;color:var(--gris)}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{border:1.5px solid var(--bord);background:#fff;border-radius:999px;padding:12px 17px;font-size:15px;font-weight:600;color:var(--encre);cursor:pointer;user-select:none;transition:.12s;font-family:inherit;box-shadow:var(--ombre)}
  .chip:hover{border-color:var(--vert)}
  .chip.sel{background:var(--vert);border-color:var(--vert);color:#fff}
  .aff-hint{font-size:12px;color:var(--gris);margin:16px 0 6px;display:none}
  .chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;margin-top:6px}
  /* Le doigt ne devine pas un debordement horizontal : on le degrade a droite
     tant qu'il reste des valeurs, et le fondu disparait arrive au bout. */
  .fadex{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);
         mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent)}
  .fadex.bout{-webkit-mask-image:none;mask-image:none}
  .chips.scroll .chip{flex:0 0 auto}
  .aff-level{animation:affIn .18s ease-out}
  @keyframes affIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

  .field{margin-bottom:16px}
  label.lab{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
  .lab .req{font-size:11px;font-weight:700;color:var(--vert);background:var(--vert-clair);padding:2px 7px;border-radius:999px;margin-left:6px;text-transform:uppercase;letter-spacing:.03em}
  .lab .fac{font-size:11px;font-weight:600;color:var(--gris);margin-left:6px}
  .aide{font-size:12px;color:var(--gris);margin-top:6px;line-height:1.4}
  /* 07/10/2026 : la raison pour laquelle le bouton d'entrée reste grisé. En
     couleur d'alerte, pas en gris : c'est une information qui doit se voir. */
  .aide.err{color:#b0402c;font-weight:600}
  .in{width:100%;font-size:16px;padding:14px 16px;border:1.5px solid var(--bord);border-radius:13px;background:#fff;color:var(--encre)}
  .in:focus{outline:none;border-color:var(--vert)}
  /* ⚠ align-items:flex-end — SANS LUI, PRÉNOM ET NOM SONT DÉCALÉS (03/11/2026).
     Les deux étiquettes portent le même badge « obligatoire », mais « Prénom »
     est plus long d'une lettre : sur un téléphone, son étiquette passe sur DEUX
     lignes quand celle de « Nom » tient sur une. Les deux colonnes n'ont alors
     plus la même hauteur, et les champs eux-mêmes ne sont plus en face. Aligner
     par le BAS remet les deux champs sur la même ligne quoi qu'il arrive aux
     étiquettes — y compris dans une langue ou une taille de police inconnue. */
  .two{display:flex;gap:12px;align-items:flex-end}.two > *{flex:1}
  .nav{margin-top:24px}
  .btn{width:100%;padding:16px;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;border:none;transition:.15s}
  .btn-p{background:var(--vert);color:#fff;box-shadow:var(--ombre)}
  .btn-p:hover{background:#0a6c5d}.btn-p:disabled{background:#b8c9c4;cursor:not-allowed}
  .trust{font-size:11.5px;color:var(--gris);text-align:center;margin-top:12px}

  .result{text-align:center;padding-top:4px}
  .gauge{width:118px;height:118px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:var(--ombre)}
  .g-vert{background:var(--vert-clair);border:3px solid var(--vert)}
  .g-orange{background:#fdf1e3;border:3px solid #e0902f}
  .g-rouge{background:#fcebe9;border:3px solid #d0543f}
  .result h2{font-size:25px;font-weight:800;letter-spacing:-.5px;margin-bottom:10px}
  .result .lead{font-size:15.5px;color:var(--gris);line-height:1.5;margin-bottom:22px}
  .cards{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .card{flex:1;min-width:150px;background:#fff;border:1px solid var(--bord);border-radius:14px;padding:15px 12px;box-shadow:var(--ombre)}
  .card .n{font-size:21px;font-weight:800;color:var(--vert);letter-spacing:-.5px}
  .card .l{font-size:12px;color:var(--gris);margin-top:4px}
  .note{font-size:13px;color:var(--encre);background:#fff;border:1px solid var(--bord);border-left:3px solid var(--olive);border-radius:8px;padding:11px 13px;text-align:left;margin-bottom:22px;line-height:1.45}

  /* Bandeau de consentement à la mesure publicitaire */
  .cnb{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--bord);
    box-shadow:0 -4px 24px rgba(12,128,110,.10);padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));
    display:none;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
  .cnb p{font-size:13px;color:var(--gris);line-height:1.45;max-width:620px}
  .cnb b{color:var(--encre)}
  .cnb .actions{display:flex;gap:9px;flex:0 0 auto}
  .cnb button{padding:10px 17px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid var(--bord);background:#fff;color:var(--encre);font-family:inherit}
  .cnb button.oui{background:var(--vert);border-color:var(--vert);color:#fff}
  .cnb .lienCnf{align-self:center;font-size:12.5px;color:var(--gris);white-space:nowrap}

  /* Réassurance sur l'écran des coordonnées + pied de page */
  .orias{margin-top:14px;padding:12px 14px;border:1px solid var(--bord);border-radius:12px;
         background:#fff;font-size:12.5px;line-height:1.5;color:var(--gris)}
  .orias b{color:var(--encre)}
  .orias .avert{display:block;margin-top:7px}
  .orias a{color:inherit}
  .rassure{background:#fff;border:1px solid var(--bord);border-radius:14px;padding:6px 15px;margin-top:2px;box-shadow:var(--ombre)}
  /* 03/11/2026 — LA PROMESSE EN TÊTE DE LA PORTE D'ENTRÉE (demande de CG).
     Les trois feux se voient avant qu'on ait lu un mot : ils disent en une
     image ce que le questionnaire rend. ⚠ Les trois sont montrés ALLUMÉS et de
     même taille — n'en mettre qu'un en avant promettrait un résultat. */
  .promesse{text-align:center;margin-bottom:15px}
  /* 11/11/2026, demande de CG : « améliore un peu le design du feu vert, feu
     orange, feu rouge, pour qu'il soit un peu plus design ». Trois lampes
     vitrées dans un boîtier clair, chacune avec le halo de sa couleur — un vrai
     feu, pas trois pastilles. ⚠ Les trois restent ALLUMÉES et de même taille.
     La variante .mini sert d'icône à la carte de fin du fil des sections. */
  .feux{display:inline-flex;gap:14px;justify-content:center;align-items:center;margin-bottom:13px;
    padding:10px 16px;border-radius:999px;background:#fff;border:1px solid var(--bord);box-shadow:var(--ombre)}
  .feux .feu{width:22px;height:22px;border-radius:50%;flex:none;background:var(--lampe);
    background-image:radial-gradient(circle at 34% 26%,rgba(255,255,255,.82),rgba(255,255,255,0) 46%);
    box-shadow:0 0 0 4px var(--halo),inset 0 -2px 4px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.16)}
  .feux .f-v{--lampe:#19a974;--halo:rgba(25,169,116,.17)}
  .feux .f-o{--lampe:#f0932b;--halo:rgba(240,147,43,.17)}
  .feux .f-r{--lampe:#c0392b;--halo:rgba(192,57,43,.15)}
  .feux.mini{gap:7px;margin:0;padding:0;border:0;background:none;box-shadow:none;flex:0 0 auto}
  .feux.mini .feu{width:11px;height:11px;box-shadow:0 0 0 2px var(--halo),inset 0 -1px 2px rgba(0,0,0,.26)}
  .promesse h1.q{margin:0}
  .promesse .sous{margin:7px 0 0;font-size:14px;color:var(--gris);line-height:1.45}
  /* Le bandeau du code promo : seulement pour qui arrive par TikTok. */
  .promo{background:var(--vert);color:#fff;text-align:center;padding:10px 14px;
    font-size:13.5px;font-weight:600;line-height:1.4}
  .promo .code{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:999px;
    letter-spacing:.07em;font-weight:800;white-space:nowrap}
  /* 11/11/2026, demande de CG : « mets la tête du courtier sous le titre, avec
     son ORIAS et un petit mot sur lui, repris de sa carte virtuelle — sa photo
     un peu plus grosse, ça le crédibilise ». Le bloc suit le courtier AFFICHÉ
     et ne montre que ce que porte sa fiche. */
  .porte{display:flex;gap:15px;align-items:center;text-align:left;background:#fff;border:1px solid var(--bord);
    border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--ombre)}
  .porte img{width:78px;height:78px;border-radius:50%;object-fit:cover;flex:0 0 auto;border:3px solid var(--vert-clair)}
  .porte .nom{font-size:16.5px;font-weight:800;letter-spacing:-.3px}
  .porte .role{font-size:12.5px;color:var(--gris);margin-top:2px;line-height:1.35}
  .porte .mot{font-size:13.5px;line-height:1.45;margin-top:7px}
  .porte .chiffres{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .porte .chiffres span{font-size:11.5px;font-weight:700;color:var(--vert);background:var(--vert-clair);
    border-radius:999px;padding:4px 10px}
  .porte .ori{font-size:11.5px;color:var(--gris);margin-top:8px;line-height:1.4}
  .porte .ori a{color:inherit}
  @media(max-width:560px){ .porte{gap:12px;padding:13px} .porte img{width:64px;height:64px} }
  .rassure .l{display:flex;gap:11px;font-size:13px;line-height:1.45;padding:11px 0;text-align:left}
  .rassure .l+.l{border-top:1px solid var(--bord)}
  .rassure .ic{color:var(--vert);font-weight:800;flex:0 0 auto;font-size:14px}
  footer{border-top:1px solid var(--bord);background:#fff;padding:18px 20px;text-align:center;font-size:11.5px;color:var(--gris);line-height:1.65}
  footer b{color:var(--encre)}

  /* La question de consentement à la prospection a été RETIRÉE le 07/10/2026
     (demande de Christophe, répétée trois fois). Ses styles sont partis avec
     elle : l'écran des coordonnées ouvre désormais le parcours, plus rien ne
     doit y retenir le visiteur. */


  /* Diagnostic + leviers (projets orange / rouge) */
  .diag{text-align:left;background:#fff;border:1px solid var(--bord);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--ombre)}
  .diag h3{font-size:14px;font-weight:800;letter-spacing:-.2px;margin-bottom:4px}
  .diag h3.plus{margin-top:18px;padding-top:16px;border-top:1px solid var(--bord)}
  .diag ul,.diag ol{list-style:none}
  .diag ol{counter-reset:lv}
  .diag .r{font-size:14px;line-height:1.5;padding:10px 0 10px 21px;position:relative}
  .diag .r::before{content:'';position:absolute;left:3px;top:17px;width:7px;height:7px;border-radius:50%;background:#e0902f}
  .diag .lv{font-size:14px;line-height:1.5;padding:11px 0 11px 35px;position:relative;counter-increment:lv}
  .diag .lv::before{content:counter(lv);position:absolute;left:0;top:10px;width:24px;height:24px;border-radius:50%;background:var(--vert-clair);color:var(--vert);font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .relance{background:var(--vert-clair);border:1px solid #c5e0d8;border-radius:16px;padding:16px 17px;text-align:left;margin-bottom:20px}
  .relance .t{font-size:15px;font-weight:800;color:var(--vert);letter-spacing:-.2px}
  .relance p{font-size:13.5px;line-height:1.5;margin-top:6px}
  .relance small{display:block;font-size:11.5px;color:var(--gris);margin-top:10px;line-height:1.45}
  .cta{display:block;width:100%;padding:17px;border-radius:14px;background:var(--vert);color:#fff;font-size:16px;font-weight:700;text-align:center;text-decoration:none;box-shadow:var(--ombre)}
  .dossier{border:1.5px solid var(--vert);border-radius:16px;padding:20px 18px;margin-bottom:22px;background:linear-gradient(180deg,#fff,#e9f4f1);text-align:center}
  .dossier-t{font-size:16px;font-weight:800;color:var(--vert);margin-bottom:6px}
  .dossier-p{font-size:14px;color:var(--encre);line-height:1.55;margin:0 0 15px}
  .dossier-s{font-size:11.5px;color:#6b7772;margin-top:9px}
  .cta:hover{background:#0a6c5d}
  .sending{font-size:13px;color:var(--gris);margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--olive);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.3}}
  .disclaimer{font-size:11.5px;color:var(--gris);margin-top:20px;line-height:1.5}

  /* ================= Ecran de resultat : mise en scene ==================
     C'est le seul ecran que le prospect lit vraiment. Il prend la couleur de
     son feu (un feu rouge en vert Pretto brouillerait le message) et ses blocs
     arrivent en cascade pour donner du rythme. --ton porte la couleur, tout le
     reste s'y accroche : une seule ligne a changer pour reteinter un verdict. */
  .result{--ton:var(--vert);--ton-clair:var(--vert-clair);--ton-fonce:#0a6c5d}
  .result.f-orange{--ton:#e0902f;--ton-clair:#fdf1e3;--ton-fonce:#b9741f}
  /* Rouge franc mais chaud : le prospect doit comprendre tout de suite que ce n'est pas possible
     dans l'immediat, sans avoir l'impression qu'on lui claque la porte. */
  .result.f-rouge{--ton:#c9503c;--ton-clair:#fcebe9;--ton-fonce:#a8402c}
  .verdict{background:linear-gradient(155deg,var(--ton) 0%,var(--ton-fonce) 100%);
    border-radius:22px;padding:26px 22px 24px;margin-bottom:16px;color:#fff;
    box-shadow:0 12px 34px -12px var(--ton);position:relative;overflow:hidden}
  /* Halo decoratif : donne de la profondeur au bandeau sans image a charger. */
  .verdict::after{content:'';position:absolute;right:-60px;top:-70px;width:210px;height:210px;
    border-radius:50%;background:rgba(255,255,255,.13)}
  .verdict .gauge{background:rgba(255,255,255,.17);border:3px solid rgba(255,255,255,.45);
    box-shadow:none;position:relative;z-index:1}
  .verdict h2{color:#fff;position:relative;z-index:1}
  .verdict .lead{color:rgba(255,255,255,.93);margin-bottom:0;position:relative;z-index:1}
  .result .card{border-top:3px solid var(--ton)}
  .result .card .n{color:var(--ton)}

  /* Cascade d'apparition. Desactivee si le visiteur a demande moins d'animations. */
  .apparait{animation:monte .5s cubic-bezier(.2,.7,.3,1) both}
  .d1{animation-delay:.08s} .d2{animation-delay:.16s} .d3{animation-delay:.24s}
  .d4{animation-delay:.32s} .d5{animation-delay:.40s} .d6{animation-delay:.48s}
  @keyframes monte{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .apparait{animation:none}
    #confetti{display:none}
  }

  /* Message video du courtier : affiche sur les trois feux. Poster + bouton,
     jamais de lecture automatique — le son porte le message, on ne l'impose pas. */
  /* 07/10/2026 : format CARRE demande par Christophe. Le ratio est impose au
     CONTENEUR (le MP4 reste en 1280x720, on n'y touche pas).
     CORRECTIF DU MEME JOUR : la video est affichee en « contain », pas en
     « cover ». Le master porte des SOUS-TITRES INCRUSTES qui occupent toute la
     largeur du 16/9 : recadrer au carre jetait 280 px de chaque cote et coupait
     le nom du courtier (« JE M'APPELLE CHRISTOPHE GOUBE[T] »). On garde donc le
     cadre carre demande, avec deux bandes noires haut et bas, jusqu'a ce qu'un
     export 1:1 avec sous-titres reincrustes a la bonne largeur soit livre. */
  .video-bloc{position:relative;margin-bottom:16px;border-radius:18px;overflow:hidden;
    background:#000;box-shadow:var(--ombre);line-height:0;aspect-ratio:1/1}
  .video-bloc video{width:100%;height:100%;display:block;border-radius:18px;
    object-fit:contain;object-position:center}
  .video-bloc .play{position:absolute;inset:0;width:100%;height:100%;border:0;cursor:pointer;
    background:rgba(12,128,110,.18);display:flex;align-items:center;justify-content:center;transition:.15s}
  .video-bloc .play:hover{background:rgba(12,128,110,.30)}
  .video-bloc .play span{width:66px;height:66px;border-radius:50%;background:#fff;
    box-shadow:0 8px 26px rgba(0,0,0,.35);display:block;position:relative}
  .video-bloc .play span::after{content:'';position:absolute;left:26px;top:20px;
    border-style:solid;border-width:13px 0 13px 20px;border-color:transparent transparent transparent var(--vert)}
  .video-lgd{position:absolute;left:0;right:0;bottom:0;padding:26px 15px 11px;line-height:1.4;
    background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:12.5px;text-align:left}
  .video-lgd b{font-weight:700}

  /* Feu rouge : le cap a tenir. Bleu royal — ni alarme, ni fausse promesse. */
  .cap{text-align:left;background:#fff;border:1.5px solid var(--ton);border-radius:18px;
    padding:18px;margin-bottom:16px;box-shadow:var(--ombre)}
  .cap h3{font-size:16px;font-weight:800;letter-spacing:-.3px;color:var(--ton);margin-bottom:8px}
  .cap p{font-size:14px;line-height:1.55}
  .cap p+p{margin-top:10px}
  .cap .pt{color:var(--gris);font-size:13px}
  .neuf{text-align:left;background:var(--ton-clair);border-radius:18px;padding:18px;margin-bottom:16px}
  .neuf h3{font-size:15px;font-weight:800;color:var(--ton);margin-bottom:7px;letter-spacing:-.2px}
  .neuf p{font-size:13.5px;line-height:1.55}
  .neuf b{color:var(--encre)}

  /* Conseils du feu rouge : une seule liste, numerotee, dans le bloc du
     constat. Trois encadres separes noyaient le message. */
  .cap ol{list-style:none;counter-reset:cs;margin-top:14px}
  .cap .cs{font-size:14px;line-height:1.55;padding:11px 0 11px 36px;position:relative;counter-increment:cs}
  .cap .cs+.cs{border-top:1px solid var(--bord)}
  .cap .cs::before{content:counter(cs);position:absolute;left:0;top:10px;width:25px;height:25px;
    border-radius:50%;background:var(--ton-clair);color:var(--ton);font-size:12.5px;font-weight:800;
    display:flex;align-items:center;justify-content:center}
  .cap .fin{font-size:13px;color:var(--gris);line-height:1.5;margin-top:14px;padding-top:13px;
    border-top:1px solid var(--bord)}

  /* Les videos conseils, aux couleurs de la marque : c'est Christophe qu'on
     suit, pas trois logos de plateformes poses sur du blanc. */
  /* Carte du courtier choisi par l'apporteur (page de fin, client d'apporteur) */
  .crt{text-align:left;border-radius:20px;margin-bottom:16px;overflow:hidden;box-shadow:var(--ombre);
    background:linear-gradient(160deg,#0F4F3F 0%,#0C806E 100%);color:#fff}
  .crt .tete{display:flex;align-items:center;gap:15px;padding:20px 18px 0}
  .crt .tete img.ph{width:78px;height:78px;border-radius:50%;object-fit:cover;flex:0 0 auto;
    border:2.5px solid rgba(255,255,255,.55);background:#fff}
  .crt .qui{flex:1;min-width:0}
  .crt .qui b{display:block;font-size:18px;font-weight:800;letter-spacing:-.3px}
  .crt .qui .role{display:block;font-size:12.5px;color:rgba(255,255,255,.8);margin-top:2px}
  .crt .qui .reco{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;
    background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px}
  .crt > p{font-size:14.5px;line-height:1.55;color:rgba(255,255,255,.93);padding:14px 18px 0;margin:0}
  .crt .act{display:flex;flex-direction:column;gap:9px;padding:16px 18px 18px}
  .crt .act a{display:block;padding:13px;border-radius:12px;text-align:center;text-decoration:none;
    font-size:15px;font-weight:700;color:#fff;border:1.5px solid rgba(255,255,255,.4);transition:.14s}
  .crt .act a:hover{background:rgba(255,255,255,.12)}
  .crt .act a.p{background:#fff;color:var(--vert);border-color:#fff}
  .crt .rs{padding:0 18px 18px;margin-top:-4px;font-size:12.5px;color:rgba(255,255,255,.78)}
  .crt .rs a{color:#fff;font-weight:700}
  .rx{text-align:left;border-radius:20px;margin-bottom:16px;overflow:hidden;box-shadow:var(--ombre);
    background:linear-gradient(160deg,#0F4F3F 0%,#0C806E 100%);color:#fff}
  .rx .tete{display:flex;align-items:center;gap:14px;padding:18px 18px 0}
  .rx .tete img.ph{width:60px;height:60px;border-radius:50%;object-fit:cover;flex:0 0 auto;
    border:2.5px solid rgba(255,255,255,.55)}
  .rx .tete .qui{flex:1;min-width:0}
  .rx .tete .qui b{display:block;font-size:16px;font-weight:800;letter-spacing:-.3px}
  .rx .tete .qui span{display:block;font-size:12.5px;color:rgba(255,255,255,.8);margin-top:2px}
  /* Le logo doit rester lisible : a 30px le mot « Goubet » disparaissait. */
  .rx .tete img.lg{height:42px;width:auto;flex:0 0 auto;background:#fff;border-radius:9px;padding:5px 9px}
  @media (max-width:400px){ .rx .tete img.lg{display:none} }   /* la place manque, le nom suffit */
  .rx > p{font-size:14px;line-height:1.55;color:rgba(255,255,255,.92);padding:14px 18px 0}
  .rx .liens{display:flex;gap:10px;padding:16px 18px 18px;flex-wrap:wrap}
  /* Chaque carte : l'apercu du reseau en fond, son nom dessus. Sans capture
     deposee, le degrade de la plateforme tient tout seul. */
  .rx a{flex:1;min-width:92px;position:relative;overflow:hidden;border-radius:14px;
    text-decoration:none;color:#fff;aspect-ratio:3/4;display:block;
    box-shadow:0 6px 18px rgba(0,0,0,.28);transition:.14s}
  .rx a:hover{transform:translateY(-3px)}
  .rx a .apercu{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* Le nom passe par-dessus une capture chargee : sans un degrade franc il se
     perdait dans les boutons bleus de LinkedIn. */
  .rx a .nom{position:absolute;left:0;right:0;bottom:0;padding:34px 8px 10px;text-align:center;
    font-size:12.5px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.5);
    background:linear-gradient(transparent,rgba(0,0,0,.6) 45%,rgba(0,0,0,.92))}
  .rx a .ic{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:8px;
    background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center}
  .rx a .ic svg{width:16px;height:16px;display:block}
  .rx .ig{background:linear-gradient(45deg,#f09433,#dc2743 55%,#bc1888)}
  .rx .li{background:linear-gradient(160deg,#0a66c2,#004182)}
  .rx .tk{background:linear-gradient(160deg,#25F4EE 0%,#111 45%,#FE2C55 100%)}

  /* Le guide PDF. Ses styles ne servent plus : le bloc a été RETIRÉ des trois
     pages de résultat le 07/10/2026. Ils restent ici, inertes, le jour où
     Christophe voudrait le remettre — le guide, lui, continue d'être proposé
     dans le mail que le serveur envoie au prospect. */
  .guide{display:flex;align-items:center;gap:17px;text-align:left;background:#fff;
    border:1.5px solid var(--bord);border-radius:20px;padding:18px;margin-bottom:16px;
    box-shadow:var(--ombre);text-decoration:none;color:var(--encre);transition:.14s}
  .guide:hover{border-color:var(--ton);transform:translateY(-2px);box-shadow:0 12px 30px -12px rgba(0,0,0,.3)}
  .guide img{flex:0 0 auto;width:100px;height:auto;border-radius:9px;display:block;
    box-shadow:0 7px 20px rgba(0,0,0,.24)}
  .guide .txt{flex:1;min-width:0}
  .guide .sur{display:block;font-size:11px;font-weight:800;text-transform:uppercase;
    letter-spacing:.07em;color:var(--ton)}
  .guide b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.25px;line-height:1.32;margin-top:6px}
  .guide .sous{display:block;font-size:13px;color:var(--gris);line-height:1.45;margin-top:7px}
  .guide .bt{display:inline-block;margin-top:12px;padding:10px 17px;border-radius:11px;
    background:var(--ton);color:#fff;font-size:13.5px;font-weight:700}
  @media (max-width:400px){ .guide{gap:13px;padding:15px} .guide img{width:78px} }

  /* Coaching personnalisé du feu rouge (07/10/2026). Encadré sobre : c'est une
     prestation payante posée après un refus, elle ne doit ni crier ni
     ressembler à une solution miracle. Les deux paragraphes de garde restent
     lisibles sans rien déplier — c'est la condition pour qu'ils protègent. */
  .coach{text-align:left;background:#fff;border:1.5px solid var(--bord);border-radius:18px;
    padding:18px;margin-bottom:16px;box-shadow:var(--ombre)}
  .coach .sur{display:block;font-size:11px;font-weight:800;text-transform:uppercase;
    letter-spacing:.07em;color:var(--gris)}
  .coach h3{font-size:16px;font-weight:800;letter-spacing:-.3px;margin:6px 0 8px}
  .coach p{font-size:13.5px;line-height:1.55}
  .coach ul{list-style:none;margin:12px 0}
  .coach ul li{font-size:13.5px;line-height:1.5;padding:9px 0 9px 18px;position:relative;
    border-top:1px solid var(--bord)}
  .coach ul li::before{content:'';position:absolute;left:2px;top:17px;width:6px;height:6px;
    border-radius:50%;background:var(--ton)}
  /* 07/10/2026 : les gardes passent au corps du bloc (13,5 px) et en couleur
     d'encre. En 12 px gris sous une liste de bénéfices en gras, une
     information substantielle est traitée comme dissimulée — devant un juge
     comme devant l'ACPR — même quand elle est bel et bien présente. */
  .coach .garde{font-size:13.5px;color:var(--encre);line-height:1.55;margin-top:12px}
  .coach .garde b{color:var(--encre)}
  /* La phrase décisive, sortie du paragraphe et posée juste au-dessus du
     bouton : c'est le dernier mot avant le prix. */
  .coach .garde-forte{font-size:13.5px;color:var(--encre);line-height:1.5;font-weight:600;
    background:var(--creme);border:1px solid var(--bord);border-radius:12px;padding:11px 13px;margin-top:12px}
  .coach .cta{margin-top:15px}
  /* 07/10/2026 : les mentions légales du bloc (vendeur, TVA, CGV, rétractation,
     médiateur) ne sont PAS une note de bas de page. Le nom du vendeur doit se
     lire : sans lui, le lecteur attribue le paiement à l'intermédiaire dont le
     pied de page affiche le numéro ORIAS, juste en dessous. */
  .coach .sous{display:block;font-size:12.5px;color:var(--encre);line-height:1.5;margin-top:12px;
    border-top:1px solid var(--bord);padding-top:11px}
  .coach .sous a{color:var(--vert);font-weight:600}

  /* Zone d'argumentaire : la porte de sortie quand l'estimation se trompe. */
  .argu{text-align:left;background:#fff;border:1px solid var(--bord);border-radius:18px;
    padding:18px;margin-bottom:16px;box-shadow:var(--ombre)}
  .argu h3{font-size:15px;font-weight:800;letter-spacing:-.2px;margin-bottom:6px}
  .argu p{font-size:13.5px;color:var(--gris);line-height:1.5;margin-bottom:11px}
  .argu textarea{width:100%;min-height:104px;resize:vertical;padding:13px 14px;border-radius:12px;
    border:1.5px solid var(--bord);font-family:inherit;font-size:15px;line-height:1.5;color:var(--encre);background:#fff}
  .argu textarea:focus{outline:none;border-color:var(--ton)}
  .argu button{margin-top:11px;width:100%;padding:14px;border-radius:12px;border:0;cursor:pointer;
    background:var(--ton);color:#fff;font-family:inherit;font-size:15px;font-weight:700;transition:.12s}
  .argu button:hover:not(:disabled){background:var(--ton-fonce)}
  .argu button:disabled{opacity:.5;cursor:default}
  .argu .etat{font-size:13px;margin-top:10px;line-height:1.45;color:var(--vert);font-weight:600}

  /* Reprendre ses reponses : propose sur les trois feux. */
  .modif{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;
    padding:14px;border-radius:13px;border:1.5px solid var(--bord);background:#fff;cursor:pointer;
    font-family:inherit;font-size:14.5px;font-weight:700;color:var(--encre);transition:.12s}
  .modif:hover{border-color:var(--ton);color:var(--ton)}
  .modif-aide{font-size:11.5px;color:var(--gris);margin-top:8px;line-height:1.45}

  /* Confettis du feu vert : plein ecran, non cliquable, disparait tout seul. */
  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

  /* Fil des sections : cliquable des qu'une section a ete remplie. */
  .rail .rs.va{cursor:pointer}
  .rail .rs.va:hover .rlbl{color:var(--vert);text-decoration:underline}


  /* ================= PTZ (07/09/2026) : questions et bloc de résultat =================
     Auto-complétion de la commune, saisie du revenu fiscal de référence, nombre
     d'occupants, et le bloc « Votre prêt à taux zéro » de l'écran de résultat. */
  .sugg{display:flex;flex-direction:column;gap:9px;margin-top:12px}
  .sugg .opt{padding:12px 16px;font-size:15px}
  .sugg .aide{margin-top:2px}
  .ptz-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .ptz-actions .btn{flex:1;min-width:150px}
  .btn-s{background:#fff;color:var(--encre);border:1.5px solid var(--bord);box-shadow:var(--ombre)}
  .btn-s:hover{border-color:var(--vert);color:var(--vert)}
  .ptz-bloc{text-align:left;background:#fff;border:1px solid var(--bord);border-left:3px solid var(--ton);border-radius:14px;
    padding:14px 15px;margin-bottom:14px;box-shadow:var(--ombre);font-size:13.5px;line-height:1.5}
  .ptz-bloc .t{font-size:15px;font-weight:800;color:var(--ton);margin-bottom:6px;letter-spacing:-.2px}
  .ptz-bloc p+p{margin-top:7px}
  .ptz-bloc .mention{font-weight:700;color:var(--ton)}
  .ptz-bloc .petit{font-size:11.5px;color:var(--gris);margin-top:10px;padding-top:9px;border-top:1px solid var(--bord);line-height:1.45}
  .card .l .sous{display:block;margin-top:4px;font-weight:600;color:var(--encre)}

  /* Mobile : la barre latérale devient un fil horizontal en haut */
  @media(max-width:820px){
    .layout{flex-direction:column;gap:16px;padding-top:18px}
    .rail{flex:none}
    .rail ol{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .rail ol::-webkit-scrollbar{display:none}
    .rail ol::before{display:none}
    .rail .rs{flex:0 0 auto;padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--bord);font-size:12.5px;white-space:nowrap}
    .rail .rs.cur{border-color:var(--vert);background:var(--vert-clair)}
    .rail .rdot{display:none}
    /* Le fil devient une bande de pastilles : le compte ne tiendrait pas sur
       chacune. On ne le garde que sur la section en cours. */
    .rail .rs:not(.cur) .rlbl small{display:none}
    .rail .rfin{margin-top:0;flex:0 0 auto;flex-direction:row;align-items:center;gap:9px;padding:7px 13px;border-radius:999px;font-size:12px;white-space:nowrap}
    .rail .rfin .rlbl small{display:none}
    .main{max-width:none}
    /* Sur l'ecran de resultat le fil n'indique plus rien : il volait 50 px de haut. */
    .rail.fin{display:none}
  }

  /* Telephone : l'en-tete cassait sur 5 lignes et mangeait 15 % de l'ecran. */
  @media(max-width:560px){
    header{padding:11px 16px;gap:10px}
    header .marque{font-size:15px;line-height:1.3}
    /* 03/11/2026 : la photo prend 38 px à droite. Plutôt que de rétrécir le nom
       du courtier, on laisse « vérifié en 2 min » passer à la ligne — CG l'a
       explicitement autorisé (« tu peux écrire vérifié en 2 minutes juste en
       dessous »). */
    header .marque b{display:block}
    header .courtier{font-size:11px;line-height:1.3;max-width:50%}
    header .courtier .tete{width:34px;height:34px}
    header .courtier small{font-size:10px}
    .layout{padding:14px 16px 34px;gap:14px}
    .top{margin-bottom:12px}
    h1.q{font-size:20.5px}
    .hint{font-size:13.5px;margin-bottom:16px}
    .opt{padding:14px 15px;gap:12px;font-size:15.5px;border-radius:13px}
    .opt .ic{font-size:20px}
    .chip{padding:11px 15px;font-size:14.5px}
    .aff-value{font-size:19px}
    .result h2{font-size:22px}
    .gauge{width:96px;height:96px;font-size:38px;margin-bottom:14px}
    .card{padding:13px 11px;min-width:0}
    .card .n{font-size:19px}
    .diag{padding:15px 14px}
    .cards{gap:10px}
    .rassure{border-radius:12px}
    /* Ecran des coordonnees : le bouton se trouvait a 600 px sous le dernier
       champ, derriere le consentement et les 3 lignes de reassurance. Colle en
       bas de la zone lisible (au-dessus du bandeau), il reste sous le pouce. */
    .nav{position:sticky;bottom:calc(var(--cnb-h,0px) + 8px);z-index:20;margin-top:18px;padding:14px 0 6px;
      background:linear-gradient(180deg,rgba(250,246,242,0),var(--creme) 24%)}
    footer{padding:16px;font-size:11px}
    /* Bandeau de consentement : 159 px sur un ecran de 640, soit un quart de
       la page. Texte resserre, boutons pleine largeur, lien sous les boutons. */
    .cnb{flex-direction:column;align-items:stretch;gap:9px;padding:11px 16px calc(11px + env(safe-area-inset-bottom,0px));text-align:left}
    .cnb p{font-size:12px;line-height:1.4}
    .cnb .plus{display:none}
    .cnb .actions{width:100%;gap:8px}
    .cnb .actions button{flex:1;padding:11px 6px}
    .cnb .lienCnf{align-self:flex-start;font-size:11.5px;text-decoration:underline}
  }

  /* Tres petits ecrans (iPhone SE, Android 320 px) */
  @media(max-width:360px){
    header .marque{font-size:14px}
    h1.q{font-size:19.5px}
    .layout{padding-left:13px;padding-right:13px}
    .two{gap:9px}
    .in{padding:13px 13px}
  }
</style>
</head>
<body>
<div class="promo" id="promo" hidden></div>
<header>
  <span class="marque">Votre projet, <b>vérifié en 2 min</b></span>
  <span class="courtier" id="courtierBox"></span>
</header>
<div class="progress"><i id="bar"></i></div>

<div class="layout">
  <nav class="rail"><ol id="rail"></ol></nav>
  <div class="main">
    <div class="top"><span class="sec" id="sec"></span><span class="step-count" id="cnt"></span></div>
    <button type="button" class="backlink" id="back" style="display:none">← Retour</button>
    <form id="form" onsubmit="return false"><div id="stage"></div></form>
    <div class="nav" id="nav" style="display:none">
      <button type="button" class="btn btn-p" id="next">Accéder au simulateur</button>
      <div class="trust" id="trust"></div>
    </div>
  </div>
</div>
<footer id="pied"></footer>

<div class="cnb" id="cnb">
  <p>Nous mesurons l'efficacité de nos publicités. <b>Votre simulation fonctionne à l'identique si vous refusez</b><span class="plus">, et vos réponses vont de toute façon à votre courtier, à personne d'autre</span>.</p>
  <span class="actions">
    <button id="cnbNon">Refuser</button>
    <button class="oui" id="cnbOui">Accepter</button>
    <!-- 07/10/2026 : confidentialite.html n'existe pas, le lien rendait le
         simulateur. On écrit l'adresse à laquelle poser la question. -->
    <a class="lienCnf" href="mailto:contact@bypropulse.fr">Nous écrire</a>
  </span>
</div>

<script src="ptz-data/moteur-ptz.js"></script>
<script>
/* ============================ CONFIG ============================ */
/* --- Apport attendu selon la nature du bien (règle Christophe) -------------
   ancien 10 % du prix · neuf/VEFA 5 % du prix · terrain+construction 10 % du
   SEUL terrain. Sert à la question « pourriez-vous compléter ? » et au conseil
   de réorientation vers le neuf. */
function prixTotal(d){
  return d.natureBien==='terrain' ? ((d.prixTerrain||0)+(d.prixConstruction||0)) : (d.prix||0);
}
/* Vente du logement actuel : une banque avance en général 70 % de la valeur
   estimée. Ce qui dépasse le capital restant dû constitue un apport RÉEL
   (l'argent existe, il est immobilisé dans le bien). Si le capital restant dû
   dépasse ces 70 %, on n'ajoute ni ne retire rien : la faisabilité du relais
   relève alors de l'appréciation du courtier. */
function apportVente(d){
  if(d.rpActuelle!=='vendre') return 0;
  const avance=(d.rpValeurVente||0)*0.70;
  const crd=(d.rpCRD||0);
  return avance>crd ? Math.round(avance-crd) : 0;
}
function apportAttendu(d){
  if(d.projet==='renego') return 0;
  if(d.natureBien==='terrain') return Math.round((d.prixTerrain||0)*CONFIG.APPORT_MIN.terrain);
  if(d.natureBien==='neuf') return Math.round((d.prix||0)*CONFIG.APPORT_MIN.neuf);
  return Math.round((d.prix||0)*CONFIG.APPORT_MIN.ancien);
}
/* Ce qu'il manque pour atteindre l'apport attendu. On ne redemande pas la

   ?email= : on part donc du premier écran RÉELLEMENT visible. L'écrire en dur
   ferait renvoyer -1 par idx(), et render() casserait dès la première ligne. */
let curId=visible()[0].id, animating=false, aff=null;
/* Passe a true des le premier resultat affiche. Il ouvre la navigation libre :
   toutes les sections sont remplies, plus rien ne justifie de les reparcourir
   dans l'ordre pour corriger un seul montant. */
let dejaResultat=false;

const val=(f,d)=>typeof f==='function'?f(d):f;
function visible(){ return SCREENS.filter(s=>!s.when||s.when(data)); }
function idx(){ return visible().findIndex(s=>s.id===curId); }
function curScreen(){ return visible()[idx()]; }

function render(){
  const V=visible(), i=idx(), s=V[i];
  /* 07/10/2026 : l'écran des coordonnées ouvre le parcours mais ce n'est pas
     une question. Le sortir du décompte évite d'annoncer « 2 / 22 » à
     quelqu'un qui n'a répondu qu'à une seule question, et laisse la barre à
     zéro tant qu'il remplit ses coordonnées. */
  const QS=V.filter(x=>x.type!=='result'&&x.type!=='identity'), totalQ=QS.length;
  const rang=s.type==='identity'?0:(s.type==='result'?totalQ:QS.indexOf(s)+1);
  /* 07/10/2026 : la barre suivait (rang−1)/total. Elle restait donc à zéro sur
     la première question — juste après que le visiteur a rempli quatre champs
     pour entrer, ce qui lui disait « vous n'avez rien fait » — et n'atteignait
     jamais 100 % au résultat. Un écran de résultat vaut 100 % par construction. */
  bar.style.width=(s.type==='result'?100:Math.min(100,Math.max(0,rang)/totalQ*100))+'%';
  sec.textContent=s.sec||''; cnt.textContent=(s.type==='result'||s.type==='identity')?'':`${rang} / ${totalQ}`;
  back.style.display=(i>0&&s.type!=='result')?'inline-flex':'none';
  renderRail(V,s);
  aff=null; stage.innerHTML='';
  nav.style.display='none';
  if(s.type==='choice') renderChoice(s);
  else if(s.type==='amount') renderAmount(s);
  else if(s.type==='commune') renderCommune(s);
  else if(s.type==='rfr') renderRfr(s);
  else if(s.type==='occupants') renderOccupants(s);
  /* « Voir mon résultat » était écrit en dur dans le HTML du bouton : en tête
     de parcours il mentait. On pose le libellé ici, au rendu de l'écran. */
  else if(s.type==='identity'){ signalerEtape('coordonnees'); renderIdentity(s); nav.style.display='block'; next.textContent=dejaResultat?'Revenir à mon résultat':'Accéder au simulateur'; trust.textContent='🔒 Aucun engagement.'; syncNext(); }
  else if(s.type==='result'){ compute(); }
}
/* 11/11/2026, demande de CG : « le nombre de réponses sur 2, par exemple, ça
   permet de savoir où on en est ». Une question vaut une réponse ; l'écran des
   coordonnées vaut ses QUATRE champs, parce que c'est ainsi qu'il se remplit.
   ⚠ Un montant à zéro EST une réponse (« pas de travaux ») : seule une valeur
   jamais posée ne compte pas. */
const CHAMPS_ID = ['prenom','nom','email','tel'];
function reponduEcran(x){
  if(x.type==='identity') return CHAMPS_ID.filter(k=>String(lead[k]||'').trim()).length;
  if(!x.key) return 0;
  const v = x.b!==undefined ? (data[x.key]||[])[x.b] : data[x.key];
  return (v===undefined || v===null || v==='' || (Array.isArray(v) && !v.length)) ? 0 : 1;
}
const poidsEcran = x => x.type==='identity' ? CHAMPS_ID.length : 1;
/* La carte qui ferme le fil (demande de CG) : « juste en dessous de l'étape
   financement, mets Obtenez votre attestation de faisabilité », et « à la fin,
   ça donne quand même rappeler l'avis de faisabilité ». Elle devient cliquable
   dès que le résultat a été vu une fois. */
function railFin(s){
  /* 11/11/2026, correction de CG : « si tu parles d'avis de faisabilité, reste
     sur l'avis de faisabilité », et pas de « feu vert, orange ou rouge » ici —
     la carte annonce ce qu'on vérifie, à l'impératif. */
  const fini = s.type==='result';
  const titre = fini ? 'Votre avis de faisabilité' : 'Obtenez votre avis de faisabilité';
  const sous  = fini ? 'Votre capacité d\u2019emprunt est vérifiée.'
              : (dejaResultat ? 'Revenir à mon résultat'
                              : 'Vérifiez votre capacité d\u2019emprunt');
  return `<li class="rs rfin${(fini||dejaResultat)?' pret':''}${(dejaResultat && !fini)?' va':''}" data-sec="__result">`
    + `<span class="feux mini" aria-hidden="true"><i class="feu f-v"></i><i class="feu f-o"></i><i class="feu f-r"></i></span>`
    + `<span class="rlbl">${titre}<small>${sous}</small></span></li>`;
}
/* Le compte de la section EN COURS se met à jour à la saisie : sur l'écran des
   coordonnées, rien d'autre ne provoque un rendu, et le fil serait resté à
   « 0 réponse sur 4 » pendant que le visiteur remplit ses quatre champs. */
function majCompteRail(){
  const el = railEl.querySelector('.rs.cur .rlbl small'), s = curScreen();
  if(!el || !s) return;
  const QS = visible().filter(x=>x.sec===s.sec && x.type!=='result');
  const tot = QS.reduce((n,x)=>n+poidsEcran(x),0), ok = QS.reduce((n,x)=>n+reponduEcran(x),0);
  el.textContent = `${ok} réponse${ok>1?'s':''} sur ${tot}`;
}
function renderRail(V,s){
  const secs=[]; V.forEach(x=>{ if(x.sec && !secs.includes(x.sec)) secs.push(x.sec); });
  let ci = s.type==='result' ? secs.length : secs.indexOf(s.sec);
  railEl.innerHTML = secs.map((name,k)=>{
    const st=k<ci?'done':k===ci?'cur':'up';
    const QS=V.filter(x=>x.sec===name && x.type!=='result');
    const tot=QS.reduce((n,x)=>n+poidsEcran(x),0), ok=QS.reduce((n,x)=>n+reponduEcran(x),0);
    /* 11/11/2026, correction de CG : « ça doit progresser au fur et à mesure, on
       ne va pas voir qu'il y a autant de questions en avance ». Le compte
       n'apparaît donc QUE sur la section en cours et sur celles qui portent déjà
       une réponse : une section jamais atteinte n'annonce pas son nombre de
       questions. ⚠ Le critère est « ok > 0 », pas « k < ci » : en revenant
       corriger une réponse, les sections suivantes garderaient sinon l'air vide. */
    const compte=(ok>0 || k===ci) ? `${ok} réponse${ok>1?'s':''} sur ${tot}` : '';
    /* Une section deja remplie se reouvre d'un clic : c'est la voie rapide
       pour corriger un montant sans repasser par vingt ecrans. */
    return `<li class="rs ${st}${(k<ci||dejaResultat)?' va':''}" data-sec="${esc(name)}"><span class="rdot"></span><span class="rlbl">${name}${compte?`<small>${compte}</small>`:''}</span></li>`;
  }).join('') + railFin(s);
  railEl.querySelectorAll('.rs.va').forEach(li=>li.addEventListener('click',()=>{
    if(li.dataset.sec==='__result'){ curId='result'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
    const cible=V.find(x=>x.sec===li.dataset.sec);
    /* 07/10/2026 : quitter l'écran de résultat par le fil doit aussi rendre
       l'adresse de départ, comme le fait « Modifier mes réponses ». Sinon on
       remplit le formulaire avec /rouge dans la barre d'adresse : rechargé,
       partagé ou mis en favori, le lien emporte un verdict qui n'est plus là. */
    if(cible){ if(s.type==='result') retirerUrlVerdict(); curId=cible.id; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  }));
  railEl.parentElement.classList.toggle('fin', s.type==='result');
  /* Mobile : le fil defile a l'horizontale. Sans ce recentrage il restait
     bloque sur « Projet » alors qu'on en etait a « Charges », hors ecran. */
  const cur = railEl.querySelector('.rs.cur') || railEl.querySelector('.rs:last-child');
  if(cur && railEl.scrollWidth > railEl.clientWidth + 4)
    glisser(railEl, 'scrollLeft', Math.max(0, cur.offsetLeft - 46));
  fadex(railEl);
}

/* Fondu de bord sur une bande qui defile a l'horizontale : au doigt, rien
   n'indiquait qu'il restait des valeurs a droite. Retire une fois au bout. */
function fadex(c){
  if(!c) return;
  const maj=()=>{
    const debord = c.scrollWidth > c.clientWidth + 4;
    c.classList.toggle('fadex', debord);
    c.classList.toggle('bout', debord && c.scrollLeft + c.clientWidth >= c.scrollWidth - 6);
  };
  if(!c.dataset.fx){ c.dataset.fx='1'; c.addEventListener('scroll', maj, {passive:true}); }
  maj();
}
/* Remonte dans la zone visible un bloc qui vient d'apparaitre : les puces de
   precision naissaient sous la ligne de flottaison, cachees par le bandeau. */
function amener(el){
  /* setTimeout et non requestAnimationFrame : rAF ne tourne pas quand l'onglet
     n'est pas au premier plan, l'ajustement serait alors perdu. */
  setTimeout(()=>{
    const reserve = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cnb-h')) || 0;
    const trop = el.getBoundingClientRect().bottom + 14 - (innerHeight - reserve);
    if(trop > 0) glisser(null, 'scrollTop', Math.round(scrollY + trop));
  });
}
/* Defilement doux, avec repli instantane : « smooth » est ignore par certains
   navigateurs et par le reglage « reduire les animations ». Sans ce repli, la
   correction ne s'appliquait tout simplement pas. */
function glisser(el, axe, cible){
  const gauche = axe==='scrollLeft';
  const lire = () => el ? el[axe] : (gauche ? scrollX : scrollY);
  const depart = lire();
  if(Math.abs(cible - depart) < 2) return;
  const opts = gauche ? {left:cible, behavior:'smooth'} : {top:cible, behavior:'smooth'};
  (el||window).scrollTo(opts);
  setTimeout(()=>{ if(Math.abs(lire() - depart) < 2){ if(el) el[axe]=cible; else scrollTo(0,cible); } }, 320);
}
function heading(s){
  let h='';
  if(s.b!==undefined && data.structure==='deux') h+=`<div class="who">${s.b===0?'Emprunteur 1':'Emprunteur 2'}</div>`;
  h+=`<h1 class="q">${val(s.q,data)}</h1>`;
  if(s.hint) h+=`<p class="hint">${val(s.hint,data)}</p>`;
  return h;
}
function advance(){
  animating=true;
  setTimeout(()=>{
    animating=false;
    /* « Je corrige mon apport » : on revient à la question au lieu d'avancer. */
    if(curScreen().id==='apportIncoherent' && data.apportIncoherent==='corriger'){
      data.apport=0; data.apportIncoherent=null; data.apport_label='';
      curId='apport'; render(); return;
    }
    go(1);
  }, CONFIG.ADV_DELAY);
}

/* ---- Choix : auto-avance ---- */
function renderChoice(s){
  const sel = s.b!==undefined ? data[s.key][s.b] : data[s.key];
  stage.innerHTML = heading(s)+`<div class="options">`+ s.opts.map(o=>
    `<button type="button" class="opt${o.v===sel?' sel':''}" data-v="${o.v}">`+(o.ic&&o.ic!=='—'?`<span class="ic">${o.ic}</span>`:'')+`<span>${o.label}`+(o.sub?`<small>${o.sub}</small>`:'')+`</span></button>`).join('')+`</div>`;
  stage.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(animating) return;
    stage.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
    if(s.b!==undefined) data[s.key][s.b]=b.dataset.v; else data[s.key]=b.dataset.v;
    advance();
  }));
}

/* ---- Montant : affineur AUTO-AVANCE (tranche → pas moyen → pas fin s3), aucun bouton ---- */
const fmtEUR=n=>Number(n).toLocaleString('fr-FR')+' €';
const fmtChip=n=>(n>=10000&&n%1000===0)?(n/1000).toLocaleString('fr-FR')+' k€':fmtEUR(n);
/* Taux stocke en centiemes de point (345) et lu en pourcentage (3,45 %). */
const fmtTaux=n=>(n/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' %';
function renderAmount(s){
  aff={s};
  const isAge=s.disp==='age', isTaux=s.disp==='taux', unit=s.unit||'';
  const chipTxt=n=>isAge?String(n):isTaux?fmtTaux(n):fmtChip(n);
  const valTxt=n=>isAge?(n+' ans'):isTaux?fmtTaux(n):(fmtEUR(n)+unit);
  stage.innerHTML = heading(s)+
    `<div class="aff-head"><span></span><span class="aff-value empty" id="affval">À choisir</span></div>`+
    `<div class="chips" id="l1">`+ val(s.ranges,data).map((r,k)=>`<button type="button" class="chip" data-k="${k}">${r.t}</button>`).join('')+`</div>`+
    `<p class="aff-hint" id="affhint">Choisissez la valeur précise ci-dessous.</p>`+
    `<div class="chips scroll" id="l2" style="display:none"></div>`+
    `<div class="chips scroll" id="l3" style="display:none"></div>`;
  const l1=stage.querySelector('#l1'),l2=stage.querySelector('#l2'),l3=stage.querySelector('#l3'),hint=stage.querySelector('#affhint'),av=stage.querySelector('#affval');
  const build=(c,min,max,step)=>{c.innerHTML='';for(let v=min;v<max;v+=step){const x=document.createElement('button');x.type='button';x.className='chip';x.dataset.num=v;x.textContent=chipTxt(v);c.appendChild(x);}c.style.display='flex';c.scrollLeft=0;};
  function done(n){ commitAmount(s,n,valTxt(n)); av.textContent=valTxt(n); av.classList.remove('empty'); advance(); }
  function done0(label){ commitAmount(s,0,label); av.textContent=label; av.classList.remove('empty'); advance(); }
  l1.addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b||animating)return;
    const r=val(s.ranges,data)[+b.dataset.k];
    l1.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
    l3.style.display='none'; l3.innerHTML='';
    if(r.zero){ done0(r.t); return; }
    av.textContent=r.v; av.classList.remove('empty');
    l2.dataset.step=r.step; l2.dataset.s3=r.s3||0; build(l2,r.min,r.max,r.step); hint.style.display='block';
    fadex(l2); amener(l2);
  });
  l2.addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b||animating)return;
    const n=+b.dataset.num, s3=+l2.dataset.s3;
    l2.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
    l3.style.display='none'; l3.innerHTML='';
    if(s3){ av.textContent='≈ '+valTxt(n); av.classList.remove('empty'); build(l3,n,n+ +l2.dataset.step,s3); fadex(l3); amener(l3); }
    else done(n);
  });
  l3.addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b||animating)return;
    l3.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); done(+b.dataset.num);
  });
}
function commitAmount(s,n,label){ if(s.b!==undefined) data[s.key][s.b]=n; else data[s.key]=n; data[s.id+'_label']=label; }

/* Numéros ORIAS corroborés le 07/10/2026 par la signature officielle de chaque
   courtier (et sa carte de visite). Celui de Réjinal Deravine est ABSENT à
   dessein : sa fiche porte 17000916, qui est le numéro de FINSPOT, pas le sien.
   Tant qu'il n'est pas vérifié, son simulateur n'affiche pas ce bloc. */
const ORIAS_VERIFIES = ['24005088', '25009569', '23001706', '10057340'];   // 10057340 : Alexandre Gerard, relevé sur ses mentions légales et sur sa fiche du Worker
/* Le mandant est le même pour tous les courtiers Pretto Galaxie. */
const MANDANT = `ayant reçu mandat de FINSPOT, courtier en opérations de banque et courtier `+
  `d'assurances, immatriculé au registre de l'ORIAS sous le n° 17000916.`;
/* L'avertissement légal sur le crédit, mot pour mot celui de la signature de CG. */
const AVERTISSEMENT = `Un crédit vous engage et doit être remboursé. Vérifiez vos capacités de `+
  `remboursement avant de vous engager. Aucun versement, de quelque nature que ce soit, ne peut être `+
  `exigé d'un particulier, avant l'obtention d'un ou plusieurs prêts d'argent.`;
/* 11/11/2026, demande de CG : « enlève le lien de www.orias.fr, systématiquement ».
   Le registre est cité par son nom, sans lien — le numéro ORIAS reste affiché partout.
   ⚠ NE PAS le retransformer en lien : un lien dans les mentions fait sortir le visiteur
   en plein questionnaire. Le seul lien toléré dans les mentions est contact@bypropulse.fr. */
const ORIAS_LIEN = `www.orias.fr`;
/* 07/10/2026 — LES MENTIONS COMPLÈTES, dictées par Christophe, sur l'écran d'entrée.
   Elles portent l'identité LEGALE : raison sociale, RSAC, siège, catégorie ORIAS,
   mandant, avertissement. C'est le premier écran du parcours, donc le premier
   endroit où le visiteur se demande à qui il confie son numéro.
   ⚠ Je n'ai PAS le RSAC ni le siège d'Erwann Baudouin ni d'Élodie Jaffré : leurs
   mentions restent donc incomplètes (nom, catégorie, ORIAS, mandant, avertissement)
   jusqu'à ce qu'on les relève. Mieux vaut incomplet que faux — on n'invente pas
   une immatriculation ni une adresse. */
function blocOrias(){
  /* Page par courtier : ses mentions complètes sont en pied de page (fiche `pied`), les
     répéter ici les afficherait deux fois sur le même écran. */
  if (PAGE_COURTIER && AFFICHE.pied) return '';
  const o = AFFICHE.orias || '';
  if(!ORIAS_VERIFIES.includes(o)) return '';
  const e = AFFICHE.il === 'elle' ? 'e' : '';
  const ident = AFFICHE.rsac
    ? `<b>${esc(AFFICHE.nom)}</b>, ${esc(AFFICHE.rsac)}`
      +(AFFICHE.agence?` — Agence : ${esc(AFFICHE.agence)}`:'')
      +(AFFICHE.siege?` — Siège : ${esc(AFFICHE.siege)}.`:'.')
    : `<b>${esc(AFFICHE.nom)}</b>, Pretto Galaxie.`;
  return `<div class="orias">`+
    `${ident}<br>`+
    `${esc(AFFICHE.statut||'Intermédiaire en crédit immobilier')} immatriculé${e} au registre de `+
    `l'ORIAS (${ORIAS_LIEN}) sous le n° <b>${esc(o)}</b> et ${MANDANT}<br>`+
    `<span class="avert">${AVERTISSEMENT}</span></div>`;
}

/* ---- Identité : seul écran clavier (conditionnel), 1 bouton final ---- */
/* 03/11/2026 — L'ORDRE DE CET ÉCRAN EST DICTÉ PAR CG, DANS CET ORDRE EXACT :
   les trois feux et la promesse, les deux arguments, PUIS les coordonnées, et
   SEULEMENT APRÈS la phrase RGPD. Le titre « Entrez vos coordonnées pour
   accéder au simulateur » est remplacé par « Obtenez votre avis de faisabilité »
   — on annonce ce qu'on donne, pas ce qu'on demande. heading(s) n'est donc plus
   appelé ici ; la question garde son libellé pour le fil de navigation. */
function promesseFeux(){
  return `<div class="promesse">`
    + `<div class="feux" aria-hidden="true">`
    +   `<span class="feu f-v"></span><span class="feu f-o"></span><span class="feu f-r"></span>`
    + `</div>`
    /* « gratuitement » en gras : c'est le mot qui fait remplir le formulaire, et
       c'est déjà celui de la copie par courtier (11/11/2026). */
    + `<h1 class="q">Obtenez <b>gratuitement</b> votre avis de faisabilité</h1>`
    /* 11/11/2026 : la sous-ligne « Deux minutes de questions, puis votre avis. Vos
       informations restent confidentielles. » a été RETIRÉE à la demande de CG.
       ⚠ Ne pas la remettre : la confidentialité est dite une seule fois, dans la
       réassurance juste en dessous (« entre vous et moi, selon le secret
       professionnel »), et la répéter deux fois en quatre lignes l'affaiblit. */
    + `</div>`
    + blocPorte();
}
/* 11/11/2026, demande de CG : « la tête du courtier sous le titre, avec son
   ORIAS et un petit mot sur lui, en reprenant des termes très simples de sa
   carte virtuelle — ça le crédibilise ».
   ⚠ Le bloc suit le courtier AFFICHÉ, jamais Christophe en dur : un client
   envoyé par un apporteur voit SON courtier (même règle que l'en-tête et que
   les mentions ORIAS).
   ⚠ Il ne montre QUE ce que porte la fiche : sans photo ni petit mot, pas de
   bloc. Et le numéro ORIAS ne s'affiche que s'il est corroboré par la signature
   officielle du courtier (ORIAS_VERIFIES) — un faux numéro affiché en grand est
   pire que pas de numéro du tout. */
function blocPorte(){
  const C = AFFICHE;
  if(!C || (!C.photo && !C.mot)) return '';
  const chiffres = (C.chiffres||[]).slice(0,3);
  const titre = C.role || ((C.il==='elle'?'Courtière':'Courtier')+' en prêt immobilier');
  const orias = (C.orias && ORIAS_VERIFIES.includes(C.orias)) ? C.orias : '';
  return `<div class="porte">`
    + (C.photo ? `<img src="${esc(C.photo)}" alt="${esc(C.nom)}" onerror="this.remove()">` : '')
    + `<div>`
    +   `<div class="nom">${esc(C.nom)}</div>`
    +   `<div class="role">${esc(titre)} · ${esc(C.marque||'Pretto Galaxie')}</div>`
    +   (C.mot ? `<p class="mot">${esc(C.mot)}</p>` : '')
    +   (chiffres.length ? `<div class="chiffres">${chiffres.map(c=>`<span>${esc(c)}</span>`).join('')}</div>` : '')
    /* 11/11/2026, demande de CG : le numéro SEUL, sans lien vers orias.fr — « ça peut
       faire sortir les gens ». C'est le premier écran, on n'y ouvre aucune porte de sortie.
       Le lien vers le registre reste dans les mentions légales du pied de page. */
    +   (orias ? `<div class="ori">ORIAS n° <b>${esc(orias)}</b></div>` : '')
    + `</div></div>`;
}
function renderIdentity(s){
  aff={s,identity:true};
  stage.innerHTML = promesseFeux()+
    `<div class="rassure">`+
    `<div class="l"><span class="ic">✓</span><div><b>À la fin de ce questionnaire, vous aurez un avis de faisabilité : feu vert, feu orange ou feu rouge.</b> Il vous dira où en est votre projet, et ce qui reste à travailler.</div></div>`+
    /* 11/11/2026, phrase dictée par Christophe — à employer SYSTÉMATIQUEMENT sous cette
       forme. Elle remplace « n'apparaît nulle part dans votre dossier bancaire » : la
       vraie inquiétude de celui qui donne son numéro n'est pas le fichier de la banque,
       c'est de savoir qui va lire ce qu'il écrit. « Entre vous et moi » tient parce que
       le courtier est nommé et montré juste au-dessus — sur la page d'un courtier comme
       sur l'adresse de base. */
    `<div class="l"><span class="ic">✓</span><div><b>Gratuit et sans engagement.</b> Une simulation ne déclenche aucune démarche et reste strictement confidentielle, entre vous et moi, selon le secret professionnel.</div></div>`+
    `</div>`+
    `<div class="two"><div class="field"><label class="lab">Prénom <span class="req">obligatoire</span></label><input class="in" id="idp" value="${esc(lead.prenom)}"></div>`+
    `<div class="field"><label class="lab">Nom <span class="req">obligatoire</span></label><input class="in" id="idn" value="${esc(lead.nom)}"></div></div>`+
    `<div class="field"><label class="lab">Email <span class="req">obligatoire</span></label>`+
    `<input class="in" id="ide" type="email" inputmode="email" placeholder="vous@email.com" value="${esc(lead.email)}">`+
    `<div class="aide">C’est à cette adresse que part votre analyse détaillée.</div>`+
    /* 07/10/2026 : DIRE POURQUOI LE BOUTON RESTE GRISÉ. Cet écran n'est plus la
       dernière étape d'un visiteur déjà investi, c'est la PORTE D'ENTRÉE : tout
       le questionnaire est derrière elle. Quelqu'un qui tape « jean@gmail »
       voyait un bouton mort, sans un mot d'explication, et repartait. Les
       messages restent vides tant que le champ n'a rien reçu : on n'accueille
       personne par une erreur. */
    `<div class="aide err" id="errE" style="display:none"></div></div>`+
    `<div class="field"><label class="lab">Téléphone <span class="req">obligatoire</span></label><input class="in" id="idt" type="tel" inputmode="tel" placeholder="06 12 34 56 78" value="${esc(lead.tel)}">`+
    `<div class="aide">Votre courtier vous joint plus vite par téléphone que par mail.</div>`+
    `<div class="aide err" id="errT" style="display:none"></div></div>`+
    /* C'est ici que le prospect hésite : on répond aux 3 questions qu'il se pose.
       07/10/2026 : l'écran ouvre désormais le parcours, le visiteur n'a donc
       encore rien vu du simulateur. La PROMESSE DU RÉSULTAT passe en tête —
       c'est elle qui fait remplir le formulaire. Elle nomme les trois feux
       sans en promettre aucun : on annonce un avis, pas une bonne nouvelle. */
    `<div class="rassure">`+
    `<div class="l"><span class="ic">✓</span><div>Vous pouvez demander leur <b>suppression à tout moment</b>, conformément au RGPD.</div></div>`+
    `</div>`+
    /* 07/10/2026 — L'IDENTITÉ DU PROFESSIONNEL, DÈS LA PORTE D'ENTRÉE (demande de CG).
       Cet écran ouvre désormais le parcours : c'est le premier endroit où le
       visiteur se demande à qui il donne son numéro. Le numéro ORIAS est
       cliquable vers le registre public : ce qui rassure, c'est de POUVOIR
       vérifier, pas qu'on affirme.
       Le bloc suit le courtier AFFICHÉ — un client envoyé par un apporteur lit
       les mentions de SON courtier, jamais celles de Christophe (règle du
       24/09/2026). Et il ne s'affiche QUE si le numéro est corroboré par la
       signature officielle du courtier : un ORIAS faux affiché en grand est
       pire que pas d'ORIAS du tout. */
    blocOrias();
  /* 07/10/2026 : les quatre champs sont recopiés dans « lead » DÈS LA SAISIE, et
     plus seulement au passage à l'écran suivant. Depuis que cet écran ouvre le
     parcours, « Vos coordonnées » est la première entrée du fil : corriger son
     adresse puis revenir au résultat par le fil perdait la correction en
     silence, alors que c'est justement le chemin naturel pour la corriger. */
  stage.querySelectorAll('.in').forEach(i=>{
    i.addEventListener('input',()=>{ lireIdentite(); syncNext(); aidesIdentite(); majCompteRail(); });
    /* Entrée (ou « OK » du clavier mobile) valide l'écran. Le formulaire est
       neutralisé par onsubmit : sans ce gestionnaire la touche ne faisait rien,
       sur la porte d'entrée d'un tunnel majoritairement mobile. */
    i.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); if(identityValid()) next.click(); } });
  });
  aidesIdentite();
}
const gv=sel=>(stage.querySelector(sel)||{}).value||'';
/* Un seul endroit qui recopie les champs dans « lead » : appelé à la saisie,
   donc valable quelle que soit la façon de quitter l'écran (fil, Retour, bouton). */
function lireIdentite(){ lead.prenom=gv('#idp'); lead.nom=gv('#idn'); lead.email=gv('#ide'); lead.tel=gv('#idt'); }
/* La raison du blocage, sous le champ fautif, et seulement s'il est rempli. */
function aidesIdentite(){
  const dire=(sel,txt)=>{ const e=stage.querySelector(sel); if(!e) return; e.textContent=txt; e.style.display=txt?'block':'none'; };
  const e=gv('#ide').trim(), t=gv('#idt').replace(/\D/g,'');
  dire('#errE', (e.length && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))
    ? 'Cette adresse semble incomplète — il manque le domaine, par exemple @gmail.com.' : '');
  dire('#errT', (t.length && t.length<10) ? 'Un numéro français compte 10 chiffres.' : '');
}
/* Prénom, nom et adresse mail sont obligatoires : ce sont les champs qu'Apollo
   exige pour ouvrir le dossier, et l'adresse porte le récapitulatif et la
   relance. Le numéro permet au courtier de rappeler vite.
   07/10/2026 : la question de consentement a été retirée du parcours, elle ne
   conditionne donc plus le passage à la suite — quatre champs, et c'est tout. */
function identityValid(){
  return gv('#idp').trim().length >= 2
      && gv('#idn').trim().length >= 2
      && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(gv('#ide').trim())
      && gv('#idt').replace(/\D/g, '').length >= 10;
}
/* L'écran peut être absent du parcours (?email= dans l'adresse) : on ne lit le
   type qu'après s'être assuré qu'il y a bien un écran courant. */
function syncNext(){ const s=curScreen(); if(s && s.type==='identity') next.disabled=!identityValid(); }

/* ---- Navigation ---- */
function go(dir){
  const V=visible(), depuis=curScreen();
  if(dir>0 && depuis.type==='identity'){
    /* Les champs sont déjà dans « lead » (recopiés à la saisie) ; on relit pour
       le cas où le navigateur aurait auto-rempli sans événement « input ». */
    lireIdentite();
    relireFiche(); capturerContact();
    /* 07/10/2026 : « Vos coordonnées » est la PREMIÈRE entrée du fil. Quelqu'un
       qui y revient après son résultat veut corriger une faute de frappe, pas
       refaire vingt questions : on le ramène droit à son résultat. */
    if(dejaResultat){ curId='result'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  }
  let i=Math.max(0,Math.min(V.length-1, idx()+dir)); curId=V[i].id; render();
}
next.addEventListener('click',()=>{ if(identityValid()) go(1); });
back.addEventListener('click',()=>go(-1));

/* ============================ PTZ + ASSURANCE ============================
   Décisions Christophe du 07/09/2026. Le moteur (barèmes datés, fonctions
   pures) est dans ptz-data/moteur-ptz.js et s'expose en window.PTZ ; la table
   commune → zone est lue à la demande dans ptz-data/zones/<département>.json.
   Ici : les trois questions (commune, revenu fiscal de référence, occupants),
   le pont data → moteur, les garde-fous du feu et les blocs d'affichage.
   Sans le moteur (fichier absent), la page calcule comme avant : ni PTZ, ni
   assurance. */
const MOTEUR_PTZ = window.PTZ || null;

/* Primo-accédant au sens PTZ : pas propriétaire de sa résidence principale au
   cours des 2 dernières années ET pas propriétaire de son logement actuel. */
function estPrimo(d){ return d.primo==='non' && d.logement!=='proprio'; }
/* Le PTZ est possible (décisions 1-3) : les trois questions ne sont posées que là. */
function ptzPossible(d){
  return d.projet==='principale' && d.logement!=='proprio' && d.primo==='non'
      && (d.natureBien==='neuf' || d.natureBien==='terrain');
}
function occupantsParDefaut(d){ return (d.structure==='deux'?2:1) + (parseInt(d.enfants,10)||0); }
/* Date probable de l'offre de prêt : les règles PTZ et l'année du revenu
   fiscal sont celles de cette date, pas de la simulation (décision 9). */
function dateOffreProbable(){
  const d=new Date(), av=data.avancement;
  d.setMonth(d.getMonth() + ((av==='compromis'||av==='acceptee') ? 2 : av==='offre' ? 3 : 6));
  return d;
}
function anneesRfr(){
  if(MOTEUR_PTZ) return MOTEUR_PTZ.anneeRfr(dateOffreProbable());
  const y=dateOffreProbable().getFullYear();
  return {anneeOffre:y, anneeRevenus:y-2, anneeAvis:y-1, baremesValables:true};
}
function ageMaxEmprunteurs(d){
  const a=[d.age[0], d.structure==='deux'?d.age[1]:null].map(Number).filter(x=>x>0);
  return a.length?Math.max(...a):null;
}
/* Net mensuel du ménage (salaires + primes des emprunteurs) : sert à estimer le
   RFR (11 ×) quand il n'est pas connu, et au contrôle de cohérence 8-14 ×. */
function netMenage(d){
  /* Primes saisies à l'année depuis le 07/10/2026 : ramenées au mois, comme
     dans revenus(). Ce net mensuel sert à estimer le revenu fiscal (11 ×) :
     sans la division, le RFR estimé — donc le PTZ et ses garde-fous —
     partait douze fois trop haut. */
  let n=(d.salaire[0]||0)+primesMois(d,0);
  if(d.structure==='deux') n+=(d.salaire[1]||0)+primesMois(d,1);
  return n;
}
function PTZ_ECRANS(){
  return [
   {id:'ptzCommune',sec:SEC.PTZ,type:'commune',key:'commune',
    q:'Dans quelle commune se situe le bien ?',
    hint:'Ou la commune où vous cherchez. Le montant du prêt à taux zéro dépend de la zone de la commune — pas du code postal, qui peut couvrir plusieurs zones.',
    when:ptzPossible},
   {id:'ptzRfr',sec:SEC.PTZ,type:'rfr',key:'rfr',
    q:'Quel est votre revenu fiscal de référence ?',
    hint:'C\'est lui, et non votre salaire, qui fixe le montant du prêt à taux zéro.',
    when:ptzPossible},
   {id:'ptzOccupants',sec:SEC.PTZ,type:'occupants',key:'occupants',
    q:'Combien de personnes vivront dans le logement, vous compris ?',
    hint:d=>{ const e=parseInt(d.enfants,10)||0;
      return `Pré-rempli avec ${d.structure==='deux'?'les 2 emprunteurs':'vous'}${e>0?' et '+e+' enfant'+(e>1?'s':''):''}. Ajoutez un conjoint qui n'emprunte pas ou un parent hébergé : cela change le plafond du PTZ.`; },
    when:ptzPossible}
  ];
}

/* ---- Zone d'une commune : ptz-data/zones/<dép>.json, un fichier par
   département, chargé à la demande et gardé en mémoire. Jamais le fichier
   national complet. ---- */
const ZONES_CACHE={};
function chargerZone(codeInsee){
  if(!MOTEUR_PTZ) return Promise.resolve(null);
  const dep=MOTEUR_PTZ.departementPourCode(codeInsee);
  if(!dep) return Promise.resolve(null);
  if(!ZONES_CACHE[dep]) ZONES_CACHE[dep]=fetch(`${DOSSIER_BASE}/ptz-data/zones/${dep}.json`)
    .then(r=>r.ok?r.json():null).catch(()=>null)
    .then(t=>{ if(!t) delete ZONES_CACHE[dep]; return t; });   // un échec ne se met pas en cache
  return ZONES_CACHE[dep].then(t=>t?MOTEUR_PTZ.zonePourCode(codeInsee,t):null);
}

/* ---- Commune : auto-complétion geo.api.gouv.fr (nom ou code postal), on garde
   le code INSEE, puis la zone est lue avant d'avancer. ---- */
function renderCommune(s){
  aff={s};
  const zoneTxt = z => (z && MOTEUR_PTZ) ? ` — zone ${esc(MOTEUR_PTZ.libelleZone(z))}` : '';
  stage.innerHTML = heading(s)+
    `<div class="field"><input class="in" id="comIn" type="search" autocomplete="off" autocapitalize="words" spellcheck="false" `+
    `placeholder="Nom de la commune ou code postal" value="${esc(data.commune||'')}">`+
    `<div class="aide" id="comAide">${data.communeCode
      ? `Commune retenue : <b>${esc(data.commune)}</b>${zoneTxt(data.ptzZone)}. Tapez pour en choisir une autre.`
      : 'Commencez à taper, puis choisissez votre commune dans la liste.'}</div></div>`+
    `<div class="sugg" id="comSugg"></div>`+
    `<div class="ptz-actions"><button type="button" class="btn btn-s" id="comNsp">Je ne sais pas encore</button></div>`;
  const inp=stage.querySelector('#comIn'), sugg=stage.querySelector('#comSugg'), aide=stage.querySelector('#comAide');
  let timer=null, seq=0;
  const chercher = q => {
    const n=++seq, cp=/^\d{5}$/.test(q);
    const url='https://geo.api.gouv.fr/communes?'+(cp?'codePostal='+q:'nom='+encodeURIComponent(q))
      +'&fields=code,nom,codeDepartement,codesPostaux&boost=population&limit='+(cp?10:6);
    fetch(url).then(r=>r.ok?r.json():[]).catch(()=>[]).then(l=>{
      if(n!==seq) return;                         // une frappe plus récente a pris le relais
      if(!Array.isArray(l)||!l.length){
        sugg.innerHTML=`<p class="aide">Aucune commune trouvée${cp?' pour ce code postal':''}. Vérifiez l’orthographe, ou passez avec « Je ne sais pas encore ».</p>`; return; }
      sugg.innerHTML=l.map((c,k)=>`<button type="button" class="opt" data-k="${k}"><span class="ic">📍</span><span>${esc(c.nom)}`+
        `<small>${esc((c.codesPostaux||[]).slice(0,3).join(', '))}${c.codeDepartement?' · dép. '+esc(c.codeDepartement):''}</small></span></button>`).join('');
      sugg.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>choisir(l[+b.dataset.k])));
    });
  };
  inp.addEventListener('input',()=>{ clearTimeout(timer); const q=inp.value.trim(); if(q.length<2){ sugg.innerHTML=''; return; } timer=setTimeout(()=>chercher(q),220); });
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') e.preventDefault(); });
  function choisir(c){
    if(animating) return;
    data.commune=c.nom; data.communeCode=c.code; data.communeDep=c.codeDepartement||''; data.communeCP=(c.codesPostaux||[])[0]||'';
    data.communeInconnue=false; data.ptzZone=null;
    inp.value=c.nom; sugg.innerHTML='';
    aide.innerHTML=`Commune retenue : <b>${esc(c.nom)}</b> — recherche de la zone…`;
    animating=true;                              // on attend la zone avant d'avancer
    chargerZone(c.code).then(z=>{
      data.ptzZone=z||null;
      data.ptzCommune_label=`${c.nom}${data.communeCP?' ('+data.communeCP+')':''}`;
      animating=false;
      if(curId!=='ptzCommune') return;           // le prospect est déjà parti ailleurs (Retour)
      aide.innerHTML=`Commune retenue : <b>${esc(c.nom)}</b>${z?zoneTxt(z):' — zone introuvable, votre courtier la vérifiera'}.`;
      advance();
    });
  }
  stage.querySelector('#comNsp').addEventListener('click',()=>{
    if(animating) return;
    data.commune=''; data.communeCode=''; data.communeDep=''; data.communeCP=''; data.ptzZone=null; data.communeInconnue=true;
    data.ptzCommune_label='Ne sait pas encore';
    advance();
  });
}

/* ---- Revenu fiscal de référence : saisie exacte (la tranche bascule à
   quelques centaines d'euros près), avec « je ne sais pas ». ---- */
function renderRfr(s){
  aff={s};
  const an=anneesRfr();
  const initial=(data.rfrSource==='declare' && data.rfr>0) ? Number(data.rfr).toLocaleString('fr-FR') : '';
  stage.innerHTML = heading(s)+
    `<div class="field"><label class="lab" for="rfrIn">Revenu fiscal de référence <span class="fac">avis d’imposition ${an.anneeAvis} (revenus ${an.anneeRevenus})</span></label>`+
    `<div class="two"><input class="in" id="rfrIn" inputmode="numeric" autocomplete="off" placeholder="ex. 52 000" value="${initial}">`+
    `<button type="button" class="btn btn-p" id="rfrOk" style="flex:0 0 auto;width:auto;padding:14px 22px"${initial?'':' disabled'}>Valider</button></div>`+
    `<div class="aide">Ligne « Revenu fiscal de référence », en haut de la première page de votre avis d’imposition ${an.anneeAvis}. Si vous êtes deux foyers fiscaux, additionnez les deux montants.</div></div>`+
    `<div class="ptz-actions"><button type="button" class="btn btn-s" id="rfrNsp">Je ne sais pas</button></div>`;
  const inp=stage.querySelector('#rfrIn'), ok=stage.querySelector('#rfrOk');
