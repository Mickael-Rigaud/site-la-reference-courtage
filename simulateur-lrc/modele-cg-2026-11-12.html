  inp.addEventListener('input',()=>{ const n=lire(); inp.value=n?n.toLocaleString('fr-FR'):''; ok.disabled=!n; });
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); if(!ok.disabled) ok.click(); } });
  ok.addEventListener('click',()=>{ if(animating) return; const n=lire(); if(!n) return;
    data.rfr=n; data.rfrSource='declare'; data.ptzRfr_label=fmtEUR(n)+` (avis ${an.anneeAvis})`; advance(); });
  stage.querySelector('#rfrNsp').addEventListener('click',()=>{ if(animating) return;
    data.rfr=0; data.rfrSource='estime'; data.ptzRfr_label='Ne sait pas — estimé sur les revenus nets'; advance(); });
  inp.focus();
}

/* ---- Occupants : pré-rempli emprunteurs + enfants, modifiable d'un clic. ---- */
function renderOccupants(s){
  aff={s};
  let sel=data.occupants||occupantsParDefaut(data);
  stage.innerHTML = heading(s)+
    `<div class="aff-head"><span></span><span class="aff-value" id="occVal"></span></div>`+
    `<div class="chips" id="occChips">`+[1,2,3,4,5,6,7,8].map(n=>`<button type="button" class="chip" data-n="${n}">${n===8?'8 et +':n}</button>`).join('')+`</div>`+
    `<div class="ptz-actions"><button type="button" class="btn btn-p" id="occOk">Continuer</button></div>`;
  const val=stage.querySelector('#occVal');
  const maj=()=>{ val.textContent=sel+(sel>=8?' et +':'')+' personne'+(sel>1?'s':'');
    stage.querySelectorAll('#occChips .chip').forEach(c=>c.classList.toggle('sel',+c.dataset.n===sel)); };
  maj();
  const valider=()=>{ if(animating) return; data.occupants=sel; data.ptzOccupants_label=val.textContent; advance(); };
  stage.querySelector('#occChips').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b||animating) return; sel=+b.dataset.n; maj(); valider(); });
  stage.querySelector('#occOk').addEventListener('click',valider);
}

/* ---- Pont data → moteur. Renvoie le résultat de PTZ.simulerPtz (statut
   ok / estime / a_verifier / ineligible / non_applicable), ou null sans moteur. ---- */
function simulerPtzDepuisData(c){
  if(!MOTEUR_PTZ) return null;
  try{
    return MOTEUR_PTZ.simulerPtz({
      projet:data.projet, natureBien:data.natureBien, logement:data.logement, primo2ans:data.primo,
      prix:data.prix||0, travaux:data.travaux||0, apport:c.apport,
      prixTerrain:data.prixTerrain||0, prixConstruction:data.prixConstruction||0,
      frais:c.prix*c.frais, aFinancer:c.montant,
      zone:data.ptzZone||null, commune:data.commune||null, codeInsee:data.communeCode||null,
      rfr:data.rfr||0, rfrSource:data.rfrSource||'estime',
      netMensuel:data.rfrSource ? netMenage(data) : 0,   // question non posée → RFR inconnu, rien d'estimé
      occupants:data.occupants||undefined, emprunteurs:data.structure==='deux'?2:1, enfants:parseInt(data.enfants,10)||0,
      duree:c.dur, taux:c.taux, ageMax:ageMaxEmprunteurs(data), dateOffre:dateOffreProbable(),
      revenus:c.rev, charges:c.charges
    });
  }catch(e){ console.warn('[simulateur] moteur PTZ en erreur : calcul sans PTZ ni assurance', e); return null; }
}
/* Capacité d'emprunt, assurance comprise dans les 35 % : capital C tel que
   mensualité(C) + C × taux d'assurance / 12 = marge mensuelle. */
function capitalMaxAssur(m,dur,taux,tauxAss){const r=taux/12,n=dur*12;return m/(r/(1-Math.pow(1+r,-n))+(tauxAss||0)/12);}

/* Garde-fous du feu (décision 7). Le feu est calculé sur la mensualité lissée
   assurance incluse. Plafond orange du moteur (E.plafondFeu) : PTZ « estimé »
   ou « à vérifier » — commune inconnue comprise, même sans montant calculé —,
   ou phase 2 non lissée au-delà de 40 %. Depuis le 27/10/2026 ce plafond ne
   frappe que les dossiers dont le vert DÉPEND du PTZ (mode souple, voir
   CONFIG.PTZ_PLAFOND_STRICT) : un dossier vert sans le PTZ reste vert. En
   mode strict, le plafond redevient systématique et out.prudence porte alors
   la phrase « feu orange par prudence » adaptée au motif. « À la limite » : endettement à ± 0,5 point d'un seuil, ou RFR à
   ± 500 € d'une borne de tranche → texte, et pas de basculement franc au vert. */
function gardeFousPtz(ptz, feu, feuSansPtz, tauxEnd){
  const out={feu, raisons:[], aLaLimite:false, textes:[], prudence:'', moteurAbsent:!ptz};
  /* Moteur absent (404, HTML servi par le repli SPA, erreur de syntaxe) ou en
     erreur : si le PTZ était possible, le dossier ne peut pas être vert — le
     PTZ n'a pas été évalué. Sinon le feu ne dépend pas du PTZ : inchangé. */
  if(!ptz){
    /* Moteur en erreur (window.PTZ existe, simulerPtz a levé) ≠ moteur non chargé.
       Mode souple (27/10/2026) : sans moteur, la page calcule exactement comme
       avant le PTZ — le vert ne doit donc rien au PTZ et n'a pas à être
       plafonné. Le courtier voit quand même « Moteur PTZ non chargé » dans son
       récapitulatif : le repli n'est jamais silencieux. */
    if(ptzPossible(data) && feu==='vert' && CONFIG.PTZ_PLAFOND_STRICT){ out.feu='orange'; out.raisons.push(window.PTZ ? 'PTZ non évalué' : 'PTZ non évalué, moteur non chargé'); }
    return out;
  }
  const E=ptz.endettement||{}, depend=feuSansPtz!=='vert';
  /* Le plafond orange du moteur : systématique en mode strict, réservé aux
     dossiers dont le vert dépend du PTZ en mode souple (27/10/2026). */
  if(feu==='vert' && E.plafondFeu==='orange' && (CONFIG.PTZ_PLAFOND_STRICT || depend)){
    out.feu='orange'; out.raisons=(E.raisonsPlafond||[]).slice();
    if(!depend) out.prudence=phrasePrudencePtz(ptz, E);
  }
  if(!ptz.calcule) return out;   // commune inconnue : plafond posé ; ni montant, ni textes « à la limite »
  const lim=[CONFIG.ENDETTEMENT_MAX,0.40].some(s=>Math.abs(tauxEnd-s)<=0.005);
  if(lim) out.textes.push(`votre taux d’endettement (${(tauxEnd*100).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1})} %${CONFIG.ASSURANCE_DANS_LE_TAUX?', assurance incluse':', hors assurance'}) touche un seuil ; quelques dizaines d’euros par mois font basculer le résultat, votre courtier tranchera.`);
  if(ptz.aLaLimite && ptz.textes && ptz.textes.limite) out.textes.push(ptz.textes.limite);
  if(ptz.textes && ptz.textes.phase2Limite) out.textes.push(ptz.textes.phase2Limite);   // phase 2 non lissée entre 39,5 et 40 % : texte seul, feu inchangé
  out.aLaLimite = lim || !!ptz.aLaLimite;
  if(out.aLaLimite && out.feu==='vert' && depend){ out.feu='orange'; out.raisons.push('à la limite d’un seuil'); }
  return out;
}

/* Phrase du feu orange « par prudence » (décision 7) : le dossier serait vert
   même sans PTZ, mais le PTZ pris en compte est estimé / à vérifier / sans
   commune, ou la phase 2 non lissée dépasse 40 %. Le motif et la condition de
   retour au vert sont adaptés. */
function motifsPrudencePtz(ptz, E){
  const seuil=((MOTEUR_PTZ&&MOTEUR_PTZ.CONFIG_PTZ&&MOTEUR_PTZ.CONFIG_PTZ.ENDETTEMENT)||{}).orange||0.40;
  /* Le dépassement du seuil s'affiche avec assez de décimales pour se voir :
     « dépasserait 40 % (40,05 %) », jamais « 40,0 % » (moteur, 06/09/2026). */
  const pct=t=>(MOTEUR_PTZ&&MOTEUR_PTZ.formaterPctDepassement)
    ? MOTEUR_PTZ.formaterPctDepassement(t,seuil)
    : (t*100).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1})+' %';
  const seuilTxt=(MOTEUR_PTZ&&MOTEUR_PTZ.formaterPct)?MOTEUR_PTZ.formaterPct(seuil,0):'40 %';
  const phase2Haute=typeof E.phase2==='number' && E.phase2>seuil;
  const motifs=[], retour=[];
  if(ptz.statut==='estime') motifs.push('votre PTZ est estimé à partir de vos revenus nets, sans votre avis d’imposition');
  else if(ptz.statut==='a_verifier'){
    if(ptz.motif==='zone_introuvable'){
      /* La commune A été saisie : on ne lui dit pas qu'elle manque (06/09/2026). */
      motifs.push('zone introuvable pour '+(ptz.commune||'votre commune')+(ptz.codeInsee?' ('+ptz.codeInsee+')':'')+' : votre courtier la vérifiera');
      if(ptz.rfrSource==='inconnu') motifs.push('votre revenu fiscal de référence n’est pas connu');
      else if(ptz.rfrSource==='estime') motifs.push('votre revenu fiscal de référence est estimé à partir de vos revenus nets, sans votre avis d’imposition');
    }
    else if(ptz.motif==='zone_inconnue'){
      motifs.push('votre commune n’est pas renseignée, le montant du PTZ reste à préciser');
      /* Le moteur ne garde qu'un motif : quand le revenu fiscal manque aussi, on le cite. */
      if(ptz.rfrSource==='inconnu') motifs.push('votre revenu fiscal de référence n’est pas connu');
      else if(ptz.rfrSource==='estime') motifs.push('votre revenu fiscal de référence est estimé à partir de vos revenus nets, sans votre avis d’imposition');
    }
    else if(ptz.motif==='rfr_incoherent') motifs.push('votre revenu fiscal de référence déclaré est à vérifier');
    else motifs.push('votre revenu fiscal de référence n’est pas connu');
  }
  if(phase2Haute) motifs.push(`si la banque ne lisse pas les deux prêts, votre endettement en phase 2 dépasserait ${seuilTxt} (${pct(E.phase2)})`);
  if(ptz.motif==='zone_inconnue') retour.push('précisé votre commune');
  if(ptz.motif==='zone_introuvable') retour.push('vérifié la zone de votre commune');
  if(ptz.statut==='estime'||ptz.statut==='a_verifier') retour.push('confirmé votre PTZ sur votre avis d’imposition');
  if(phase2Haute) retour.push('vérifié que la banque lisse les deux prêts');
  if(!retour.length) retour.push('confirmé votre PTZ');
  return {motifs, retour};
}
/* Ce qui reste à confirmer, pour le diagnostic de l'écran orange « par prudence » :
   l'avis d'imposition, la commune, le lissage par la banque — selon le motif. */
function aConfirmerPrudence(ptz, E){
  const seuil=((MOTEUR_PTZ&&MOTEUR_PTZ.CONFIG_PTZ&&MOTEUR_PTZ.CONFIG_PTZ.ENDETTEMENT)||{}).orange||0.40;
  const l=[];
  if(ptz.statut==='estime' || ptz.rfrSource==='estime' || ptz.motif==='rfr_incoherent' || ptz.motif==='rfr_inconnu')
    l.push('sur votre avis d’imposition');
  if(ptz.motif==='zone_inconnue') l.push('une fois votre commune précisée');
  else if(ptz.motif==='zone_introuvable') l.push('une fois la zone de votre commune vérifiée');
  if(typeof E.phase2==='number' && E.phase2>seuil) l.push('avec la banque, qui doit lisser les deux prêts');
  if(!l.length) l.push('avant le dépôt du dossier');
  return l.join(' et ');
}
/* Le motif du feu « par prudence » en une ligne : résumé courtier, mail, recap. */
function motifPrudenceCourt(ptz, garde){
  if(!garde || !garde.prudence) return '';
  const m = ptz ? motifsPrudencePtz(ptz, ptz.endettement||{}).motifs : [];
  return m.join(' ; ') || garde.raisons.join(', ');
}
function phrasePrudencePtz(ptz, E){
  const m=motifsPrudencePtz(ptz, E);
  return 'Feu orange par prudence : sans le PTZ, votre dossier est déjà au vert. '
    +(m.motifs.length?'Motif : '+m.motifs.join(' ; ')+'. ':'')
    +'Il repassera au vert dès que votre courtier aura '+m.retour.join(' et ')+'.';
}

/* Bloc « Votre prêt à taux zéro » de l'écran de résultat (décision 5). Rien
   n'est affiché quand le PTZ est non applicable ou inéligible (décision 1),
   sauf la mention « Autre ». */
function blocPtz(ptz, garde){
  if(!ptz) return '';
  const T=ptz.textes||{}, fmt=n=>Math.round(n).toLocaleString('fr-FR')+' €';
  if(data.natureBien==='autre' && !ptz.calcule)
    return `<div class="note apparait d2">Type de bien « Autre » : votre courtier vérifiera vos aides (prêt à taux zéro, prêts aidés).</div>`;
  const zd=String((MOTEUR_PTZ.CONFIG_PTZ.zonage||{}).date||'').split('-').reverse().join('/');
  const petit=`<p class="petit">${esc(T.baremes||'')}${zd?' · zonage des communes en vigueur au '+zd:''}. ${esc(T.occupation||'')}</p>`;
  const p=[];
  if(ptz.calcule){
    p.push(`<p>${esc(T.ligne)}.</p>`);
    p.push(`<p><b>${fmt(ptz.mensualiteAvecPtz)} /mois avec PTZ lissé (estimation)</b>, contre <b>${fmt(ptz.mensualiteSansPtz)}</b> sans PTZ (hors assurance). `+
           `${esc(T.sansLissage.charAt(0).toUpperCase()+T.sansLissage.slice(1))} — sous réserve que la banque lisse les deux prêts.</p>`);
    if(ptz.statut==='estime'||ptz.statut==='a_verifier') p.push(`<p>${esc(ptz.motifTexte)}</p>`);
    ['duree','autresPrets','plancher'].forEach(k=>{ if(T[k]) p.push(`<p>${esc(T[k])}</p>`); });
    garde.textes.forEach(t=>p.push(`<p><b>À la limite :</b> ${esc(t)}</p>`));
    p.push(...lignesPlafondPtz(garde, ptz));
    p.push(`<p class="mention">${esc(T.mention)}.</p>`);
    return `<div class="ptz-bloc apparait d2"><div class="t">Votre prêt à taux zéro</div>${p.join('')}${petit}</div>`;
  }
  if(ptz.statut==='a_verifier'){                 // zone ou RFR à préciser : fourchette au mieux, pas de montant
    p.push(`<p>${esc(ptz.motifTexte)}</p>`);
    if(T.fourchette) p.push(`<p><b>${esc(T.fourchette)}</b></p>`);
    p.push(...lignesPlafondPtz(garde, ptz));
    /* Rien n'a été estimé (ni montant, ni fourchette) : « PTZ estimé sur vos
       déclarations » ne veut rien dire, on annonce ce qui reste à faire. */
    p.push(`<p class="mention">${esc(T.fourchette?T.mention:'PTZ à préciser avec votre courtier')}.</p>`);
    const titre = ptz.motif==='zone_introuvable' ? 'Prêt à taux zéro : zone à vérifier' : 'Prêt à taux zéro : à préciser';
    return `<div class="ptz-bloc apparait d2"><div class="t">${titre}</div>${p.join('')}${petit}</div>`;
  }
  if(ptz.statut==='ineligible' && ptz.motif==='ressources' && ptz.aLaLimite && T.limite){   // au-dessus du plafond de moins de 500 € : une ligne, feu inchangé
    return `<div class="ptz-bloc apparait d2"><div class="t">Prêt à taux zéro : à la limite</div><p><b>À la limite :</b> ${esc(T.limite)}</p><p class="mention">${esc(T.mention)}.</p>${petit}</div>`;
  }
  /* Inéligible sur un revenu fiscal ESTIMÉ (11 × le net) : ne pas l'écarter en
     silence — le RFR réel du prospect peut être plus bas. Feu inchangé. */
  if(ptz.ineligibleSurRfrEstime && T.ineligibleEstime){
    /* Aucun PTZ n'a été estimé ici : « PTZ estimé sur vos déclarations » n'aurait
       pas de sens sous un bloc qui annonce l'inverse (même règle qu'« à préciser »). */
    return `<div class="ptz-bloc apparait d2"><div class="t">Prêt à taux zéro : probablement non éligible</div>`+
      `<p>${esc(T.ineligibleEstime)}</p><p class="mention">PTZ à vérifier avec votre courtier.</p>${petit}</div>`;
  }
  return '';
}
/* Lignes du plafond dans le bloc PTZ : la phrase « par prudence » quand le
   dossier serait vert sans PTZ (décision 7), sinon le rappel court du plafond. */
function lignesPlafondPtz(garde, ptz){
  if(!garde) return [];
  if(garde.prudence) return [`<p class="prudence"><b>${esc(garde.prudence)}</b></p>`];
  if(!garde.raisons.length) return [];
  /* Le dossier dépend du PTZ et le feu a été plafonné : les mêmes motifs
     lisibles que la phrase « par prudence », sans la partie « déjà au vert ». */
  const motifs=ptz ? motifsPrudencePtz(ptz, ptz.endettement||{}).motifs : [];
  if(garde.raisons.includes('à la limite d’un seuil')) motifs.push('votre dossier touche un seuil (voir « À la limite » ci-dessus)');
  if(!motifs.length) return [`<p>Feu orange par prudence : ${esc(garde.raisons.join(', '))}. Votre courtier vérifiera ce point.</p>`];
  return [`<p>Feu orange par prudence : ${esc(motifs.join(' ; '))}. Votre courtier vérifiera ${motifs.length>1?'ces points':'ce point'}.</p>`];
}
/* Une ligne pour le mail et le résumé du courtier. */
function texteCourtPtz(ptz, garde){
  const plaf=(garde&&garde.raisons.length)?' — feu plafonné à orange ('+garde.raisons.join(', ')+')':'';
  if(!ptz) return (window.PTZ ? 'Moteur PTZ en erreur' : 'Moteur PTZ non chargé')+plaf;
  const R=ptz.recap||{};
  const differe=ptz.differe>0 ? `différé ${ptz.differe} an${ptz.differe>1?'s':''}` : 'sans différé';
  if(ptz.calcule) return `${R.ptz_montant} (${String(R.ptz_tranche||'').toLowerCase()}, ${differe}) — ${R.ptz_statut}`+plaf;
  if(ptz.statut==='a_verifier') return 'À vérifier'+(R.ptz_montant&&R.ptz_montant!=='—'?' — '+R.ptz_montant:'')+plaf;   // « À vérifier — — » évité quand il n'y a ni montant ni fourchette
  return '';
}
/* Les clés PTZ du récapitulatif (décision 10), « — » quand non applicable. */
function recapPtz(){
  const CLES=['ptz_eligible','ptz_montant','ptz_tranche','ptz_differe','ptz_zone','ptz_commune','ptz_code_insee','ptz_rfr','ptz_rfr_source',
              'ptz_occupants','mensualite_sans_ptz','mensualite_avec_ptz','assurance_mensuelle','ptz_statut','ptz_sans_lissage'];
  const src=(data.ptz&&data.ptz.recap)||{}, out={};
  CLES.forEach(k=>{ out[k]=src[k]||'—'; });
  /* Questions PTZ jamais posées (dossier non concerné ou inéligible d'office) :
     « — » plutôt que « Ne sait pas encore » / « Inconnue ». */
  if(!data.communeCode && !data.communeInconnue){ out.ptz_commune='—'; out.ptz_zone='—'; }
  if(!data.occupants) out.ptz_occupants='—';
  /* Repli non silencieux : moteur absent (404, script non chargé) ou en erreur → le courtier le voit. */
  if(!window.PTZ) out.ptz_statut='Moteur PTZ non chargé';
  else if(data.ptz===null) out.ptz_statut='Moteur PTZ en erreur';
  if(data.ptzGarde&&data.ptzGarde.raisons.length) out.ptz_statut+=' — feu plafonné à orange ('+data.ptzGarde.raisons.join(', ')+')';
  /* Décision 7 : le feu est orange alors que le dossier serait vert sans PTZ. */
  out.feu_prudence = (data.ptzGarde && data.ptzGarde.prudence) ? 'Oui — vert sans PTZ' : '—';
  return out;
}

/* ============================ CALCUL ============================ */
const AUTRES_RATE={retraite:1,pension:1,foncier:.7,rente:.7};
/* Le loyer que le client continuera de payer APRÈS l'opération. Sur une
   résidence principale, il déménage : son loyer disparaît, on ne le compte pas
   (la question ne lui est d'ailleurs plus posée). Sur un investissement
   locatif ou une résidence secondaire, il reste locataire de son logement :
   son loyer est une charge à part entière. */
function loyerQuiSubsiste(d){
  if(d.logement!=='locataire') return 0;
  if(d.projet==='principale' || d.projet==='renego') return 0;
  return d.loyer||0;
}
function mensualite(cap,dur,taux){const r=taux/12,n=dur*12;return cap*r/(1-Math.pow(1+r,-n));}
function capitalMax(m,dur,taux){const r=taux/12,n=dur*12;return m*(1-Math.pow(1+r,-n))/r;}
/* 07/10/2026 — data.primes porte désormais un montant ANNUEL : la question le
   demande explicitement. Or tous les calculs de revenus travaillent au MOIS.
   Ce passage par douze est donc obligatoire, et il n'existe qu'ICI pour qu'on
   ne puisse pas l'oublier à un endroit : sans lui, la part « primes » des
   revenus du ménage était multipliée par douze en silence, la capacité
   explosait et le feu passait au vert sur des dossiers qui ne le sont pas. */
function primesMois(d,i){ const a=d&&d.primes?d.primes[i]:0; return a>0 ? a/12 : 0; }
/* Arrondi au millier INFÉRIEUR, pour tout montant qu'on CONSEILLE au client
   (budget cible, capacité regagnée, PTZ estimé, capacité d'emprunt). Vers le
   bas et jamais vers le haut : arrondi par excès, le chiffre promettrait plus
   que ce que les revenus permettent. Demande de Christophe du 07/10/2026
   (« 134 000, ça suffit »). Les sommes à RÉUNIR (complément d'apport) et les
   COÛTS subis (frais d'acquisition) ne passent PAS par ici : les arrondir vers
   le bas dirait au client qu'il lui manque moins d'argent qu'en réalité. */
function millierBas(n){ return Math.floor(Math.max(0,Number(n)||0)/1000)*1000; }
function revenus(){
  let r=(data.salaire[0]||0)+primesMois(data,0);
  if(data.structure==='deux') r+=(data.salaire[1]||0)+primesMois(data,1);
  r+=(locCumul(data,'Loyer')||0)*0.7;
  if(data.autresType&&data.autresType!=='aucun') r+=(data.autresMontant||0)*(AUTRES_RATE[data.autresType]||0.7);
  return r;
}
function compute(){
  const dur=+(data.duree||25), taux=CONFIG.TAUX[dur]||0.0345;
  const rev=revenus(), charges=totalCredits(data)+(data.pensionv||0)+locCumul(data,'Mensualite')
    +loyerQuiSubsiste(data);
  const prix=prixTotal(data), travaux=data.travaux||0,
        apport=(data.apport||0)+apportVente(data);
  /* terrain + construction : les frais de notaire ne portent QUE sur le terrain
     (la construction est soumise à des frais réduits), d'où le calcul séparé. */
  const frais=(data.natureBien==='neuf')?CONFIG.FRAIS_NEUF
            :(data.natureBien==='terrain')?((data.prixTerrain||0)*CONFIG.FRAIS_ANCIEN+(data.prixConstruction||0)*CONFIG.FRAIS_NEUF)/Math.max(1,prix)
            :CONFIG.FRAIS_ANCIEN;
  const montant=data.projet==='renego'?prix:Math.max(0,(prix+travaux)+prix*frais-apport);
  const mens=mensualite(montant,dur,taux);
  /* --- Assurance emprunteur (décision 6, TOUS les dossiers) et PTZ (décisions
     1-9, 07/09/2026). Le taux d'endettement et la capacité comptent l'assurance
     (taux forfaitaire par âge sur le capital initial, PTZ compris) ; la
     mensualité retenue est la mensualité lissée quand un PTZ est calculé. --- */
  if(!window.PTZ) console.warn('[simulateur] moteur PTZ non chargé : calcul sans PTZ ni assurance');
  const ptz=simulerPtzDepuisData({montant, prix, frais, apport, dur, taux, rev, charges});
  const moteurAbsent=!ptz;   // 404, repli SPA, erreur de syntaxe ou moteur en erreur : ni PTZ ni assurance
  /* L'assurance est TOUJOURS estimée (elle s'affiche), mais elle n'entre dans
     le taux et la capacité que si CONFIG.ASSURANCE_DANS_LE_TAUX le dit. */
  const tauxAssReel=ptz ? ptz.assurance.taux : 0;
  const tauxAss=CONFIG.ASSURANCE_DANS_LE_TAUX ? tauxAssReel : 0;
  const assurance=montant*tauxAssReel/12;                 // toujours estimée : elle s'affiche
  const assDansTaux=CONFIG.ASSURANCE_DANS_LE_TAUX && assurance>0;
  /* Ce qui entre RÉELLEMENT dans le taux d'endettement. Séparé de `assurance`
     à dessein : la confondre avec le montant affiché, c'est remettre
     l'assurance dans les 35 % en croyant l'en avoir sortie. */
  const assTaux=CONFIG.ASSURANCE_DANS_LE_TAUX ? assurance : 0;
  const ptzCalcule=!!(ptz && ptz.calcule);
  const mensRetenue=ptzCalcule ? ptz.mensualiteAvecPtz : mens;
  const tauxEndSans=rev>0?(mens+assTaux+charges)/rev:1;
  const tauxEnd=rev>0?(mensRetenue+assTaux+charges)/rev:1;
  const capa=capitalMaxAssur(Math.max(0,rev*CONFIG.ENDETTEMENT_MAX-charges),dur,taux,tauxAss);
  const apportPct=prix>0?apport/prix:0;
  const statuts=[data.statut[0], data.structure==='deux'?data.statut[1]:null].filter(Boolean);
  /* 27/10/2026 — 'interim' AJOUTÉ ICI EN MÊME TEMPS que la case du parcours.
     C’est le SEUL garde-fou réel : sans lui, un intérimaire cesse d’être précaire
     et verdict() lui accorde un FEU VERT dès 35 % d’endettement et 5 % d’apport.
     Le second filet (« f==='vert' && !stable », quelques lignes plus bas) ne le
     rattrape pas pour un couple CDI + intérim, où `stable` vaut déjà true.
     Un faux vert ne se voit pas : il s’affiche au prospect, part en mail et
     classe le lead en vert chez le courtier.
     Et 'interim' ne doit JAMAIS rejoindre la liste `stable` ci-dessous : ce
     serait la même erreur en miroir, qui désarmerait aussi ce second filet. */
  const precaire=statuts.some(x=>['essai','cdd','interim','auto','autre'].includes(x));
  const stable=statuts.some(x=>['cdi','fonct'].includes(x));
  const verdict=t=>{
    let f='rouge';
    if(t<=CONFIG.ENDETTEMENT_MAX && apportPct>=0.05 && !precaire) f='vert';
    else if(t<=0.40 || apportPct>=0.10) f='orange';
    if(rev<1200) f='rouge';
    if(f==='vert' && !stable && statuts.length) f='orange';
    return f;
  };
  const feuSansPtz=verdict(tauxEndSans);
  const garde=gardeFousPtz(ptz, verdict(tauxEnd), feuSansPtz, tauxEnd);   // décision 7
  let feu=garde.feu;
  data.ptz=ptz; data.ptzGarde=garde;

  const fmt=n=>Math.round(n).toLocaleString('fr-FR')+' €';
  const V={vert:['🎉','g-vert','Votre projet a de bonnes bases 👍',"D'après vos réponses, votre projet semble finançable. Votre courtier va affiner et chercher le meilleur montage."],
    orange:['⚡','g-orange','Votre projet mérite qu\'on l\'optimise',"Des points sont à travailler (endettement, apport, durée ou statut), mais des solutions existent — c'est le rôle de votre courtier."],
    rouge: ORIGINE
      ? ['🔎','g-rouge','Votre projet demande une étude sur mesure',"Votre situation demande un montage adapté : votre conseiller vous rappelle pour étudier les solutions avec vous. Voici déjà ce qui peut changer la donne."]
      /* 07/10/2026 : « ne SEMBLE pas finançable », formulation reprise
         explicitement par Christophe. Une estimation qui ne connaît que vingt
         réponses ne peut pas affirmer un refus bancaire ; elle peut dire ce
         qu'elle voit, et dire qu'elle n'en sait pas plus. */
      : ['🔴','g-rouge','Ce projet ne semble pas finançable en l\'état',"A priori, il semble que le projet comporte un élément rédhibitoire. Rien n'est figé pour autant — voici ce qui peut changer la donne."]}[feu];
  /* Feu orange « par prudence » (décision 7) : le dossier serait vert sans le PTZ.
     Tout l'écran le dit — titre, accroche, diagnostic —, pas seulement le bloc PTZ.
     Le feu, lui, reste orange : c'est la décision. */
  if(feu==='orange' && garde.prudence){
    V[2]='Votre projet a de bonnes bases — un point à confirmer : votre prêt à taux zéro';
    V[3]="Sans le prêt à taux zéro, votre dossier tient déjà. Il reste à le confirmer avec votre courtier : une fois validé, il allège encore votre mensualité.";
  }
  let saut='';
  if((data.logement==='locataire'||data.logement==='proprio')&&data.loyer&&data.projet==='principale'){
    const d=Math.round(mensRetenue-data.loyer);
    saut = d>0?`Saut de charge estimé : +${fmt(d)}/mois vs votre logement actuel (${fmt(data.loyer)}).`:`Bonne nouvelle : la mensualité estimée est proche ou sous votre charge actuelle (${fmt(data.loyer)}).`;
  }
  /* Rachat : l'ecart entre le taux en cours et celui qu'on obtient aujourd'hui.
     C'est lui qui dit s'il y a un gain a aller chercher. Quand il n'y en a pas
     sur le taux, on le dit — faire esperer serait malhonnete. */
  let rachat='';
  if(data.projet==='renego'){
    const ta=data.tauxActuel||0, ref=taux*100;
    if(ta>0){
      /* Arrondi au centieme AVANT de comparer : sans lui, 3,65 % contre
         3,25 % tombait a 0,3999... et manquait le seuil de 0,40 point. */
      const ecart=Math.round(ta-ref*100)/100;
      const dit=`Votre taux actuel est de ${fmtTaux(ta)}. Aujourd’hui, la moyenne observée sur ${dur} ans tourne autour de ${fmtTaux(Math.round(ref*100))}.`;
      rachat = ecart>=0.40
        ? `${dit} L’écart est d’environ ${ecart.toFixed(2).replace('.',',')} point : le rachat mérite d’être étudié.`
        : (ecart<=-0.20
          ? `${dit} Votre taux est donc déjà meilleur que ce qui se pratique : un rachat pour le seul taux n’aurait pas d’intérêt. Le gain se cherche alors du côté de l’assurance emprunteur ou d’un regroupement de vos crédits.`
          : `${dit} Les deux sont proches : le gain se jouera plutôt sur la durée, l’assurance emprunteur ou le regroupement de vos crédits que sur le taux lui-même.`);
    } else if(lab('tauxActuel')){
      rachat = `Vous ne connaissez pas encore votre taux actuel : il figure sur votre offre de prêt ou sur votre tableau d’amortissement. C’est la première chose que votre courtier regardera pour chiffrer le gain possible.`;
    }
  }
  const D = diagnostic({feu,tauxEnd,apportPct,apport,prix,frais,statuts,rev,capa,dur,taux,
    credits:totalCredits(data), epargneMens:data.epargneMens||0, primo:estPrimo(data)?'oui':'non', ptz, fmt,
    /* Décision 7 : orange seulement à cause du plafond PTZ, dossier vert sans lui. */
    prudence:!!garde.prudence, prudenceConfirmer:garde.prudence?aConfirmerPrudence(ptz, ptz.endettement||{}):''});

  stage.innerHTML =
    `<div class="result f-${feu}">`+
      `<div class="verdict apparait"><div class="gauge ${V[1]}">${V[0]}</div>`+
      `<h2>${V[2]}</h2><p class="lead">${V[3]}</p></div>`+
      /* Les chiffres montent depuis zero : ils se lisent au lieu d'etre survoles. */
      `<div class="cards apparait d1">`+
      /* 07/10/2026 : « Capacité d'emprunt estimée » laisse la place à
         « Emprunt estimé ». La capacité est un plafond théorique, sans rapport
         avec le prix du bien ni l'apport : elle pouvait sembler faussée, et se
         lisait comme une promesse. Ce qu'on montre ici est le capital
         réellement emprunté — celui qui produit la mensualité d'à côté. */
      `<div class="card"><div class="n" data-vers="${Math.round(montant)}" data-unite=" €">${fmt(montant)}</div><div class="l">Emprunt estimé</div></div>`+
      `<div class="card"><div class="n" data-vers="${Math.round(tauxEnd*100)}" data-unite=" %">${(tauxEnd*100).toFixed(0)} %</div><div class="l">Taux d’endettement estimé${assDansTaux?`, assurance incluse<span class="sous">dont assurance estimée : ${fmt(assurance)}/mois</span>`:(assurance>0?`<span class="sous">hors assurance, estimée à ${fmt(assurance)}/mois</span>`:(moteurAbsent?`<span class="sous">assurance emprunteur non estimée (module indisponible)</span>`:''))}</div></div>`+
      /* Décision 5 : en titre la mensualité LISSÉE avec PTZ, la mensualité sans PTZ juste à côté. */
      (ptzCalcule
        ? `<div class="card"><div class="n" data-vers="${Math.round(mensRetenue)}" data-unite=" €">${fmt(mensRetenue)}</div><div class="l">Mensualité avec PTZ lissé (estimation)<span class="sous">sans PTZ : ${fmt(mens)}</span></div></div>`
        : `<div class="card"><div class="n" data-vers="${Math.round(mens)}" data-unite=" €">${fmt(mens)}</div><div class="l">Mensualité estimée${assurance>0?', hors assurance':''}${moteurAbsent&&ptzPossible(data)?`<span class="sous">Prêt à taux zéro : non évalué (module indisponible), votre courtier le calculera</span>`:''}</div></div>`)+
      `</div>`+
      blocPtz(ptz, garde)+
      (saut?`<div class="note apparait d2">${saut}</div>`:'')+
      (rachat?`<div class="note apparait d2">${rachat}</div>`:'')+
      /* Client d'apporteur : la carte de SON courtier ; la vidéo reste pour Christophe. */
      ((ORIGINE || PAGE_COURTIER) ? blocCourtier(feu) : '')+   /* page par courtier : la carte de SON courtier */
      (AUTRE_COURTIER ? '' : blocVideo())+
      /* Feu rouge : un seul bloc, constat puis conseils. Le diagnostic complet
         (blocages detailles, relance) partait dans tous les sens juste apres
         la video. Il continue de partir au courtier et au back-office. */
      (feu==='rouge' ? blocRouge(D,{apportPct,prix,fmt})
                     : (D.html?`<div class="apparait d3">${D.html}</div>`:''))+
      /* 07/10/2026 — coaching payant : feu ROUGE seulement, et hors parcours
         apporteur (on ne vend pas une prestation de Christophe au client d'un
         autre courtier).
         CORRECTIF DU MÊME JOUR — L'ARGUMENTAIRE GRATUIT PASSE AVANT. L'ordre
         précédent enchaînait : verdict rouge → conseils → offre à 190 € →
         porte gratuite. L'offre payante se trouvait donc entre la mauvaise
         nouvelle et le seul moyen gratuit de la corriger, alors que la page
         qualifie elle-même son verdict d'estimation indicative : c'est une
         pression commerciale, et c'est le point le plus attaquable du bloc.
         Le canal gratuit d'abord, le payant ensuite. */
      (feu==='rouge' ? blocArgumentaire() : '')+
      /* ⚠ 11/11/2026 : ajout de !AUTRE_COURTIER, par la raison déjà écrite deux lignes plus
         haut — on ne vend pas une prestation de Christophe au client d'un autre courtier.
         Sa propre page (/christophe-goubet) la propose toujours. */
      (feu==='rouge' && !ORIGINE && !AUTRE_COURTIER ? blocCoaching() : '')+
      /* Bouton RDV sur feu vert ET orange quand le courtier a un agenda ; sinon,
         sur feu vert, la note « on vous recontacte ». Rien sur feu rouge : le
         courtier n'y donne pas suite, le promettre serait mentir. */
      /* Client d'apporteur : l'appel, le mail et l'agenda sont dans sa carte. */
      /* Page d'un autre courtier : son appel, son mail et son agenda sont dans sa carte. */
      ((ORIGINE || AUTRE_COURTIER) ? '' :
      (feu==='vert'||feu==='orange') && RDV_URL!=='off'
        ? `<a class="cta apparait d4" href="${esc(RDV_URL)}">Prendre rendez-vous avec ${AFFICHE.nom}</a>`
        /* 07/10/2026 : phrase dictée par Christophe. C'est l'ÉQUIPE qui
           rappelle, pas « votre courtier » — le prospect ne sait pas encore
           qui le suivra, et on ne lui promet rien d'autre qu'un appel. Le nom
           vient de l'annuaire : le client d'un apporteur lit SON courtier. */
        : (feu==='vert'
            ? `<div class="note apparait d4" style="border-left-color:var(--vert);text-align:center;font-weight:600">\u{1F4DE} Un membre de l\u2019\u00e9quipe ${deNom(esc(AFFICHE.nom))}, ${AFFICHE.il==='elle'?'courti\u00e8re':'courtier'} en pr\u00eat immobilier, va vous contacter afin d\u2019\u00e9changer sur votre projet.</div>`
            : ''))+
      /* Client d'apporteur : plus d'accès direct à l'espace client (24/09/2026). */
      (ORIGINE ? '' : blocDossier(feu))+
      /* 07/10/2026 : le guide offert « Prêt refusé : les 8 erreurs à ne plus
         commettre » a été RETIRÉ des trois pages de résultat, à la demande de
         Christophe. Il continue d'être proposé dans le mail que le serveur
         envoie au prospect : seules les pages changent. */
      (AUTRE_COURTIER ? '' : blocReseaux())+
      blocModifier()+
      `<div class="sending" id="sending"><span class="dot"></span> Transmission de votre projet à votre courtier…</div>`+
      `<p class="disclaimer">Estimation indicative et non contractuelle (taux et durée moyens). Seule l’étude de votre dossier par votre courtier confirme la faisabilité et les conditions réelles.</p></div>`;
  dejaResultat=true;
  brancherResultat(feu);
  data.resultat={feu,tauxEndettement:+(tauxEnd*100).toFixed(1),capaciteEmprunt:millierBas(capa),montantAFinancer:Math.round(montant),mensualiteEstimee:Math.round(mensRetenue/10)*10,revenusPonderes:Math.round(rev),charges,duree:dur,
    blocages:D.raisonsTxt, leviers:D.leviersTxt, relanceMois:D.mois,
    /* PTZ + assurance (07/09/2026) : mensualité lissée en titre, sans PTZ à côté. */
    mensualiteSansPtz:Math.round(mens/10)*10, assurance:Math.round(assurance), assuranceDansTaux:assDansTaux, ptzTexte:texteCourtPtz(ptz, garde),
    prudencePtz:!!garde.prudence, prudenceMotif:motifPrudenceCourt(ptz, garde)};
  poserUrlVerdict(feu);   // avant pixelEvent : Meta lit l'adresse à cet instant
  pixelEvent(feu);
  sendToCourtier();
}

   Sortis de compute(), qui calcule deja assez. Chacun rend une chaine HTML. */

/* Carte du courtier choisi par l'apporteur (24/09/2026) : photo, nom, qui l'a
   recommandé, et de quoi le joindre. Toutes les valeurs viennent de l'annuaire
   ci-dessus, sauf le nom de l'apporteur (adresse, nettoyé puis échappé). */
function blocCourtier(feu){
  const C = DEST(), elle = C.il === 'elle';   /* un rachat : la carte de Christophe, qui reçoit le lead */
  const prenom = String(C.nom).split(' ')[0];
  const telNu = C.tel ? C.tel.replace(/[^\d+]/g, '') : '';
  const telLu = C.tel ? C.tel.replace(/^\+33\s?/, '0') : '';
  const phrase = feu === 'rouge'
    /* Feu rouge sur une page courtier : on ne promet pas d'appel (le courtier n'y donne pas
       suite), on ouvre la porte écrite — le message ci-dessous, et son WhatsApp. */
    ? (PAGE_COURTIER
        ? `Une question sur votre projet ? Écrivez à ${esc(prenom)} ci-dessous, ou contactez-${elle ? 'la' : 'le'} directement.`
        : `${esc(prenom)} a bien reçu votre projet et vous rappelle pour étudier les solutions avec vous.`)
    : `${esc(prenom)} a bien reçu votre projet et vous appelle très vite pour en parler.`;
  const reco = APPORTEUR_NOM
    ? `<span class="reco">Recommandé${elle ? 'e' : ''} par ${esc(APPORTEUR_NOM)}</span>` : '';
  const actions = [
    telNu   && `<a class="p" href="tel:${esc(telNu)}">Appeler ${esc(prenom)} · ${esc(telLu)}</a>`,
    /* WhatsApp : page par courtier seulement (retour CG du 09/11), message prérempli.
       Le parcours apporteur garde ses quatre actions d'avant — rien n'y bouge. */
    (PAGE_COURTIER && C.whatsapp) && `<a href="https://wa.me/${esc(C.whatsapp)}?text=${encodeURIComponent(messageWhatsApp())}" target="_blank" rel="noopener" data-wa="1">WhatsApp</a>`,
    C.email && `<a href="mailto:${esc(C.email)}">Lui écrire</a>`,
    C.rdv   && `<a href="${esc(C.rdv)}" target="_blank" rel="noopener">Réserver un créneau</a>`,
    C.carte && `<a href="${esc(C.carte)}" target="_blank" rel="noopener">Sa carte de visite</a>`
  ].filter(Boolean).join('');
  const R = AUTRE_COURTIER ? (C.reseaux || {}) : {};   // Christophe : ses réseaux ont leur bloc
  const rs = [['li', 'LinkedIn'], ['ig', 'Instagram'], ['tk', 'TikTok']].filter(([k]) => R[k])
    .map(([k, n]) => `<a href="${esc(R[k])}" target="_blank" rel="noopener">${n}</a>`).join(' · ');
  return `<div class="crt apparait d2">`+
    `<div class="tete">`+
      (C.photo ? `<img class="ph" src="${esc(C.photo)}" alt="${esc(C.nom)}" onerror="this.remove()">` : '')+
      `<span class="qui"><b>${esc(C.nom)}</b>`+
      `<span class="role">${elle ? 'Courtière' : 'Courtier'} en prêt immobilier · Pretto Galaxie</span>${reco}</span>`+
    `</div>`+
    `<p>${phrase}</p>`+
    `<div class="act">${actions}</div>`+
    (rs ? `<div class="rs">Suivre ${esc(prenom)} : ${rs}</div>` : '')+
  `</div>`;
}

/* Feu rouge. Un seul bloc apres la video : le verdict a deja dit que ce n'est
   pas possible en l'etat, celui-ci ne garde que les conseils. Le diagnostic
   detaille continue de partir au courtier et dans le back-office. */
function blocRouge(D, c){
  /* Quatre conseils au maximum. Au-dela, la liste se lit comme un mur et
     plus personne ne retient rien ; le diagnostic complet part au courtier. */
  const conseils = [...(D.leviers || [])].slice(0, 4);
  const neuf = conseilNeuf(c);
  if (neuf) { conseils.unshift(neuf); conseils.length = Math.min(conseils.length, 4); }
  return `<div class="cap apparait d3">`+
    `<h3>Pas de panique \u2014 voici ce qui peut d\u00e9bloquer votre projet</h3>`+
    `<p>Ces points-l\u00e0 se travaillent, et ce sont eux qui font basculer un dossier.</p>`+
    `<ol>`+conseils.map(x=>`<li class="cs">${x}</li>`).join('')+`</ol>`+
    (ORIGINE
      ? `<p class="fin">Votre conseiller vous rappelle tr\u00e8s vite pour en parler avec vous.</p>`
      : `<p class="fin">D\u00e8s qu\u2019ils ont boug\u00e9 \u2014 un CDI sign\u00e9, un cr\u00e9dit sold\u00e9, un apport constitu\u00e9 \u2014 revenez vers nous : c\u2019est \u00e0 ce moment-l\u00e0 qu\u2019un courtier change vraiment les choses.</p>`)+
  `</div>`;
}

/* Moins de 10 % d'apport : le neuf change l'equation, les frais de notaire y
   passent de ~8 % a ~3 %. Rendu comme un conseil parmi les autres plutot qu'en
   encadre a part. Muet sur un projet deja neuf ou un rachat.
   07/10/2026 — CES DEUX MONTANTS NE SONT PAS ARRONDIS AU MILLIER INFÉRIEUR,
   contrairement aux budgets conseilles, et c'est voulu : ce sont des COUTS, pas
   des cibles a atteindre. Arrondir un cout vers le bas dirait au client qu'il
   lui manque moins d'argent qu'en realite. Meme raison pour le complement
   d'apport (« Completer votre apport de X ») et pour les frais d'acquisition. */
function conseilNeuf(c){
  if(c.apportPct>=0.10 || data.natureBien==='neuf' || data.projet==='renego') return '';
  const total=prixTotal(data)||c.prix;
  const ancien=Math.round(total*CONFIG.FRAIS_ANCIEN), neuf=Math.round(total*CONFIG.FRAIS_NEUF);
  return `<b>Regarder du c\u00f4t\u00e9 du neuf.</b> Votre apport couvre ${Math.round(c.apportPct*100)} % du projet, `+
    `l\u00e0 o\u00f9 les banques en attendent 10 % dans l\u2019ancien. Dans le neuf ou en VEFA, les frais de notaire `+
    `tombent d\u2019environ ${c.fmt(ancien)} \u00e0 ${c.fmt(neuf)} et l\u2019apport demand\u00e9 descend autour de 5 % : `+
    `\u00e0 budget identique, c\u2019est souvent ce qui fait passer un dossier.`;
}

  };

}


/* ============== Coaching personnalisé, feu rouge seulement ==============
   07/10/2026, demande de Christophe. Deux contraintes commandent la rédaction.

   1. JURIDIQUE. L'article L. 519-6 du Code monétaire et financier interdit à un
      intermédiaire en opérations de banque de percevoir un versement d'un
      particulier AVANT l'obtention du prêt. Ce coaching ne tient donc que s'il
      reste une PRESTATION DE CONSEIL distincte du courtage : aucune recherche
      de financement, aucun dépôt de dossier en banque, aucun mandat, aucune
      promesse d'obtention. Et on n'écrit JAMAIS que payer augmente les chances
      d'obtenir un crédit — ce serait faux, et trompeur après un feu rouge.
      À FAIRE RELIRE par un avocat avant toute mise en ligne : le risque n'est
      pas écarté par la seule rédaction.
   2. LE LIEN. Tant que LIEN_COACHING est vide, la fonction rend une chaîne
      vide : aucun élément, pas même un conteneur. */
function blocCoaching(){
  const M = COACHING_MENTIONS;
  /* Tant qu'une seule case manque, la fonction ne rend RIEN — pas même un
     conteneur. On ne montre ni un bouton qui ne mène nulle part, ni un prix
     sans son régime de TVA, ni une vente à distance sans vendeur nommé, sans
     conditions générales et sans médiateur de la consommation. */
  if(!/^https:\/\//.test(LIEN_COACHING) || !/^https:\/\//.test(M.cgv||'')) return '';
  if(!M.vendeur || !M.intervenant || !M.tva || !M.mediateur || !M.delaiPlan) return '';
  return `<div class="coach apparait d4">`+
    `<span class="sur">Prestation facultative et séparée · ${esc(PRIX_COACHING)}</span>`+
    `<h3>Je souhaiterais avoir un coaching personnalisé</h3>`+
    /* L'attaque ouvre par la PORTE GRATUITE, et ne rappelle pas le feu rouge :
       rappeler la mauvaise nouvelle en tête d'un argumentaire de vente était
       le plus attaquable. Elle ne vend pas non plus « la version précise » de
       ce que l'écran d'entrée a promis gratuitement — ce serait un produit
       d'appel — mais ce que ce rendez-vous a de différent par nature. */
    `<p><b>La simulation et l’avis de faisabilité restent gratuits</b>, et rien ne vous oblige à acheter quoi que ce soit : si l’estimation a manqué un élément, dites-le dans le champ ci-dessus — c’est gratuit, et votre courtier le lira.</p>`+
    `<p>Si vous souhaitez aller plus loin, nous proposons autre chose, par nature : un rendez-vous individuel, au cours duquel vos documents réels sont lus et vos questions reçoivent une réponse de vive voix. Un questionnaire ne sait pas faire cela.</p>`+
    `<ul>`+
      `<li><b>Un rendez-vous individuel de 45 minutes</b>, en visioconférence ou par téléphone, avec ${esc(M.intervenant)}.</li>`+
      `<li><b>Une estimation détaillée de votre capacité d’emprunt</b> : revenus retenus et leur pondération, charges, crédits en cours, taux d’endettement, reste à vivre, durée. Vous repartez avec les chiffres et la méthode qui les produit. Ce sont des estimations : elles n’engagent aucune banque.</li>`+

    `</ul>`+
    /* La substance de l'article L. 519-6 est dite EN CLAIR, sans guillemets ni
       italique et sans citation attribuée : la phrase mise entre guillemets

    `<p class="garde"><b>Ce que ce coaching n’est pas.</b> C’est une prestation de conseil, facturée pour le temps d’analyse et pour le document de travail qui vous est remis. Elle ne comprend ni recherche de financement, ni montage ou dépôt d’un dossier en banque, ni démarche auprès d’un établissement prêteur ; elle ne vaut pas mandat de recherche de capitaux et ne constitue pas une demande de prêt. Aucune somme ne vous sera jamais demandée pour la recherche de votre financement : une mission de courtage n’est rémunérée qu’après le déblocage effectif des fonds, et le prix de ce coaching ne s’y impute pas.</p>`+
    `<p class="garde garde-forte">Payer ce coaching <b>n’améliore pas vos chances d’obtenir un crédit</b> : la décision appartient entièrement aux banques.</p>`+

/* Branche tout ce qui bouge sur l'ecran de resultat. */
function brancherResultat(feu){
  animerChiffres();
  if(feu==='vert') confettis();

  const play=document.getElementById('playCg'), video=document.getElementById('videoCg');
  if(play&&video) play.addEventListener('click',()=>{
    play.style.display='none';
    const lgd=document.getElementById('videoLgd'); if(lgd) lgd.style.display='none';
    video.play();
  });

  const btn=document.getElementById('btnModif');
  /* 07/10/2026 : le premier écran visible est maintenant celui des
     coordonnées. Reprendre ses réponses ramène donc à la première QUESTION,
     pas à un formulaire déjà rempli qu'il n'a aucune raison de relire. */
  if(btn) btn.addEventListener('click',()=>{ retirerUrlVerdict(); curId=(visible().find(x=>x.type!=='identity')||visible()[0]).id; render(); window.scrollTo({top:0,behavior:'smooth'}); });

  const txt=document.getElementById('arguTxt'), go=document.getElementById('arguGo');
  if(txt&&go){
    txt.addEventListener('input',()=>{ go.disabled = txt.value.trim().length < 10; });
    go.addEventListener('click',()=>envoyerArgumentaire(txt,go));
  }
}

/* Compteurs : de 0 a la valeur en 900 ms, courbe qui ralentit a l'arrivee. */
function animerChiffres(){
  const dur=900, reduit=matchMedia('(prefers-reduced-motion:reduce)').matches;
  document.querySelectorAll('.result .card .n[data-vers]').forEach(el=>{
    const cible=+el.dataset.vers||0, unite=el.dataset.unite||'';
    const ecrire=v=>{ el.textContent=Math.round(v).toLocaleString('fr-FR')+unite; };
    /* La valeur exacte est deja dans le HTML : si rien n'anime (onglet en
       arriere-plan, JS partiel), le prospect lit le bon chiffre quand meme. */
    if(reduit){ ecrire(cible); return; }
    const t0=performance.now();
    const pas=t=>{
      const p=Math.min(1,(t-t0)/dur);
      ecrire(cible*(1-Math.pow(1-p,3)));
      if(p<1) requestAnimationFrame(pas);
    };
    requestAnimationFrame(pas);
  });
}

/* Confettis du feu vert. Fait maison : aucune librairie a charger, le canvas
   se retire tout seul au bout de 4 s et n'intercepte jamais un clic. */
function confettis(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const cv=document.createElement('canvas'); cv.id='confetti';
  document.body.appendChild(cv);
  const ct=cv.getContext('2d'), dpr=Math.min(2,window.devicePixelRatio||1);
  const dim=()=>{ cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; ct.setTransform(dpr,0,0,dpr,0,0); };
  dim(); addEventListener('resize',dim);
  const teintes=['#0C806E','#98AF24','#F2EE25','#3956D6','#A8E0AC','#ffffff'];
  const P=[];
  for(let i=0;i<130;i++) P.push({
    x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*0.5,
    l:6+Math.random()*7, h:9+Math.random()*10,
    vy:2.2+Math.random()*3.1, vx:-1.2+Math.random()*2.4,
    a:Math.random()*Math.PI, va:-0.12+Math.random()*0.24,
    c:teintes[(Math.random()*teintes.length)|0]
  });
  const t0=performance.now();
  (function tour(t){
    const age=t-t0;
    ct.clearRect(0,0,innerWidth,innerHeight);
    ct.globalAlpha = age>2600 ? Math.max(0,1-(age-2600)/1400) : 1;
    P.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.a+=p.va; p.vx+=Math.sin(age/600+p.y/90)*0.02;
      ct.save(); ct.translate(p.x,p.y); ct.rotate(p.a);
      ct.fillStyle=p.c; ct.fillRect(-p.l/2,-p.h/2,p.l,p.h); ct.restore();
    });
    if(age<4000) requestAnimationFrame(tour); else cv.remove();
  })(t0);
}


/* ================= DIAGNOSTIC PERSONNALISÉ (orange / rouge) =================
   Traduit les blocages déjà détectés par compute() en explications concrètes,
   leviers chiffrés et délai réaliste avant de revenir vers le courtier.
   Rien ne s'affiche si le projet est finançable en l'état (feu vert). */
function diagnostic(c){
  const vide={html:'',raisonsTxt:'—',leviersTxt:'—',mois:0};
  if(c.feu==='vert') return vide;
  const fmt=c.fmt, R=[], L=[], st=v=>c.statuts.includes(v);
  const fraisEuros=Math.round(c.prix*c.frais);
  /* 07/10/2026 : sur une RENÉGOCIATION il n'y a pas de bien à acheter. Les
     leviers « frais d'acquisition », « budget cible » et « PTZ » n'y veulent
     rien dire — ils conseillaient 24 000 € de frais de notaire sur un prêt que
     le client détient déjà, et un « autre secteur » pour un achat inexistant. */
  const RACHAT=data.projet==='renego';
  let mois=0;

  /* Endettement au-delà du plafond bancaire */
  if(c.tauxEnd>CONFIG.ENDETTEMENT_MAX){
    R.push(`Votre taux d'endettement ressort à <b>${(c.tauxEnd*100).toFixed(0)} %</b>, au-dessus du plafond de 35 % que les banques appliquent.`);
    if(c.dur<25) L.push(`<b>Allonger la durée à 25 ans.</b> La mensualité baisse et l'endettement avec elle : c'est le levier le plus rapide, et il ne coûte rien à tester.`);
    /* Arrondi au millier INFÉRIEUR (07/10/2026) : un budget conseillé ne doit
       jamais annoncer plus que ce que les revenus permettent de financer. Sous
       1 000 € le levier ne s'affiche pas du tout, plutôt que de conseiller
       « un budget de l'ordre de 0 € ». */
    const budgetMax=millierBas((c.capa+c.apport)/(1+c.frais));
    /* Plancher de lisibilité : sous 50 000 €, citer un montant n'a plus de sens
       (« un budget de l'ordre de 1 000 € »), et l'arrondi au millier inférieur
       pouvait même faire disparaître le levier (999,99 € → 0, plus aucun
       conseil sur ce point). On garde alors la phrase, sans aucun chiffre. */
    const PLANCHER_BUDGET=50000;
    if(!RACHAT&&c.prix>0&&budgetMax<PLANCHER_BUDGET) L.push(`<b>Revoir la cible du projet.</b> L'écart avec ${fmt(c.prix)} est trop important pour se rattraper sur la durée ou le taux. Emprunter à deux, viser un autre secteur ou décaler d'un an change en revanche toute l'équation.`);
    else if(!RACHAT&&budgetMax>0&&budgetMax<c.prix) L.push(budgetMax<c.prix*0.55
      ? `<b>Revoir la cible du projet.</b> Vos revenus actuels financent un budget de l'ordre de ${fmt(budgetMax)} : l'écart avec ${fmt(c.prix)} est trop important pour se rattraper sur la durée ou le taux. Emprunter à deux, viser un autre secteur ou décaler d'un an change en revanche toute l'équation.`
      : `<b>Viser un budget autour de ${fmt(budgetMax)}</b> plutôt que ${fmt(c.prix)} : c'est ce que vos revenus permettent de financer aujourd'hui, sans se mettre en difficulté.`);
    mois=Math.max(mois,3);
  }

  /* Crédits en cours — seulement s'ils pèsent réellement sur l'endettement */
  if(c.credits>0&&c.tauxEnd>CONFIG.ENDETTEMENT_MAX){
    R.push(`Vos crédits en cours pèsent <b>${fmt(c.credits)} par mois</b> : autant de capacité d'emprunt en moins.`);
    L.push(`<b>Solder ces crédits avant de déposer le dossier</b> vous rendrait environ ${fmt(millierBas(capitalMax(c.credits,c.dur,c.taux)))} de capacité d'emprunt.`);
    mois=Math.max(mois,6);
  }

  /* Les leviers propres à une RENÉGOCIATION, à la place de ceux de l'achat. Le
     texte reprend ce que dit déjà la note « rachat » de compute(). */
  if(RACHAT){
    if(c.dur>=25) L.push(`<b>Faire chiffrer l'assurance emprunteur à part.</b> Une délégation d'assurance coûte souvent nettement moins que le contrat de la banque, à garanties équivalentes : ce gain-là se cumule avec celui du taux.`);
    else L.push(`<b>Allonger la durée du nouveau prêt</b>, et faire chiffrer l'assurance emprunteur à part : une délégation d'assurance coûte souvent nettement moins que le contrat de la banque, à garanties équivalentes.`);
    if(c.credits>0) L.push(`<b>Regrouper vos autres crédits dans la même opération.</b> Un rachat est le moment où cela se fait : une seule mensualité, calée sur la durée du prêt immobilier.`);
  }

  /* Apport insuffisant pour couvrir les frais d'acquisition */
  if(!RACHAT&&c.prix>0&&c.apport<fraisEuros){
    const manque=fraisEuros-c.apport;
    R.push(`Votre apport (${fmt(c.apport)}) ne couvre pas encore les frais d'acquisition, estimés à <b>${fmt(fraisEuros)}</b> — des frais que les banques financent rarement.`);
    let l=`<b>Compléter votre apport de ${fmt(manque)}.</b>`;
    if(c.epargneMens>0){
      const m=Math.ceil(manque/c.epargneMens);
      if(m<=24){ l+=` À votre rythme d'épargne actuel (${fmt(c.epargneMens)}/mois), comptez environ ${m} mois.`; mois=Math.max(mois,m); }
      else { l+=` À votre rythme actuel (${fmt(c.epargneMens)}/mois), cela demanderait plusieurs années : le levier le plus efficace est ici de viser un bien moins cher, ou d'acheter à deux.`; mois=Math.max(mois,12); }
    } else {
      /* 07/10/2026 : Christophe veut qu'on cite aussi la donation familiale —
         c'est, dans les faits, ce qui débloque le plus souvent un apport. Le
         virement automatique reste, il ne le remplace pas. */
      l+=` Mettre en place un virement automatique dès maintenant est aussi le meilleur signal que vous puissiez envoyer à une banque. Regardez en parallèle du côté d’une donation familiale (parents, grands-parents) ou d’un prêt familial : c’est souvent ce qui complète un apport le plus vite.`;
      mois=Math.max(mois,6);
    }
    L.push(l);
    /* PTZ calculé : on donne le résultat, pas un conseil de vérification. Sans
       calcul (commune inconnue, ou moteur absent) : le conseil d'origine. Dans
       l'ancien ou pour « Autre », rien (décision 1). */
    /* 07/10/2026 — PAS d'arrondi ici, contrairement aux budgets conseillés : le
       PTZ est un montant CALCULÉ, déjà injecté dans la mensualité lissée
       affichée plus haut. L'arrondir au millier inférieur faisait dire à la
       même page deux chiffres différents pour le même prêt (73 825 € dans le
       bloc PTZ, 73 000 € ici), et la phrase « intégré à la mensualité lissée
       ci-dessus » devenait fausse pour le chiffre qu'elle portait. */
    if(c.ptz && c.ptz.calcule) L.push(`<b>Votre prêt à taux zéro est déjà compté.</b> PTZ estimé à ${fmt(c.ptz.montant)} à 0 %${c.ptz.differe>0?`, sans mensualité pendant ${c.ptz.differe} ans`:''}, intégré à la mensualité lissée ci-dessus — PTZ estimé sur vos déclarations, à confirmer par votre courtier. Il ne couvre pas les frais d'acquisition.`);
    else if(c.primo==='oui' && (!c.ptz || (c.ptz.statut==='a_verifier' && !c.ptz.calcule))) L.push(`<b>Faire vérifier votre éligibilité au prêt à taux zéro.</b> Vous êtes primo-accédant : selon la zone et vos revenus, le PTZ peut remplacer une partie de l'apport. Votre courtier le contrôle en quelques minutes.`);
  }

  /* Stabilité professionnelle */
  if(st('essai')){
    R.push(`Une période d'essai est en cours : les banques attendent presque toujours sa validation avant d'engager un prêt.`);
    L.push(`<b>Redéposer le dossier dès la fin de votre période d'essai.</b> Tout le reste peut se préparer d'ici là — c'est autant de temps gagné.`);
    mois=Math.max(mois,4);
  }
  /* 27/10/2026 : la case a été scindée en « CDD » et « Intérim », et ce bloc est
     élargi aux DEUX cas (arbitrage de Christophe : « élargis le bouton aux deux
     cas »). Le texte parlait déjà des deux situations, seule la condition
     manquait. Sans ce « || st('interim') », un intérimaire perdait sa raison ET
     son levier, `mois` n’était plus porté à 6, et le filet générique « votre
     dossier est jouable, mais… » prenait sa place : le prospect ne lisait plus
     jamais que son intérim est le point bloquant. */
  if(st('cdd') || st('interim')){
    R.push(`Un CDD ou une mission d'intérim se finance difficilement seul, sauf ancienneté longue dans le même secteur.`);
    L.push(`<b>Un passage en CDI change tout.</b> À défaut, une continuité de revenus sur trois ans dans le même domaine est retenue par certaines banques : votre courtier sait lesquelles.`);
    mois=Math.max(mois,6);
  }
  if(st('auto')){
    R.push(`En auto-entreprise, les banques demandent en général <b>deux à trois exercices complets</b> avant de retenir vos revenus.`);
    L.push(`<b>Attendre votre deuxième bilan complet</b>, en gardant des comptes sans découvert sur toute la période : c'est le premier point qui sera examiné.`);
    mois=Math.max(mois,12);
  }

  /* Revenus trop justes pour un financement seul */
  if(c.rev<1200){
    R.push(`Les revenus retenus (${fmt(c.rev)} par mois) restent sous le seuil à partir duquel une banque instruit un prêt immobilier.`);
    L.push(`<b>Emprunter à deux</b>, ou faire intervenir un co-emprunteur : la base de calcul change, et avec elle la plupart des refus.`);
    mois=Math.max(mois,6);
  }

  /* Filet : orange sans blocage chiffrable identifié. Jamais sur un feu orange
     « par prudence » : le dossier n'est pas « dans la zone où tout se joue », il
     est déjà bon sans le PTZ (décision 7). */
  if(!R.length && !c.prudence){
    R.push(`Votre dossier est jouable, mais il se situe dans la zone où tout se joue sur la présentation : ancienneté, tenue des comptes, épargne qui reste après l'achat.`);
    L.push(`<b>Trois relevés de comptes sans découvert avant le dépôt.</b> C'est le premier réflexe de tout analyste bancaire, et ce qui fait basculer les dossiers limites.`);
    mois=Math.max(mois,3);
  }

  /* Feu orange « par prudence » : le seul point ouvert est le prêt à taux zéro.
     En tête de liste, et sans délai de relance — il n'y a rien à retravailler. */
  if(c.prudence){
    const quoi=(c.ptz&&c.ptz.calcule)?'Le prêt à taux zéro que nous avons estimé':'Le prêt à taux zéro auquel vous semblez éligible';
    R.unshift(`Sans le PTZ, votre dossier tient déjà. ${quoi} reste à confirmer par votre courtier ${c.prudenceConfirmer} ; une fois confirmé, il allège encore votre mensualité.`);
    /* La commune A été saisie mais sa zone reste introuvable : on ne lui demande
       pas de « préciser la commune » qu'il vient de donner (06/09/2026). */
    const motifZone=c.ptz&&c.ptz.motif;
    L.unshift(motifZone==='zone_introuvable'
      ? `<b>Faire vérifier la zone de votre commune.</b> Nous n'avons pas retrouvé ${c.ptz.commune?esc(c.ptz.commune):'votre commune'} dans le zonage officiel : la zone (A bis, A, B1, B2, C) fixe le montant du prêt à taux zéro, votre courtier la confirme en quelques minutes.`
      : motifZone==='zone_inconnue'
      ? `<b>Préciser la commune du bien à votre courtier.</b> La zone (A bis, A, B1, B2, C) fixe le montant du prêt à taux zéro : c'est la seule information qui manque pour le chiffrer.`
      : `<b>Mettre la main sur votre avis d’imposition.</b> C'est le revenu fiscal de référence, et non votre salaire, qui fixe le montant du prêt à taux zéro : votre courtier confirme le calcul en quelques minutes.`);
  }

  const html =
    `<div class="diag">`+
    `<h3>${c.feu==='rouge'?"Pourquoi ça bloque aujourd'hui":(c.prudence&&R.length===1?"Le point à confirmer":"Les points à travailler")}</h3><ul>`+
    R.map(r=>`<li class="r">${r}</li>`).join('')+`</ul>`+
    `<h3 class="plus">${c.prudence&&L.length===1?"Ce qui le confirmera":"Ce qui débloquerait votre projet"}</h3><ol>`+
    L.map(l=>`<li class="lv">${l}</li>`).join('')+`</ol></div>`+
    /* Pas de delai annonce : un « on se reparle dans 6 mois » se lit comme une
       mise au placard. Le courtier traite ces dossiers, il le dit simplement. */
    /* 07/10/2026 : c'est le SEUL bloc du feu orange qui porte la promesse de
       rappel — le vert a sa note téléphone, le rouge n'en a pas, et ce
       diagnostic complet ne sort que sur orange. La phrase dictée par
       Christophe va donc ici, dans les mêmes termes que celle du feu vert. */
    `<div class="relance"><span class="t">Un membre de l’équipe va vous contacter</span>`+
    `<p>Nous avons bien reçu votre demande. Un membre de l’équipe ${deNom(esc(AFFICHE.nom))}, ${AFFICHE.il==='elle'?'courtière':'courtier'} en prêt immobilier, va vous contacter afin de faire le point sur ${c.prudence?'votre prêt à taux zéro':'les points ci-dessus'} — si votre situation évolue d’ici là, écrivez-nous.</p>`+
    `<small>Vos réponses et vos coordonnées sont transmises à votre courtier Pretto Galaxie pour ce seul suivi. Vous pouvez demander leur suppression à tout moment.</small></div>`;

  const plat=a=>a.map(x=>x.replace(/<[^>]+>/g,'')).join(' | ');
  return {html, raisons:R, leviers:L, raisonsTxt:plat(R), leviersTxt:plat(L), mois};
}
